<div class="max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-[#000]">Chat Saver</h1>
      <p class="text-[15px] text-[#8e8e93] mt-1">Zapisz ważne rozmowy i chat prompty</p>
    </div>
    <button onclick="showAddChatModal()" class="btn-primary w-auto flex items-center gap-2" style="width: auto;"><i data-lucide="plus" class="w-5 h-5"></i>Nowa rozmowa</button>
  </div>
  <div class="ios-card bg-[rgba(0,122,255,0.05)] border border-[#007aff] mb-4">
    <div class="px-4 py-3 text-[15px] text-[#007aff]">💡 Kopiuj rozmowy z ChatGPT, Claude lub innego AI. Każda rozmowa zapisywana jest w bazie wiedzy.</div>
  </div>
  <div id="chats-list" class="ios-card">${skeleton(5)}</div>
</div>
<script id="chat-modal-template" type="text/template">
<div class="modal-sheet"><div class="modal-handle"></div><div class="px-6 py-4"><h2 class="text-[20px] font-bold mb-4">{{ title }}</h2><div class="space-y-4 max-h-[70vh] overflow-y-auto"><div><label class="block text-[13px] font-semibold text-[#8e8e93] mb-2">Temat rozmowy *</label><input type="text" id="modal-chat-title" class="ios-input" placeholder="np. Pytania o API"></div><div><label class="block text-[13px] font-semibold text-[#8e8e93] mb-2">Model AI</label><select id="modal-chat-model" class="ios-select"><option value="ChatGPT">ChatGPT</option><option value="Claude">Claude</option><option value="Gemini">Gemini</option><option value="inne">Inne</option></select></div><div><label class="block text-[13px] font-semibold text-[#8e8e93] mb-2">Treść rozmowy (Markdown)</label><textarea id="modal-chat-content" class="ios-textarea" placeholder="Wklej całą rozmowę..." style="min-height: 250px;"></textarea></div><div><label class="block text-[13px] font-semibold text-[#8e8e93] mb-2">Tagi</label><input type="text" id="modal-chat-tags" class="ios-input" placeholder="np. api, python, prompt"></div><div class="flex gap-3 pt-4"><button onclick="closeModal(); saveChat();" class="btn-primary">Zapisz</button><button onclick="closeModal(); if(window.editingChatId) deleteChat(window.editingChatId);" id="delete-chat-btn" class="btn-destructive hidden">Usuń</button><button onclick="closeModal()" class="btn-secondary">Anuluj</button></div></div></div></div>
</script>
<script>
let allChats = [];
function initModule() { loadChats(); }
function loadChats() { google.script.run.withSuccessHandler(function(result) { if (result.success) { allChats = result.data.filter(item => item.kategoria === 'chat' || item.tagi.includes('chat-saver')); renderChats(); } }).getKnowledge(); }
function renderChats() { if (allChats.length === 0) { document.getElementById('chats-list').innerHTML = `<div class="empty-state py-8"><div class="empty-state-icon">💬</div><div class="empty-state-title">Brak rozmów</div><div class="empty-state-text">Kliknij "Nowa rozmowa", aby zapisać pierwszą rozmowę</div></div>`; return; } const sorted = allChats.sort((a, b) => new Date(b.data_utworzenia) - new Date(a.data_utworzenia)); const html = sorted.map(chat => `<div class="ios-row cursor-pointer" onclick="showEditChatModal('${escapeHtml(chat.id)}')"><div class="flex-1 min-w-0"><div class="text-[15px] font-medium text-[#000] truncate">${escapeHtml(chat.tytul)}</div><div class="text-[13px] text-[#8e8e93] mt-1">${escapeHtml(chat.kategoria || 'chat')} • ${formatDateTime(chat.data_utworzenia)}</div>${chat.tagi ? `<div class="text-[12px] text-[#007aff] mt-1">${escapeHtml(chat.tagi).split(',').slice(0, 2).join(' • ')}</div>` : ''}</div><i data-lucide="chevron-right" class="w-5 h-5 text-[#c6c6c8] flex-shrink-0"></i></div>`).join(''); document.getElementById('chats-list').innerHTML = html; lucide.createIcons(); }
function showAddChatModal() { window.editingChatId = null; const modal = document.getElementById('chat-modal-template').innerHTML.replace('{{ title }}', 'Nowa rozmowa'); const tempDiv = document.createElement('div'); tempDiv.innerHTML = modal; showModal(tempDiv.innerHTML); document.getElementById('delete-chat-btn').classList.add('hidden'); }
function showEditChatModal(chatId) { window.editingChatId = chatId; const chat = allChats.find(c => c.id === chatId); if (!chat) return; const modal = `<div class="modal-sheet"><div class="modal-handle"></div><div class="px-6 py-4 max-h-[80vh] overflow-y-auto"><h2 class="text-[20px] font-bold mb-2">${escapeHtml(chat.tytul)}</h2><div class="flex gap-2 mb-4"><span class="text-[13px] text-[#8e8e93]">🤖 ${escapeHtml(chat.kategoria || 'chat')}</span><span class="text-[13px] text-[#8e8e93]">📅 ${formatDateTime(chat.data_utworzenia)}</span></div><div class="divider mb-4"></div>${renderMarkdown(chat.tresc)}<div class="flex gap-3 pt-4 mt-4 border-t"><button onclick="closeModal(); editChat('${escapeHtml(chat.id)}');" class="btn-primary">Edytuj</button><button onclick="closeModal(); deleteChat('${escapeHtml(chat.id)}');" class="btn-destructive">Usuń</button><button onclick="closeModal()" class="btn-secondary">Zamknij</button></div></div></div>`; showModal(modal); }
function editChat(chatId) { const chat = allChats.find(c => c.id === chatId); if (!chat) return; window.editingChatId = chatId; const modal = document.getElementById('chat-modal-template').innerHTML.replace('{{ title }}', 'Edytuj rozmowę'); const tempDiv = document.createElement('div'); tempDiv.innerHTML = modal; showModal(tempDiv.innerHTML); document.getElementById('modal-chat-title').value = chat.tytul; document.getElementById('modal-chat-model').value = chat.kategoria || 'ChatGPT'; document.getElementById('modal-chat-content').value = chat.tresc || ''; document.getElementById('modal-chat-tags').value = chat.tagi || ''; document.getElementById('delete-chat-btn').classList.remove('hidden'); }
function saveChat() { const title = document.getElementById('modal-chat-title').value.trim(); if (!title) { showError('Temat rozmowy jest wymagany'); return; } const chatData = { tytul: title, kategoria: 'chat', tresc: document.getElementById('modal-chat-content').value, tagi: 'chat-saver,' + document.getElementById('modal-chat-tags').value, widocznosc: 'prywatny' }; if (window.editingChatId) { chatData.id = window.editingChatId; google.script.run.withSuccessHandler(function(result) { if (result.success) { showSuccess('Rozmowa zaktualizowana'); loadChats(); } else showError('Błąd: ' + result.error); }).updateKnowledge(chatData); } else { google.script.run.withSuccessHandler(function(result) { if (result.success) { showSuccess('Rozmowa zapisana'); loadChats(); } else showError('Błąd: ' + result.error); }).createKnowledge(chatData); } }
function deleteChat(chatId) { if (!confirm('Czy na pewno chcesz usunąć tę rozmowę?')) return; google.script.run.withSuccessHandler(function(result) { if (result.success) { showSuccess('Rozmowa usunięta'); loadChats(); } else showError('Błąd: ' + result.error); }).deleteKnowledge(chatId); }
</script>
