// ── Fundament: te same helpery co w Cerebro Hub ───────────────

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function ikona(id,kl){
  return '<svg class="'+(kl||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+(IKONY[id]||'')+'</svg>';
}
function skeleton(n){
  var o='';
  for(var i=0;i<(n||3);i++) o+='<div class="skeleton-line" style="width:'+(100-i*12)+'%"></div>';
  return '<div style="padding:16px">'+o+'</div>';
}
function pusto(ikonka,tytul,tekst){
  return '<div class="empty-state"><div class="empty-state-icon">'+ikonka+'</div>'+
    '<div class="empty-state-title">'+esc(tytul)+'</div>'+
    '<div class="empty-state-text">'+esc(tekst||'')+'</div></div>';
}
function chev(){
  return '<svg class="ios-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
}
function fmtHM(m){
  var n=parseInt(m,10); if(isNaN(n)) return '—';
  return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
}
function t2m(t){var p=String(t).split(':');return parseInt(p[0],10)*60+parseInt(p[1],10);}
function m2t(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function hm(m){var h=Math.floor(m/60),x=m%60;return h&&x?h+' h '+x+' min':(h?h+' h':x+' min');}
function dzisStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function osobaNazwa(id){
  var e=S.emps.find(function(x){return x.id===id;});
  if(e) return e.imie+' '+e.nazwisko;
  var z=(S.gr&&S.gr.asystaZew||[]).find(function(x){return x.id===id;});
  return z?z.label:id;
}

var _toastT;
function showToast(msg,rodzaj){
  var box=document.getElementById('cb-toasts');
  var el=document.createElement('div');
  el.className='cb-toast'+(rodzaj?' '+rodzaj:'');
  el.textContent=msg;
  box.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },2800);
}
function showInfo(m){showToast(m);}
function showOk(m){showToast(m,'ok');}
function showErr(m){showToast(m,'err');}

function setConn(ok,txt){
  document.getElementById('cb-dot').className='cb-conn-dot'+(ok?'':' err');
  document.getElementById('cb-conn-txt').textContent=txt;
}

function gas(akcja,args,cb){
  google.script.run
    .withSuccessHandler(function(res){
      setConn(true,'Połączono');
      try{ cb(res); }catch(ex){ showErr('Błąd: '+ex.message); }
    })
    .withFailureHandler(function(e){
      var m=(e&&e.message)||'Błąd połączenia';
      setConn(false,m);
      showErr(m);
    })
    .callRCP(akcja,JSON.stringify(args||[]));
}

function showModal(html){
  document.getElementById('cb-modal-body').innerHTML=
    '<div class="modal-handle"></div>'+html;
  document.getElementById('cb-modal').classList.add('on');
}
function closeModal(){ document.getElementById('cb-modal').classList.remove('on'); }
document.getElementById('cb-modal').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});

// ── Nawigacja modułów (wzorzec navigateTo z Huba) ─────────────

function budujNav(){
  document.getElementById('cb-nav').innerHTML=
    '<div class="cb-nav-lbl">Moduły</div>'+
    MODULY.map(function(m){
      return '<button class="cb-nav-item'+(m.id===S.modul?' on':'')+'" data-mod="'+m.id+'">'+
        ikona(m.id)+'<span>'+esc(m.nazwa)+'</span></button>';
    }).join('');
  document.querySelectorAll('#cb-nav [data-mod]').forEach(function(b){
    b.addEventListener('click',function(){ navigateTo(this.getAttribute('data-mod')); });
  });
}

function navigateTo(mod){
  S.modul=mod;
  budujNav();
  var m=MODULY.find(function(x){return x.id===mod;})||MODULY[0];
  document.getElementById('cb-mtitle').textContent=m.nazwa;
  document.body.classList.remove('cb-nav-open');
  var c=document.getElementById('cb-content');
  c.className='cb-content cb-fade';
  c.scrollTop=0;
  ({
    pulpit:modPulpit, grafik:modGrafik, zespol:modZespol, raporty:modRaporty,
    dzien:modDzien, miesiac:modMiesiac, urlop:modUrlop, wolne:modWolne,
    kod:modKod, pomoc:modPomoc
  }[mod]||modPulpit)();
}

function naglowek(tytul,opis,akcje){
  return '<div class="cb-head"><div><h1 class="cb-h1">'+esc(tytul)+'</h1>'+
    '<p class="cb-sub">'+esc(opis)+'</p></div>'+(akcje||'')+'</div>';
}

document.getElementById('cb-burger').addEventListener('click',function(){
  document.body.classList.toggle('cb-nav-open');
});
document.getElementById('cb-overlay').addEventListener('click',function(){
  document.body.classList.remove('cb-nav-open');
});
document.getElementById('cb-theme').addEventListener('click',function(){
  var next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{ localStorage.setItem('wesmile_theme',next); }catch(e){}
});
document.getElementById('cb-classic').addEventListener('click',function(){
  try{ localStorage.setItem('wesmile_ui','desktop'); }catch(e){}

document.getElementById('cb-kp').addEventListener('click',function(e){
  var b=e.target.closest('[data-v]'); if(!b) return;
  var v=b.getAttribute('data-v');
  if(v==='C') pin='';
  else if(v==='X') pin=pin.slice(0,-1);
  else if(pin.length<4) pin+=v;
  rysujDots();
  if(pin.length!==4) return;

  gas('masterLogin',[pin],function(res){
    if(!res||!res.ok){ showErr((res&&res.msg)||'Brak dostępu.'); pin=''; rysujDots(); return; }
    S.token=res.token;
    document.getElementById('cb-login').style.display='none';
    document.getElementById('cb-app').style.display='flex';
    budujNav();
    wczytajPodstawy(function(){ navigateTo('pulpit'); });
  });
});

function wczytajPodstawy(cb){
  gas('masterGetEmployees',[S.token],function(res){
    if(res&&res.ok){ S.emps=res.employees||[]; if(res.tagiDostepne) S.tagi=res.tagiDostepne; }
    gas('getAbsenceTypes',[],function(r2){
      if(r2&&r2.ok) S.absTypy=r2.types||[];
      if(cb) cb();
    });
  });
}

// ── Pulpit ────────────────────────────────────────────────────

function modPulpit(){
  document.getElementById('cb-content').innerHTML =
    '<div class="cb-wrap">'+naglowek('Pulpit','Przegląd dnia')+
    '<div class="cb-stats" id="p-stats">'+skeleton(2)+'</div>'+
    '<h2 class="cb-h2">Kto jest w pracy</h2>'+
    '<div class="ios-card" id="p-obecni">'+skeleton(3)+'</div>'+
    '<h2 class="cb-h2" style="margin-top:24px">Grafik wymaga uwagi</h2>'+
    '<div class="ios-card" id="p-rek">'+skeleton(3)+'</div></div>';

  gas('masterGetActive',[S.token],function(res){
    var akt=(res&&res.active)||[], zak=(res&&res.finished)||[];
    var box=document.getElementById('p-obecni');
    if(!akt.length&&!zak.length){
      box.innerHTML=pusto('🌙','Nikt jeszcze nie zaczął','Pierwsze odbicie pojawi się tutaj');
    } else {
      box.innerHTML=akt.map(function(p){
        return '<div class="ios-row"><span class="cb-dot-live"></span>'+
          '<div class="ios-row-b"><div class="ios-row-t">'+esc(p.imie+' '+p.nazwisko)+'</div>'+
          '<div class="ios-row-s">od '+esc(p.wejscie)+'</div></div>'+
          '<span class="badge badge-green">w pracy</span></div>';
      }).join('')+zak.map(function(p){
        return '<div class="ios-row"><span class="cb-dot-live done"></span>'+
          '<div class="ios-row-b"><div class="ios-row-t">'+esc(p.imie+' '+p.nazwisko)+'</div>'+
          '<div class="ios-row-s">'+esc((p.wejscie||'?')+'–'+(p.wyjscie||'?'))+'</div></div>'+
          '<span class="badge badge-gray">zakończone</span></div>';
      }).join('');
    }
    document.getElementById('p-stats').innerHTML=
      kafel('W pracy teraz',akt.length,'green')+
      kafel('Zakończyli dziś',zak.length,'')+
      kafel('Zespół',S.emps.length,'orange');
  });

  gas('masterGetGrafik',[S.token],function(res){
    if(!res||!res.ok) return;
    S.gr=res;
    var rek=(res.rekomendacje||[]).filter(function(r){return r.waga!=='info';});
    var box=document.getElementById('p-rek');
    if(!rek.length){
      box.innerHTML=pusto('✅','Grafik bez zastrzeżeń','Nie ma nic do poprawienia');
      return;
    }
    box.innerHTML=rek.slice(0,6).map(function(r){
      return '<button class="ios-row tap" data-rek="1"><div class="ios-row-b">'+
        '<div class="ios-row-t">'+esc(r.tytul)+'</div>'+
        '<div class="ios-row-s">'+esc(r.tresc)+'</div></div>'+
        '<span class="badge '+wagaBadge(r.waga)+'">'+esc(r.waga)+'</span></button>';
    }).join('');
    box.querySelectorAll('[data-rek]').forEach(function(b){
      b.addEventListener('click',function(){ navigateTo('grafik'); });
    });
    var s=document.getElementById('p-stats');
    s.innerHTML+=kafel('Do poprawy w grafiku',rek.length,rek.length?'red':'green');
  });
}

function kafel(l,v,kl){
  return '<div class="cb-stat"><div class="cb-stat-l">'+esc(l)+'</div>'+
    '<div class="cb-stat-v '+(kl||'')+'">'+v+'</div></div>';
}
function wagaBadge(w){
  return w==='krytyczna'?'badge-red':w==='wazna'?'badge-orange':
         w==='info'?'badge-green':'badge-blue';
}

var ADNOTACJA_KOLOR={info:'badge-blue',uwaga:'badge-orange',wazne:'badge-red',wolne:'badge-gray'};
var ADNOTACJA_LABEL={info:'Informacja',uwaga:'Uwaga',wazne:'Ważne',wolne:'Nieczynne / wolne'};
function adnBadge(typ){ return ADNOTACJA_KOLOR[typ]||'badge-purple'; }
function adnLabel(typ){ return ADNOTACJA_LABEL[typ]||typ; }

// ── Grafik ────────────────────────────────────────────────────

function modGrafik(){
  document.getElementById('cb-content').innerHTML=
    '<div class="cb-wrap">'+naglowek('Grafik','Obsada gabinetów — szablon tygodniowy',
      '<div class="cb-btn-row"><button class="btn-primary btn-small" id="g-kreator">Ułóż grafik lekarza</button>'+
      '<button class="btn-secondary btn-small" id="g-rek">Rekomendacje</button>'+
      '<button class="btn-secondary btn-small" id="g-szablony">Szablony zmian</button>'+
      '<button class="btn-secondary btn-small" id="g-kalendarz">Kalendarz miesiąca</button></div>')+
    '<div class="segmented" id="g-dni" style="margin-bottom:16px"></div>'+
    '<div id="g-siatka">'+skeleton(4)+'</div></div>';

  document.getElementById('g-kreator').addEventListener('click',kreatorStart);
  document.getElementById('g-rek').addEventListener('click',pokazRekomendacje);
  document.getElementById('g-szablony').addEventListener('click',szablonySheet);
  document.getElementById('g-kalendarz').addEventListener('click',function(){
    MC.widok='kalendarz';
    navigateTo('miesiac');
  });

  gas('masterGetGrafik',[S.token],function(res){
    if(!res||!res.ok){
      document.getElementById('g-siatka').innerHTML=
        pusto('⚠️','Nie udało się wczytać',(res&&res.msg)||'');
      return;
    }
    S.gr=res;
    rysujDni(); rysujSiatke();
  });
}

function rysujDni(){
  var w=document.getElementById('g-dni');
  if(!w) return;
  w.innerHTML=S.gr.dni.map(function(nr){
    return '<button class="segmented-btn'+(nr===S.grDzien?' active':'')+'" data-d="'+nr+'">'+
      esc(S.gr.godziny[nr].nazwa.slice(0,3))+'</button>';
  }).join('');
  w.querySelectorAll('[data-d]').forEach(function(b){
    b.addEventListener('click',function(){
      S.grDzien=parseInt(this.getAttribute('data-d'),10);
      rysujDni(); rysujSiatke();
    });
  });
}

function rysujSiatke(){
  var d=S.gr, nr=S.grDzien, g=d.godziny[nr];
  var box=document.getElementById('g-siatka');
  if(!box) return;

  var adn=(d.adnotacje||[]).length
    ? '<div class="ios-card" style="margin-bottom:16px">'+(d.adnotacje||[]).map(function(a){
        return '<div class="ios-row"><div class="ios-row-b"><div class="ios-row-t">'+esc(a.tresc)+'</div>'+
          '<div class="ios-row-s">'+esc(a.od)+(a.do!==a.od?' – '+esc(a.do):'')+'</div></div>'+
          '<span class="badge '+adnBadge(a.typ)+'">'+esc(adnLabel(a.typ))+'</span></div>';
      }).join('')+'</div>' : '';

  box.innerHTML=adn+
    '<div class="section-title">'+esc(g.nazwa)+' · klinika '+esc(g.open)+'–'+esc(g.close)+'</div>'+
    (d.gabinety||[]).map(function(gab){
      var bl=(d.bloki||[]).filter(function(b){return b.dzien===nr&&b.gabinetId===gab.id;})
        .sort(function(a,b){return t2m(a.od)-t2m(b.od);});
      var oOd=t2m(g.open),oDo=t2m(g.close),praca=0;
      bl.forEach(function(b){praca+=t2m(b.do)-t2m(b.od);});
      var wyk=Math.round(praca/(oDo-oOd)*100);

      var wiersze='',kursor=oOd;
      bl.forEach(function(b){
        if(t2m(b.od)>kursor) wiersze+=lukaHtml(gab.id,kursor,t2m(b.od));
        wiersze+=blokHtml(b);
        kursor=Math.max(kursor,t2m(b.do));
      });
      if(kursor<oDo) wiersze+=lukaHtml(gab.id,kursor,oDo);

      return '<div class="ios-card cb-gab"><div class="cb-gab-h">'+
        '<span class="cb-gab-n">'+esc(gab.nazwa)+'</span>'+
        '<span class="badge '+(wyk>=80?'badge-green':wyk>=40?'badge-orange':'badge-gray')+'">'+wyk+'%</span>'+
        '</div>'+(wiersze||pusto('🪑','Pusty gabinet','Dotknij, żeby obsadzić'))+'</div>';
    }).join('');

  box.querySelectorAll('[data-blok]').forEach(function(b){
    b.addEventListener('click',function(){ blokSheet(this.getAttribute('data-blok'),null,null,null); });
  });
  box.querySelectorAll('[data-luka]').forEach(function(b){
    b.addEventListener('click',function(){
      var p=this.getAttribute('data-luka').split('|');
      blokSheet(null,p[0],p[1],p[2]);
    });
  });
}

function lukaHtml(gid,od,do_){
  return '<button class="cb-luka" data-luka="'+esc(gid)+'|'+m2t(od)+'|'+m2t(do_)+'">'+
    '<span class="cb-luka-t">'+m2t(od)+'–'+m2t(do_)+'</span>'+
    '<span class="cb-luka-l">wolne · '+hm(do_-od)+'</span>'+chev()+'</button>';
}

function blokHtml(b){
  var as=b.asysta||[];
  var brak=b.typ!=='Higienizacja'&&!as.length;
  var opis=b.typ==='Higienizacja' ? 'Higienizacja'
    : (as.length ? 'Asysta: '+as.map(function(a){return esc(osobaNazwa(a.osobaId));}).join(', ')
                 : 'Bez asysty');
  return '<button class="ios-row tap" data-blok="'+esc(b.id)+'">'+
    '<span class="cb-blok-t'+(b.typ==='Higienizacja'?' hig':'')+'">'+esc(b.od)+'–'+esc(b.do)+'</span>'+
    '<div class="ios-row-b"><div class="ios-row-t">'+esc(osobaNazwa(b.osobaId))+'</div>'+
    '<div class="ios-row-s">'+opis+'</div></div>'+
    (brak?'<span class="badge badge-red">brak asysty</span>':'')+chev()+'</button>';
}

function pokazRekomendacje(){
  if(!S.gr) return;
  var lista=S.gr.rekomendacje||[];
  showModal('<div class="modal-title">Rekomendacje</div>'+
    (lista.length ? lista.map(function(r){
      return '<div class="cb-rek '+esc(r.waga)+'"><div class="cb-rek-t">'+esc(r.tytul)+'</div>'+
        '<div class="cb-rek-d">'+esc(r.tresc)+'</div>'+
        '<div class="cb-rek-a">→ '+esc(r.akcja)+'</div></div>';
    }).join('') : pusto('✅','Brak rekomendacji','Grafik nie wymaga korekt')));
}

// ── Edytor bloku ──────────────────────────────────────────────

function blokSheet(blokId,gabId,od,do_){
  var d=S.gr;
  var blok=blokId?(d.bloki||[]).find(function(b){return b.id===blokId;}):null;
  var gabinetId=blok?blok.gabinetId:gabId;
  var gab=(d.gabinety||[]).find(function(g){return g.id===gabinetId;});
  var g=d.godziny[S.grDzien];
  var typ=blok?blok.typ:'Lekarz';
  var krok=(d.krokMin||5)*60;

  showModal('<div class="modal-title">'+(blok?'Edytuj blok':'Nowy blok')+'</div>'+
    '<div class="ios-row" style="border-radius:10px;margin-bottom:16px"><div class="ios-row-b">'+
    '<div class="ios-row-t">'+esc(gab?gab.nazwa:'—')+'</div>'+
    '<div class="ios-row-s">'+esc(g.nazwa)+' · klinika '+esc(g.open)+'–'+esc(g.close)+'</div></div></div>'+
    '<div class="cb-field"><label class="cb-lbl">Typ bloku</label>'+
    '<select class="ios-select" id="b-typ">'+
      '<option value="Lekarz"'+(typ==='Lekarz'?' selected':'')+'>Lekarz</option>'+
      '<option value="Higienizacja"'+(typ==='Higienizacja'?' selected':'')+'>Higienizacja</option>'+
    '</select></div>'+
    '<div class="cb-field"><label class="cb-lbl" id="b-os-l">Osoba</label>'+
    '<select class="ios-select" id="b-osoba"></select></div>'+
    '<div class="cb-grid2">'+
      '<div class="cb-field"><label class="cb-lbl">Od</label>'+
      '<input type="time" class="ios-input" id="b-od" step="'+krok+'" value="'+esc(blok?blok.od:(od||g.open))+'"></div>'+
      '<div class="cb-field"><label class="cb-lbl">Do</label>'+
      '<input type="time" class="ios-input" id="b-do" step="'+krok+'" value="'+esc(blok?blok.do:(do_||g.close))+'"></div>'+
    '</div>'+
    '<div id="b-as-box"><div class="cb-field"><label class="cb-lbl">Asysta</label>'+
    '<div id="b-as"></div></div></div>'+
    '<button class="btn-primary" id="b-zapisz" style="margin-top:8px">Zapisz</button>'+
    (blok?'<button class="btn-destructive" id="b-usun" style="margin-top:10px">Usuń blok</button>':''));

  var wybrana=blok?(blok.asysta||[]).map(function(a){return a.osobaId;}):[];

  function osoby(){
    var t=document.getElementById('b-typ').value;
    var grupa=t==='Higienizacja'?'higienistka':'lekarz';
    document.getElementById('b-os-l').textContent=t==='Higienizacja'?'Higienistka':'Lekarz';
    var l=(d.personel||[]).filter(function(p){return p.grupa===grupa;});
    var sel=document.getElementById('b-osoba');
    sel.innerHTML=l.length
      ? '<option value="">— wybierz —</option>'+l.map(function(p){
          return '<option value="'+esc(p.id)+'">'+esc(p.imie+' '+p.nazwisko)+'</option>';
        }).join('')
      : '<option value="">— brak osób z tą rolą —</option>';
    if(blok) sel.value=blok.osobaId;
    document.getElementById('b-as-box').style.display=(t==='Higienizacja')?'none':'block';
  }

  function asysta(){
    var box=document.getElementById('b-as');
    if(!box) return;
    gas('masterGrafikWolneAsysty',
      [S.token,S.grDzien,document.getElementById('b-od').value,document.getElementById('b-do').value,[]],
      function(res){
        if(!res||!res.ok){ box.innerHTML='<div class="ios-row-s">Nie sprawdzono dostępności.</div>'; return; }
        var opcje=res.dostepne.concat(res.zewnetrzne);
        // Osoba już przypisana do tego bloku musi zostać na liście, choć
        // z punktu widzenia zapytania jest „zajęta" — przez ten właśnie blok.
        wybrana.forEach(function(id){
          if(!opcje.some(function(o){return o.id===id;}))
            opcje.push({ id:id, label:osobaNazwa(id), zew:false });
        });
        box.innerHTML='<div class="cb-tags">'+opcje.map(function(o){
          var on=wybrana.indexOf(o.id)!==-1;
          return '<button type="button" class="cb-tag'+(on?'':' off')+'" data-as="'+esc(o.id)+'">'+
            esc(o.label)+'</button>';
        }).join('')+'</div>'+
        (res.zajete.length?'<div class="ios-row-s" style="margin-top:8px">Zajęte: '+esc(res.zajete.join(', '))+'</div>':'');
        box.querySelectorAll('[data-as]').forEach(function(b){
          b.addEventListener('click',function(){
            var id=this.getAttribute('data-as');
            var i=wybrana.indexOf(id);
            if(i===-1) wybrana.push(id); else wybrana.splice(i,1);
            this.classList.toggle('off',wybrana.indexOf(id)===-1);
          });
        });
      });
  }

  document.getElementById('b-typ').addEventListener('change',function(){ osoby(); });
  document.getElementById('b-od').addEventListener('change',asysta);
  document.getElementById('b-do').addEventListener('change',asysta);
  osoby(); asysta();

  document.getElementById('b-zapisz').addEventListener('click',function(){
    var t=document.getElementById('b-typ').value;
    var osobaId=document.getElementById('b-osoba').value;
    if(!osobaId){ showErr('Wybierz osobę.'); return; }
    var payload={
      id:blok?blok.id:'', gabinetId:gabinetId, dzien:S.grDzien, typ:t, osobaId:osobaId,
      od:document.getElementById('b-od').value, do:document.getElementById('b-do').value,
      asystaWymagana:(t==='Higienizacja')?0:(wybrana.length||1), asystaUwaga:''
    };
    gas('masterSaveGrafikBlok',[S.token,payload],function(r){
      if(!r||!r.ok){ showErr((r&&r.msg)||'Nie zapisano.'); return; }
      var as=(t==='Higienizacja')?[]:wybrana.map(function(id){return {osobaId:id};});
      gas('masterSetGrafikAsysta',[S.token,r.id,as],function(r2){
        if(r2&&!r2.ok&&r2.msg) showErr(r2.msg);
        closeModal(); showOk('Zapisano blok.');
        gas('masterGetGrafik',[S.token],function(g2){ if(g2&&g2.ok){S.gr=g2;rysujSiatke();} });
      });
    });
  });

  var usun=document.getElementById('b-usun');
  if(usun) usun.addEventListener('click',function(){
    var b=this;
    if(b.getAttribute('data-armed')!=='1'){
      b.setAttribute('data-armed','1'); b.textContent='Na pewno? Kliknij ponownie';
      setTimeout(function(){b.removeAttribute('data-armed');b.textContent='Usuń blok';},4000);
      return;
    }
    gas('masterDeleteGrafikBlok',[S.token,blok.id],function(r){
      if(!r||!r.ok){ showErr((r&&r.msg)||'Błąd.'); return; }
      closeModal(); showOk('Usunięto blok.');
      gas('masterGetGrafik',[S.token],function(g2){ if(g2&&g2.ok){S.gr=g2;rysujSiatke();} });
    });
  });
}

// ── Kreator (trzy kroki, jak w panelu klasycznym) ─────────────

var KR={krok:1,lekarz:null,dni:{},pozycje:[]};

function kreatorStart(){
  if(!S.gr) return;
  if(!(S.gr.personel||[]).some(function(p){return p.grupa==='lekarz';})){
    showErr('Brak lekarzy w zespole.'); return;
  }
  KR={krok:1,lekarz:null,dni:{},pozycje:[]};
  kreatorRysuj();
}

function kreatorRysuj(){
  if(KR.krok===1) krKrok1();
  else if(KR.krok===2) krKrok2();
  else krKrok3();
}

function krKrok1(){
  var lek=(S.gr.personel||[]).filter(function(p){return p.grupa==='lekarz';});
  showModal('<div class="modal-title">Krok 1 z 3 — dni pracy</div>'+
    '<div class="cb-field"><label class="cb-lbl">Lekarz</label>'+
    '<select class="ios-select" id="k-lek"><option value="">— wybierz —</option>'+
    lek.map(function(p){
      return '<option value="'+esc(p.id)+'"'+(KR.lekarz===p.id?' selected':'')+'>'+
        esc(p.imie+' '+p.nazwisko)+'</option>';
    }).join('')+'</select></div>'+
    '<div class="ios-card" id="k-dni">'+S.gr.dni.map(function(nr){
      var g=S.gr.godziny[nr],w=KR.dni[nr];
      return '<div class="ios-row" style="flex-wrap:wrap"><button class="ios-row-b" '+
        'style="background:none;border:none;text-align:left;font-family:inherit;cursor:pointer;padding:0" '+
        'data-d="'+nr+'"><div class="ios-row-t">'+esc(g.nazwa)+'</div>'+
        '<div class="ios-row-s">klinika '+esc(g.open)+'–'+esc(g.close)+'</div></button>'+
        (w?'<span class="badge badge-blue">wybrany</span>':'<span class="badge badge-gray">—</span>')+
        (w?'<div class="segmented" style="flex-basis:100%;margin-top:10px">'+
          [['rano','Rano'],['popo','Popołudnie'],['caly','Cały dzień']].map(function(v){
            return '<button class="segmented-btn'+(w.wariant===v[0]?' active':'')+
              '" data-w="'+nr+'|'+v[0]+'">'+v[1]+'</button>';
          }).join('')+'</div>':'')+'</div>';
    }).join('')+'</div>'+
    '<button class="btn-primary" id="k-dalej" style="margin-top:16px">Dalej</button>');

  document.getElementById('k-lek').addEventListener('change',function(){ KR.lekarz=this.value||null; });
  document.querySelectorAll('#k-dni [data-d]').forEach(function(b){
    b.addEventListener('click',function(){
      var nr=parseInt(this.getAttribute('data-d'),10);
      if(KR.dni[nr]) delete KR.dni[nr];
      else { var z=S.gr.godziny[nr].zmiany.caly; KR.dni[nr]={wariant:'caly',od:z.od,do:z.do}; }
      krKrok1();
    });
  });
  document.querySelectorAll('#k-dni [data-w]').forEach(function(b){
    b.addEventListener('click',function(){
      var p=this.getAttribute('data-w').split('|');
      var nr=parseInt(p[0],10),z=S.gr.godziny[nr].zmiany[p[1]];
      KR.dni[nr]={wariant:p[1],od:z.od,do:z.do};
      krKrok1();
    });
  });
  document.getElementById('k-dalej').addEventListener('click',function(){
    if(!KR.lekarz){ showErr('Wybierz lekarza.'); return; }
    var wyb=Object.keys(KR.dni).map(Number).sort(function(a,b){return a-b;});
    if(!wyb.length){ showErr('Zaznacz przynajmniej jeden dzień.'); return; }
    KR.pozycje=wyb.map(function(nr){
      var st=KR.pozycje.find(function(p){return p.dzien===nr;});
      return {dzien:nr,od:KR.dni[nr].od,do:KR.dni[nr].do,
        asysta:st?(st.asysta||[]):[],brakAsysty:st?!!st.brakAsysty:false,uwaga:st?(st.uwaga||''):''};
    });
    KR.krok=2; kreatorRysuj();
  });
}

function krKrok2(){
  var krok=(S.gr.krokMin||5)*60;
  showModal('<div class="modal-title">Krok 2 z 3 — godziny</div>'+
    '<div class="ios-row-s" style="margin-bottom:14px">Godziny ustawisz dowolnie, co '+
      (S.gr.krokMin||5)+' minut.</div>'+
    KR.pozycje.map(function(p,i){
      var g=S.gr.godziny[p.dzien];
      return '<div class="cb-field" data-i="'+i+'"><label class="cb-lbl">'+esc(g.nazwa)+
        ' · klinika '+esc(g.open)+'–'+esc(g.close)+'</label><div class="cb-grid2">'+
        '<input type="time" class="ios-input k-od" step="'+krok+'" value="'+esc(p.od)+'">'+
        '<input type="time" class="ios-input k-do" step="'+krok+'" value="'+esc(p.do)+'"></div></div>';
    }).join('')+
    '<div class="cb-btn-row" style="margin-top:8px">'+
    '<button class="btn-secondary btn-small" id="k-wstecz">Wstecz</button>'+
    '<button class="btn-primary btn-small" id="k-dalej2">Dalej</button></div>');

  document.querySelectorAll('#cb-modal-body [data-i]').forEach(function(row){
    var i=parseInt(row.getAttribute('data-i'),10);
    row.querySelector('.k-od').addEventListener('change',function(){ KR.pozycje[i].od=this.value; });
    row.querySelector('.k-do').addEventListener('change',function(){ KR.pozycje[i].do=this.value; });
  });
  document.getElementById('k-wstecz').addEventListener('click',function(){ KR.krok=1; kreatorRysuj(); });
  document.getElementById('k-dalej2').addEventListener('click',function(){
    var km=S.gr.krokMin||5;
    for(var i=0;i<KR.pozycje.length;i++){
      var p=KR.pozycje[i],g=S.gr.godziny[p.dzien];
      if(!p.od||!p.do){ showErr(g.nazwa+': uzupełnij godziny.'); return; }
      if(t2m(p.od)>=t2m(p.do)){ showErr(g.nazwa+': „do" musi być późniejsze.'); return; }
      if(t2m(p.od)%km||t2m(p.do)%km){ showErr(g.nazwa+': godziny co '+km+' min.'); return; }
      if(t2m(p.od)<t2m(g.open)||t2m(p.do)>t2m(g.close)){
        showErr(g.nazwa+': poza godzinami otwarcia.'); return;
      }
    }
    KR.krok=3; kreatorRysuj();
  });
}

function krKrok3(){
  showModal('<div class="modal-title">Krok 3 z 3 — asysta</div>'+
    '<div class="ios-row-s" style="margin-bottom:14px">Osoby zajęte w tych godzinach nie pojawiają się na liście.</div>'+
    KR.pozycje.map(function(p,i){
      var g=S.gr.godziny[p.dzien];
      return '<div class="cb-field" data-a="'+i+'"><label class="cb-lbl">'+esc(g.nazwa)+
        ' · '+esc(p.od)+'–'+esc(p.do)+'</label><div class="k-as">'+skeleton(1)+'</div></div>';
    }).join('')+
    '<div class="cb-btn-row" style="margin-top:8px">'+
    '<button class="btn-secondary btn-small" id="k-wstecz2">Wstecz</button>'+
    '<button class="btn-primary btn-small" id="k-zapisz">Zapisz grafik</button></div>');

  document.getElementById('k-wstecz2').addEventListener('click',function(){ KR.krok=2; kreatorRysuj(); });
  document.getElementById('k-zapisz').addEventListener('click',function(){
    var brak=KR.pozycje.filter(function(p){return !p.brakAsysty&&!(p.asysta||[]).length;});
    if(brak.length){ showErr('Wybierz asystę albo zaznacz „Bez asysty".'); return; }
    gas('masterGrafikKreatorZapisz',[S.token,KR.lekarz,KR.pozycje],function(res){
      if(!res||!res.ok){ showErr((res&&res.msg)||'Nie zapisano.'); return; }
      closeModal();
      if(res.bledy&&res.bledy.length) showErr('Dodano '+res.dodane+'. Nie udało się: '+res.bledy.join(' · '));
      else showOk('Dodano '+res.dodane+' dni do grafiku.');
      gas('masterGetGrafik',[S.token],function(g2){ if(g2&&g2.ok){S.gr=g2;rysujSiatke();} });
    });
  });

  KR.pozycje.forEach(function(_,i){ krAsysta(i); });
}

function krRezerwacje(pomij){
  var out=[];
  KR.pozycje.forEach(function(p,i){
    if(i===pomij) return;
    (p.asysta||[]).forEach(function(id){ out.push({osobaId:id,dzien:p.dzien,od:p.od,do:p.do}); });
  });
  return out;
}

function krAsysta(i){
  var poz=KR.pozycje[i];
  gas('masterGrafikWolneAsysty',[S.token,poz.dzien,poz.od,poz.do,krRezerwacje(i)],function(res){
    var box=document.querySelector('#cb-modal-body [data-a="'+i+'"] .k-as');
    if(!box) return;
    if(!res||!res.ok){ box.innerHTML='<div class="ios-row-s">Nie sprawdzono dostępności.</div>'; return; }
    poz.asysta=poz.asysta||[];
    box.innerHTML='<div class="cb-tags">'+res.dostepne.concat(res.zewnetrzne).map(function(o){
      var on=poz.asysta.indexOf(o.id)!==-1;
      return '<button type="button" class="cb-tag'+(on?'':' off')+'" data-p="'+i+'|'+esc(o.id)+'">'+
        esc(o.label)+'</button>';
    }).join('')+
    '<button type="button" class="cb-tag'+(poz.brakAsysty?'':' off')+'" data-b="'+i+'" '+
    'style="background:'+(poz.brakAsysty?'rgba(255,59,48,.14)':'')+';color:'+(poz.brakAsysty?'#ff3b30':'')+'">'+
    'Bez asysty</button></div>'+
    (res.zajete.length?'<div class="ios-row-s" style="margin-top:8px">Zajęte: '+esc(res.zajete.join(', '))+'</div>':'');

    box.querySelectorAll('[data-p]').forEach(function(b){
      b.addEventListener('click',function(){
        var p=this.getAttribute('data-p').split('|');
        var idx=parseInt(p[0],10),id=p[1];
        var l=KR.pozycje[idx].asysta||[];
        var k=l.indexOf(id);
        if(k===-1) l.push(id); else l.splice(k,1);
        KR.pozycje[idx].asysta=l;
        if(l.length) KR.pozycje[idx].brakAsysty=false;
        KR.pozycje.forEach(function(_,j){ krAsysta(j); });
      });
    });
    var bb=box.querySelector('[data-b]');
    if(bb) bb.addEventListener('click',function(){
      var idx=parseInt(this.getAttribute('data-b'),10);
      KR.pozycje[idx].brakAsysty=!KR.pozycje[idx].brakAsysty;
      if(KR.pozycje[idx].brakAsysty) KR.pozycje[idx].asysta=[];
      KR.pozycje.forEach(function(_,j){ krAsysta(j); });
    });
  });
}

// ── Miesiąc: kalendarz z edycją każdego dnia ──────────────────
// Szablon tygodniowy to tylko podstawa. Tu widać realny miesiąc i każdy
// dzień można nadpisać niezależnie — to jest właściwe miejsce do
// układania grafiku, a nie abstrakcyjny „tydzień wzorcowy".

var MC = { rok:new Date().getFullYear(), mies:new Date().getMonth()+1, dane:null };

function modMiesiac(){
  if(!MC.widok) MC.widok='lista';
  document.getElementById('cb-content').innerHTML=
    '<div class="cb-wrap">'+naglowek('Miesiąc','Realny kalendarz — każdy dzień do edycji',
      '<div class="cb-btn-row">'+
      '<button class="btn-secondary btn-small" id="mc-adnotacje">Adnotacje</button>'+
      '<button class="btn-secondary btn-small" id="mc-wydruk">Wydruk</button>'+
      '<button class="btn-secondary btn-small" id="mc-gcal">Google Calendar</button>'+
      '<button class="btn-secondary btn-small" id="mc-prev">‹</button>'+
      '<button class="btn-secondary btn-small" id="mc-next">›</button></div>')+
    '<div class="segmented" id="mc-widok" style="margin-bottom:12px">'+
      '<button class="segmented-btn'+(MC.widok==='lista'?' active':'')+'" data-w="lista">Lista</button>'+
      '<button class="segmented-btn'+(MC.widok==='kalendarz'?' active':'')+'" data-w="kalendarz">Kalendarz</button>'+
    '</div>'+
    '<div class="section-title" id="mc-lbl">—</div>'+
    '<div id="mc-siatka">'+skeleton(5)+'</div></div>';
  document.getElementById('mc-prev').addEventListener('click',function(){
    MC.mies--; if(MC.mies<1){MC.mies=12;MC.rok--;} mcWczytaj();
  });
  document.getElementById('mc-next').addEventListener('click',function(){
    MC.mies++; if(MC.mies>12){MC.mies=1;MC.rok++;} mcWczytaj();
  });
  document.getElementById('mc-adnotacje').addEventListener('click',adnotacjeSheet);
  document.getElementById('mc-wydruk').addEventListener('click',wydrukSheet);
  document.getElementById('mc-gcal').addEventListener('click',gcalSheet);
  document.querySelectorAll('#mc-widok [data-w]').forEach(function(b){
    b.addEventListener('click',function(){
      MC.widok=this.getAttribute('data-w');
      modMiesiac();
    });
  });
  mcWczytaj();
}

function mcWczytaj(){
  var l=document.getElementById('mc-lbl');
  if(l) l.textContent=MIESIACE[MC.mies-1]+' '+MC.rok;
  gas('masterGrafikMiesiac',[S.token,MC.rok,MC.mies],function(res){
    if(!res||!res.ok){
      document.getElementById('mc-siatka').innerHTML=pusto('⚠️','Nie wczytano',(res&&res.msg)||'');
      return;
    }
    MC.dane=res;
    if(MC.widok==='kalendarz') mcRysujKalendarz(); else mcRysuj();
  });
}

function mcRysuj(){
  var box=document.getElementById('mc-siatka');
  if(!box) return;
  box.innerHTML='<div class="ios-card">'+MC.dane.dni.map(function(d){
    if(!d.czynny){
      return '<div class="ios-row" style="opacity:.45"><span class="cb-blok-t" style="color:var(--cb-gray)">'+
        esc(d.data.slice(8))+'</span><div class="ios-row-b"><div class="ios-row-t">'+esc(d.nazwaDnia)+
        '</div><div class="ios-row-s">klinika nieczynna</div></div></div>';
    }
    var lekarze=d.bloki.filter(function(b){return b.typ==='Lekarz';}).length;
    var higien=d.bloki.filter(function(b){return b.typ==='Higienizacja';}).length;
    var brak=d.bloki.filter(function(b){return b.typ==='Lekarz'&&!(b.asysta||[]).length;}).length;
    var opis=d.bloki.length
      ? (lekarze?lekarze+' lekarskich':'')+(lekarze&&higien?' · ':'')+(higien?higien+' higienizacji':'')
      : 'brak obsady';
    return '<button class="ios-row tap" data-dzien="'+esc(d.data)+'">'+
      '<span class="cb-blok-t">'+esc(d.data.slice(8))+'</span>'+
      '<div class="ios-row-b"><div class="ios-row-t">'+esc(d.nazwaDnia)+'</div>'+
      '<div class="ios-row-s">'+esc(opis)+'</div></div>'+
      (d.adnotacje.length?'<span class="badge badge-purple">'+d.adnotacje.length+'</span>':'')+
      (brak?'<span class="badge badge-red">bez asysty '+brak+'</span>':'')+
      (!d.zTemplate?'<span class="badge badge-orange">zmieniony</span>':'')+
      chev()+'</button>';
  }).join('')+'</div>';

  box.querySelectorAll('[data-dzien]').forEach(function(b){
    b.addEventListener('click',function(){ mcDzien(this.getAttribute('data-dzien')); });
  });
}

// ── Widok kalendarza: siatka tygodni + przeciąganie bloków między dniami ──
// Edycja szczegółów dnia zostaje w mcDzien() — kalendarz jest do orientacji
// i szybkiego przenoszenia, nie duplikuje edytora bloków.

function osobaNazwaSkrot(id){
  var e=S.emps.find(function(x){return x.id===id;});
  if(e) return (e.imie?e.imie.charAt(0)+'. ':'')+e.nazwisko;
  var z=((MC.dane&&MC.dane.asystaZew)||[]).find(function(x){return x.id===id;});
  return z?z.label:id;
}

function mcRysujKalendarz(){
  var box=document.getElementById('mc-siatka');
  if(!box) return;
  var d=MC.dane;
  var pierwszy=new Date(d.rok,d.mies-1,1);
  var startOffset=(pierwszy.getDay()+6)%7; // Pn=0 ... Nd=6
  var komorki=[];
  for(var i=0;i<startOffset;i++) komorki.push(null);
  d.dni.forEach(function(x){ komorki.push(x); });
  while(komorki.length%7!==0) komorki.push(null);
  var dniTyg=['Pn','Wt','Śr','Cz','Pt','So','Nd'];

  box.innerHTML=
    '<div class="cb-cal-grid cb-cal-dow-row">'+dniTyg.map(function(n){
      return '<div class="cb-cal-dow">'+n+'</div>';
    }).join('')+'</div>'+
    '<div class="cb-cal-grid">'+komorki.map(function(x){
      return x?mcKomorkaHtml(x):'<div class="cb-cal-cell cb-cal-empty"></div>';
    }).join('')+'</div>';

  mcWpiszDnD(box);
}

function mcKomorkaHtml(d){
  return '<div class="cb-cal-cell'+(d.czynny?'':' cb-cal-off')+'" data-cal-dzien="'+esc(d.data)+'">'+
    '<div class="cb-cal-num">'+esc(String(parseInt(d.data.slice(8),10)))+
      (!d.zTemplate?'<span class="cb-cal-dot" title="dzień zmieniony ręcznie"></span>':'')+
    '</div>'+
    (d.czynny
      ? '<div class="cb-cal-chips">'+
          d.bloki.slice(0,4).map(function(b){
            var brak=b.typ==='Lekarz'&&!(b.asysta||[]).length;
            return '<div class="cb-cal-chip'+(b.typ==='Higienizacja'?' hig':'')+(brak?' brak':'')+'" '+
              'draggable="true" data-cal-blok="'+esc(b.id)+'" '+
              'title="'+esc(osobaNazwa(b.osobaId)+' · '+b.od+'–'+b.do+(brak?' · bez asysty':''))+'">'+
              esc(b.od)+' '+esc(osobaNazwaSkrot(b.osobaId))+'</div>';
          }).join('')+
          (d.bloki.length>4?'<div class="cb-cal-more">+'+(d.bloki.length-4)+' więcej</div>':'')+
        '</div>'
      : '<div class="cb-cal-closed">zamknięte</div>')+
    '</div>';
}

function mcWpiszDnD(box){
  var draggedId=null, draggedFrom=null;

  box.querySelectorAll('[data-cal-blok]').forEach(function(chip){
    chip.addEventListener('dragstart',function(e){
      draggedId=this.getAttribute('data-cal-blok');
      draggedFrom=this.closest('[data-cal-dzien]').getAttribute('data-cal-dzien');
      if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',draggedId); }
      this.classList.add('dragging');
    });
    chip.addEventListener('dragend',function(){ this.classList.remove('dragging'); });
    chip.addEventListener('click',function(e){
      e.stopPropagation();
      mcDzien(this.closest('[data-cal-dzien]').getAttribute('data-cal-dzien'));
    });
  });

  box.querySelectorAll('[data-cal-dzien]').forEach(function(cell){
    cell.addEventListener('dragover',function(e){
      if(!draggedId) return;
      e.preventDefault();
      this.classList.add('cb-cal-dragover');
    });
    cell.addEventListener('dragleave',function(){ this.classList.remove('cb-cal-dragover'); });
    cell.addEventListener('drop',function(e){
      e.preventDefault();
      this.classList.remove('cb-cal-dragover');
      var doData=this.getAttribute('data-cal-dzien');
      var id=draggedId, zData=draggedFrom;
      draggedId=null; draggedFrom=null;
      if(!id||!zData||doData===zData) return;
      mcPrzeniesBlok(id,zData,doData);
    });
    cell.addEventListener('click',function(e){
      if(e.target.closest('[data-cal-blok]')) return;
      mcDzien(this.getAttribute('data-cal-dzien'));
    });
  });
}

function mcPrzeniesBlok(blokId,zData,doData){
  var dZr=MC.dane.dni.find(function(x){return x.data===zData;});
  var dDo=MC.dane.dni.find(function(x){return x.data===doData;});
  if(!dZr||!dDo){ return; }
  if(!dDo.czynny){ showErr('Klinika jest w tym dniu nieczynna.'); return; }
  var blok=(dZr.bloki||[]).find(function(b){return b.id===blokId;});
  if(!blok) return;

  var noweDoBloki=(dDo.bloki||[]).concat([{
    gabinetId:blok.gabinetId, typ:blok.typ, osobaId:blok.osobaId,
    od:blok.od, do:blok.do, asystaWymagana:blok.asystaWymagana,
    asystaUwaga:blok.asystaUwaga, asysta:blok.asysta||[]
  }]);

  showToast('Przenoszenie…','info');
  // Docelowy dzień zapisujemy jako pierwszy: jeśli go odrzuci (kolizja,
  // godziny poza otwarciem), dzień źródłowy zostaje nietknięty i blok
  // nigdzie nie znika.
  gas('masterZapiszDzienGrafiku',[S.token,doData,noweDoBloki],function(rDo){
    if(!rDo||!rDo.ok){ showErr((rDo&&rDo.msg)||'Nie udało się przenieść bloku.'); return; }
    var noweZrBloki=(dZr.bloki||[]).filter(function(b){return b.id!==blokId;});
    gas('masterZapiszDzienGrafiku',[S.token,zData,noweZrBloki],function(rZr){
      if(!rZr||!rZr.ok){
        showErr('Blok trafił na '+doData+', ale nie udało się usunąć go z '+zData+'.');
        mcWczytaj();
        return;
      }
      showOk('Przeniesiono na '+doData+'.');
      mcWczytaj();
    });
  });
}

function mcDzien(data){
  var d=MC.dane.dni.find(function(x){return x.data===data;});
  if(!d) return;
  var robocze=JSON.parse(JSON.stringify(d.bloki||[]));

  function rysuj(){
    var html='<div class="modal-title">'+esc(d.nazwaDnia)+' '+esc(data)+'</div>'+
      '<div class="ios-row-s" style="margin-bottom:12px">Klinika '+esc(d.godziny.open)+'–'+esc(d.godziny.close)+
      (d.zTemplate?' · dzień z szablonu tygodniowego':' · dzień zmieniony ręcznie')+'</div>'+
      (d.adnotacje.length?'<div class="ios-card" style="margin-bottom:12px">'+d.adnotacje.map(function(a){
        return '<div class="ios-row"><div class="ios-row-b"><div class="ios-row-t">'+esc(a.tresc)+'</div>'+
          (a.od!==a.do?'<div class="ios-row-s">'+esc(a.od)+' – '+esc(a.do)+'</div>':'')+'</div>'+
          '<span class="badge '+adnBadge(a.typ)+'">'+esc(adnLabel(a.typ))+'</span></div>';
      }).join('')+'</div>':'')+
      '<div class="ios-card" id="mc-bloki">'+
      (robocze.length?robocze.map(function(b,i){
        var gab=(MC.dane.gabinety.find(function(g){return g.id===b.gabinetId;})||{}).nazwa||b.gabinetId;
        var as=(b.asysta||[]).map(function(a){return osobaNazwa(a.osobaId);}).join(', ');
        return '<div class="ios-row"><span class="cb-blok-t'+(b.typ==='Higienizacja'?' hig':'')+'">'+
          esc(b.od)+'–'+esc(b.do)+'</span><div class="ios-row-b">'+
          '<div class="ios-row-t">'+esc(osobaNazwa(b.osobaId))+'</div>'+
          '<div class="ios-row-s">'+esc(gab)+(as?' · as. '+esc(as):
            (b.typ==='Lekarz'?' · <span style="color:var(--cb-red)">bez asysty</span>':''))+'</div></div>'+
          '<button class="btn-destructive btn-small" data-usun="'+i+'">Usuń</button></div>';
      }).join(''):pusto('🗓️','Dzień bez obsady','Dodaj blok poniżej'))+'</div>'+
      '<button class="btn-secondary" id="mc-dodaj" style="margin-top:12px">+ Dodaj blok</button>'+
      '<button class="btn-primary" id="mc-zapisz" style="margin-top:10px">Zapisz ten dzień</button>'+
      (d.zTemplate?'':'<button class="btn-secondary" id="mc-reset" style="margin-top:10px">Przywróć szablon tygodniowy</button>')+
      '<button class="btn-secondary" id="mc-kopiuj" style="margin-top:10px">Kopiuj na inne dni</button>';

    showModal(html);

    document.querySelectorAll('#mc-bloki [data-usun]').forEach(function(b){
      b.addEventListener('click',function(){
        robocze.splice(parseInt(this.getAttribute('data-usun'),10),1); rysuj();
      });
    });
    document.getElementById('mc-dodaj').addEventListener('click',function(){ mcNowyBlok(d,robocze,rysuj); });
    document.getElementById('mc-zapisz').addEventListener('click',function(){
      gas('masterZapiszDzienGrafiku',[S.token,data,robocze],function(r){
        if(!r||!r.ok){ showErr((r&&r.msg)||'Nie zapisano.'); return; }
        closeModal(); showOk('Zapisano '+data+'.'); mcWczytaj();
      });
    });
    var rs=document.getElementById('mc-reset');
    if(rs) rs.addEventListener('click',function(){
      gas('masterResetDzienGrafiku',[S.token,data],function(r){
        if(!r||!r.ok){ showErr((r&&r.msg)||'Błąd.'); return; }
        closeModal(); showOk('Przywrócono szablon.'); mcWczytaj();
      });
    });
    document.getElementById('mc-kopiuj').addEventListener('click',function(){ mcKopiuj(data,d); });
  }
  rysuj();
}

// ── Szablony zmian — nazwany, wielokrotnego użytku zestaw godzin
// (np. „Zmiana poranna", „Higienizacja standard"), niezależny od osoby
// i dnia. Zarządzanie z poziomu Grafiku (szablonySheet), zastosowanie —
// przy dodawaniu bloku w Miesiącu (mcNowyBlok), gdzie wybór szablonu tylko
// wypełnia pola formularza; zapis zawsze idzie przez zwykłe
// masterZapiszDzienGrafiku, więc walidacja jest identyczna jak ręcznej edycji.

function zapewnijSzablony(cb){
  if(S.szablony){ cb(); return; }
  gas('masterGetSzablonyZmian',[S.token],function(res){
    S.szablony=(res&&res.ok)?res.szablony:[];
    cb();
  });
}

function szablonySheet(){
  showModal('<div class="modal-title">Szablony zmian</div>'+
    '<div class="ios-row-s" style="margin-bottom:12px">Nazwany zestaw godzin do szybkiego użycia przy dodawaniu bloku w zakładce Miesiąc.</div>'+
    '<div class="ios-card" id="sz-lista">'+skeleton(3)+'</div>'+
    '<button class="btn-primary" id="sz-nowy" style="margin-top:14px">+ Nowy szablon</button>');
  document.getElementById('sz-nowy').addEventListener('click',function(){ szablonEdytuj(null); });
  S.szablony=null;
  zapewnijSzablony(function(){
    var box=document.getElementById('sz-lista');
    if(!box) return;
    box.innerHTML=S.szablony.length
      ? S.szablony.map(function(sz){
          return '<div class="ios-row"><span class="cb-blok-t'+(sz.typ==='Higienizacja'?' hig':'')+'">'+
            esc(sz.od)+'–'+esc(sz.do)+'</span>'+
            '<div class="ios-row-b"><div class="ios-row-t">'+esc(sz.nazwa)+'</div>'+
            '<div class="ios-row-s">'+esc(sz.typ)+
              (sz.asystaWymagana!=null?' · wymagana asysta: '+sz.asystaWymagana:'')+'</div></div>'+
            '<button class="btn-secondary btn-small" data-sz-edytuj="'+esc(sz.id)+'">Edytuj</button></div>';
        }).join('')
      : pusto('📋','Brak szablonów','Dodaj pierwszy poniżej');
    box.querySelectorAll('[data-sz-edytuj]').forEach(function(b){
      b.addEventListener('click',function(){
        var id=this.getAttribute('data-sz-edytuj');
        szablonEdytuj(S.szablony.find(function(x){return x.id===id;}));
      });
    });
  });
}

function szablonEdytuj(sz){
  showModal('<div class="modal-title">'+(sz?'Edytuj szablon':'Nowy szablon')+'</div>'+
    '<div class="cb-field"><label class="cb-lbl">Nazwa</label>'+
    '<input class="ios-input" id="se-nazwa" value="'+esc(sz?sz.nazwa:'')+'" placeholder="np. Zmiana poranna"></div>'+
    '<div class="cb-field"><label class="cb-lbl">Typ</label>'+
    '<select class="ios-select" id="se-typ">'+
      '<option value="Lekarz"'+(!sz||sz.typ==='Lekarz'?' selected':'')+'>Lekarz</option>'+
      '<option value="Higienizacja"'+(sz&&sz.typ==='Higienizacja'?' selected':'')+'>Higienizacja</option>'+
    '</select></div>'+
    '<div class="cb-grid2"><div class="cb-field"><label class="cb-lbl">Od</label>'+
    '<input type="time" class="ios-input" id="se-od" step="300" value="'+esc(sz?sz.od:'09:00')+'"></div>'+
    '<div class="cb-field"><label class="cb-lbl">Do</label>'+
    '<input type="time" class="ios-input" id="se-do" step="300" value="'+esc(sz?sz.do:'14:00')+'"></div></div>'+
    '<div class="cb-field"><label class="cb-lbl">Wymagana asysta (liczba osób)</label>'+
    '<input type="number" min="0" max="3" class="ios-input" id="se-as" value="'+
      (sz&&sz.asystaWymagana!=null?sz.asystaWymagana:1)+'"></div>'+
    '<button class="btn-primary" id="se-ok" style="margin-top:14px">Zapisz szablon</button>'+
    (sz?'<button class="btn-destructive" id="se-usun" style="margin-top:10px">Usuń szablon</button>':''));

  document.getElementById('se-ok').addEventListener('click',function(){
    var payload={
      id:sz?sz.id:'',
      nazwa:document.getElementById('se-nazwa').value.trim(),
      typ:document.getElementById('se-typ').value,
      od:document.getElementById('se-od').value,
      do:document.getElementById('se-do').value,
      asystaWymagana:document.getElementById('se-as').value
    };
    if(!payload.nazwa){ showErr('Podaj nazwę szablonu.'); return; }
    gas('masterSaveSzablonZmiany',[S.token,payload],function(r){
      if(!r||!r.ok){ showErr((r&&r.msg)||'Nie zapisano.'); return; }
      showOk('Zapisano szablon.');
      S.szablony=null;
      szablonySheet();
    });
  });
  var usunBtn=document.getElementById('se-usun');
  if(usunBtn) usunBtn.addEventListener('click',function(){
    if(usunBtn.getAttribute('data-armed')!=='1'){
      usunBtn.setAttribute('data-armed','1'); usunBtn.textContent='Na pewno? Kliknij ponownie';
      setTimeout(function(){ if(usunBtn){usunBtn.removeAttribute('data-armed');usunBtn.textContent='Usuń szablon';} },4000);
      return;
    }
    gas('masterDeleteSzablonZmiany',[S.token,sz.id],function(r){
      if(!r||!r.ok){ showErr((r&&r.msg)||'Nie usunięto.'); return; }
      showOk('Usunięto szablon.');
      S.szablony=null;
      szablonySheet();
    });
  });
}

function mcNowyBlok(d,robocze,potem){
  zapewnijSzablony(function(){ mcNowyBlokRysuj(d,robocze,potem); });
}

function mcNowyBlokRysuj(d,robocze,potem){
  var krok=(MC.dane.krokMin||5)*60;
  var szOpcje=(S.szablony||[]).map(function(sz){
    return '<option value="'+esc(sz.id)+'">'+esc(sz.nazwa)+' ('+esc(sz.od)+'–'+esc(sz.do)+')</option>';
  }).join('');
  showModal('<div class="modal-title">Nowy blok — '+esc(d.data)+'</div>'+
    (szOpcje?'<div class="cb-field"><label class="cb-lbl">Szablon zmiany (opcjonalnie)</label>'+
      '<select class="ios-select" id="n-szablon"><option value="">— wypełnij ręcznie —</option>'+
      szOpcje+'</select></div>':'')+
    '<div class="cb-field"><label class="cb-lbl">Typ</label>'+
    '<select class="ios-select" id="n-typ"><option value="Lekarz">Lekarz</option>'+
    '<option value="Higienizacja">Higienizacja</option></select></div>'+
    '<div class="cb-field"><label class="cb-lbl">Gabinet</label>'+
    '<select class="ios-select" id="n-gab">'+MC.dane.gabinety.map(function(g){
      return '<option value="'+esc(g.id)+'">'+esc(g.nazwa)+'</option>';
    }).join('')+'</select></div>'+
    '<div class="cb-field"><label class="cb-lbl">Osoba</label>'+
    '<select class="ios-select" id="n-os"></select></div>'+
    '<div class="cb-grid2"><div class="cb-field"><label class="cb-lbl">Od</label>'+
    '<input type="time" class="ios-input" id="n-od" step="'+krok+'" value="'+esc(d.godziny.open)+'"></div>'+
    '<div class="cb-field"><label class="cb-lbl">Do</label>'+
    '<input type="time" class="ios-input" id="n-do" step="'+krok+'" value="'+esc(d.godziny.close)+'"></div></div>'+
    '<div class="cb-field"><label class="cb-lbl">Asysta</label><div id="n-as"></div></div>'+
    '<button class="btn-primary" id="n-ok">Dodaj do dnia</button>');

  var wyb=[];
  function osoby(){
    var t=document.getElementById('n-typ').value;
    var grupa=t==='Higienizacja'?'higienistka':'lekarz';
    var l=(MC.dane.personel||[]).filter(function(p){return p.grupa===grupa;});
    document.getElementById('n-os').innerHTML=l.length
      ? l.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.imie+' '+p.nazwisko)+'</option>';}).join('')
      : '<option value="">— brak osób z tą rolą —</option>';
    document.getElementById('n-as').style.display=(t==='Higienizacja')?'none':'block';
  }
  function asysta(){
    var as=(MC.dane.personel||[]).filter(function(p){return p.grupa==='asystentka';})
      .concat(MC.dane.asystaZew.map(function(z){return {id:z.id,imie:z.label,nazwisko:''};}));
    document.getElementById('n-as').innerHTML='<div class="cb-tags">'+as.map(function(p){
      return '<button type="button" class="cb-tag off" data-a="'+esc(p.id)+'">'+
        esc((p.imie+' '+p.nazwisko).trim())+'</button>';
    }).join('')+'</div>';
    document.querySelectorAll('#n-as [data-a]').forEach(function(b){
      b.addEventListener('click',function(){
        var id=this.getAttribute('data-a');
        var i=wyb.indexOf(id);
        if(i===-1) wyb.push(id); else wyb.splice(i,1);
        this.classList.toggle('off',wyb.indexOf(id)===-1);
      });
    });
  }
  document.getElementById('n-typ').addEventListener('change',osoby);
  osoby(); asysta();

  var szSel=document.getElementById('n-szablon');
  if(szSel) szSel.addEventListener('change',function(){
    var wybId=this.value;
    var sz=(S.szablony||[]).find(function(x){return x.id===wybId;});
    if(!sz) return;
    document.getElementById('n-typ').value=sz.typ;
    osoby();
    document.getElementById('n-od').value=sz.od;
    document.getElementById('n-do').value=sz.do;
  });

  document.getElementById('n-ok').addEventListener('click',function(){
    var os=document.getElementById('n-os').value;
    if(!os){ showErr('Wybierz osobę.'); return; }
    var typ=document.getElementById('n-typ').value;
    robocze.push({
      gabinetId:document.getElementById('n-gab').value, typ:typ, osobaId:os,
      od:document.getElementById('n-od').value, do:document.getElementById('n-do').value,
      asystaWymagana:typ==='Higienizacja'?0:(wyb.length||1), asystaUwaga:'',
      asysta:typ==='Higienizacja'?[]:wyb.map(function(id){return {osobaId:id};})
    });
    potem();
  });
}

function mcKopiuj(zData,d){
  var kandydaci=MC.dane.dni.filter(function(x){
    return x.czynny && x.data!==zData && x.dzienTygodnia===d.dzienTygodnia;
  });
  var wyb=[];
  showModal('<div class="modal-title">Kopiuj obsadę</div>'+
    '<div class="ios-row-s" style="margin-bottom:12px">Z dnia '+esc(zData)+
    ' na inne '+esc(d.nazwaDnia.toLowerCase())+'i w tym miesiącu.</div>'+
    '<div class="cb-tags" id="kp-dni">'+kandydaci.map(function(x){
      return '<button type="button" class="cb-tag off" data-k="'+esc(x.data)+'">'+esc(x.data.slice(8))+'</button>';
    }).join('')+'</div>'+
    '<button class="btn-primary" id="kp-ok" style="margin-top:16px">Kopiuj</button>');

  document.querySelectorAll('#kp-dni [data-k]').forEach(function(b){
    b.addEventListener('click',function(){
      var v=this.getAttribute('data-k');
      var i=wyb.indexOf(v);
      if(i===-1) wyb.push(v); else wyb.splice(i,1);
      this.classList.toggle('off',wyb.indexOf(v)===-1);
    });
  });
  document.getElementById('kp-ok').addEventListener('click',function(){
    if(!wyb.length){ showErr('Zaznacz dni docelowe.'); return; }
    gas('masterKopiujDzienGrafiku',[S.token,zData,wyb],function(r){
      if(!r||!r.ok){ showErr((r&&r.msg)||'Błąd.'); return; }
      closeModal(); showOk('Skopiowano na '+r.skopiowano+' dni.'); mcWczytaj();
    });
  });
}

// ── Adnotacje — zarządzanie (lista miesiąca, edycja, powtarzanie) ──
// Odczyt/wyświetlanie adnotacji istniało już wcześniej (przy dniach
// w Grafiku i Miesiącu); tu dochodzi jedyne miejsce, gdzie da się je
// tworzyć/edytować/usuwać z poziomu Cerebro, plus opcja serii.

function adnotacjeSheet(){
  if(!MC.dane){ showErr('Poczekaj na wczytanie miesiąca.'); return; }
  showModal('<div class="modal-title">Adnotacje — '+esc(MIESIACE[MC.mies-1])+' '+MC.rok+'</div>'+
    '<div class="ios-row-s" style="margin-bottom:12px">Dotyczą wybranego zakresu dat — mogą wykraczać poza ten miesiąc.</div>'+
    '<div class="ios-card" id="adn-lista">'+skeleton(3)+'</div>'+
    '<button class="btn-primary" id="adn-nowa" style="margin-top:14px">+ Nowa adnotacja</button>');
  document.getElementById('adn-nowa').addEventListener('click',function(){ adnotacjaEdytuj(null); });
  adnotacjeWczytaj();
}

function adnotacjeWczytaj(){
  gas('masterGetAdnotacje',[S.token],function(res){
    var box=document.getElementById('adn-lista');
    if(!box) return;
    if(!res||!res.ok){ box.innerHTML=pusto('⚠️','Nie wczytano',(res&&res.msg)||''); return; }
    var pierwszy=MC.rok+'-'+String(MC.mies).padStart(2,'0')+'-01';
    var ostatni=MC.rok+'-'+String(MC.mies).padStart(2,'0')+'-'+String(new Date(MC.rok,MC.mies,0).getDate()).padStart(2,'0');
    var lista=(res.adnotacje||[]).filter(function(a){ return a.od<=ostatni && a.do>=pierwszy; })
      .sort(function(a,b){ return a.od<b.od?-1:a.od>b.od?1:0; });
    S.adnotacje=res.adnotacje||[];
    box.innerHTML=lista.length
      ? lista.map(function(a){
          var gab=(MC.dane.gabinety.find(function(g){return g.id===a.gabinetId;})||{}).nazwa;
          var os=a.osobaId?osobaNazwa(a.osobaId):'';
          return '<div class="ios-row"><div class="ios-row-b"><div class="ios-row-t">'+esc(a.tresc)+'</div>'+
            '<div class="ios-row-s">'+esc(a.od)+(a.do!==a.od?' – '+esc(a.do):'')+
              (gab?' · '+esc(gab):'')+(os?' · '+esc(os):'')+'</div></div>'+
            '<span class="badge '+adnBadge(a.typ)+'" style="margin-right:8px">'+esc(adnLabel(a.typ))+'</span>'+
            '<button class="btn-secondary btn-small" data-adn-edytuj="'+esc(a.id)+'">Edytuj</button></div>';
        }).join('')
      : pusto('🗓️','Brak adnotacji w tym miesiącu','Dodaj pierwszą poniżej');
    box.querySelectorAll('[data-adn-edytuj]').forEach(function(b){
      b.addEventListener('click',function(){
        var id=this.getAttribute('data-adn-edytuj');
        adnotacjaEdytuj(S.adnotacje.find(function(x){return x.id===id;}));
      });
    });
  });
}

function adnotacjaEdytuj(a){
  var gabOpcje=(MC.dane.gabinety||[]).map(function(g){
    return '<option value="'+esc(g.id)+'"'+(a&&a.gabinetId===g.id?' selected':'')+'>'+esc(g.nazwa)+'</option>';
  }).join('');
  var osobyDost=(MC.dane.personel||[]);
  var osOpcje=osobyDost.map(function(p){
    return '<option value="'+esc(p.id)+'"'+(a&&a.osobaId===p.id?' selected':'')+'>'+esc(p.imie+' '+p.nazwisko)+'</option>';
  }).join('');

  showModal('<div class="modal-title">'+(a?'Edytuj adnotację':'Nowa adnotacja')+'</div>'+
    '<div class="cb-field"><label class="cb-lbl">Treść</label>'+
    '<textarea class="ios-textarea" id="ae-tresc">'+esc(a?a.tresc:'')+'</textarea></div>'+
    '<div class="cb-field"><label class="cb-lbl">Typ</label>'+
    '<select class="ios-select" id="ae-typ">'+ADNOTACJA_TYPY_LISTA.map(function(t){
      return '<option value="'+t.id+'"'+(a&&a.typ===t.id||(!a&&t.id==='info')?' selected':'')+'>'+esc(t.label)+'</option>';
    }).join('')+'</select></div>'+
    '<div class="cb-grid2"><div class="cb-field"><label class="cb-lbl">Od</label>'+
    '<input type="date" class="ios-input" id="ae-od" value="'+esc(a?a.od:dzisStr())+'"></div>'+
    '<div class="cb-field"><label class="cb-lbl">Do</label>'+
    '<input type="date" class="ios-input" id="ae-do" value="'+esc(a?a.do:dzisStr())+'"></div></div>'+
    '<div class="cb-field"><label class="cb-lbl">Gabinet (opcjonalnie)</label>'+
    '<select class="ios-select" id="ae-gab"><option value="">— cała klinika —</option>'+gabOpcje+'</select></div>'+
    '<div class="cb-field"><label class="cb-lbl">Osoba (opcjonalnie)</label>'+
    '<select class="ios-select" id="ae-os"><option value="">— nie dotyczy jednej osoby —</option>'+osOpcje+'</select></div>'+
    (a?'':
      '<div class="cb-field"><label class="cb-lbl">Powtarzaj</label>'+
      '<select class="ios-select" id="ae-powt"><option value="">— nie powtarzaj —</option>'+
      '<option value="tydzien">co tydzień</option><option value="miesiac">co miesiąc</option>'+
      '<option value="rok">co rok</option></select></div>'+
      '<div class="cb-field" id="ae-powt-do-pole" style="display:none">'+
      '<label class="cb-lbl">Powtarzaj do</label><input type="date" class="ios-input" id="ae-powt-do"></div>')+
    '<button class="btn-primary" id="ae-ok" style="margin-top:14px">Zapisz</button>'+
    (a?'<button class="btn-destructive" id="ae-usun" style="margin-top:10px">Usuń adnotację</button>':''));

  var powtSel=document.getElementById('ae-powt');
  if(powtSel) powtSel.addEventListener('change',function(){
    document.getElementById('ae-powt-do-pole').style.display=this.value?'block':'none';
  });

  document.getElementById('ae-ok').addEventListener('click',function(){
    var payload={
      id:a?a.id:'', tresc:document.getElementById('ae-tresc').value.trim(),
      typ:document.getElementById('ae-typ').value,
      od:document.getElementById('ae-od').value, do:document.getElementById('ae-do').value,
      gabinetId:document.getElementById('ae-gab').value, osobaId:document.getElementById('ae-os').value
    };
    var powt=powtSel?powtSel.value:'';
    if(powt){
      var koniec=document.getElementById('ae-powt-do').value;
      if(!koniec){ showErr('Podaj datę końca powtarzania.'); return; }
      gas('masterSaveAdnotacjaSeria',[S.token,payload,{tryb:powt,do:koniec}],function(r){
        if(!r||!r.ok){ showErr((r&&r.msg)||'Nie zapisano.'); return; }
        showOk('Utworzono '+r.utworzono+' adnotacji.');
        adnotacjeSheet(); mcWczytaj();
      });
      return;
    }
    gas('masterSaveAdnotacja',[S.token,payload],function(r){
      if(!r||!r.ok){ showErr((r&&r.msg)||'Nie zapisano.'); return; }
      showOk('Zapisano adnotację.');
      adnotacjeSheet(); mcWczytaj();
    });
  });

  var usunBtn=document.getElementById('ae-usun');
  if(usunBtn) usunBtn.addEventListener('click',function(){
    if(usunBtn.getAttribute('data-armed')!=='1'){
      usunBtn.setAttribute('data-armed','1'); usunBtn.textContent='Na pewno? Kliknij ponownie';
      setTimeout(function(){ if(usunBtn){usunBtn.removeAttribute('data-armed');usunBtn.textContent='Usuń adnotację';} },4000);
      return;
    }
    gas('masterDeleteAdnotacja',[S.token,a.id],function(r){
      if(!r||!r.ok){ showErr((r&&r.msg)||'Nie usunięto.'); return; }
      showOk('Usunięto adnotację.');
      adnotacjeSheet(); mcWczytaj();
    });
  });
}

// ── Wydruk / eksport miesiąca — filtry osoby/gabinet/zakres ────
// Cały silnik filtrowania (daty, godziny, gabinety, osoby) już istniał
// po stronie backendu (masterGrafikWydruk, używany przez klasyczny
// panel) — tu dochodzi tylko formularz i wyrenderowanie wyniku do
// wydruku w stylu Cerebro.

function wydrukSheet(){
  if(!MC.dane){ showErr('Poczekaj na wczytanie miesiąca.'); return; }
  var pierwszy=MC.rok+'-'+String(MC.mies).padStart(2,'0')+'-01';
  var ostatni=MC.rok+'-'+String(MC.mies).padStart(2,'0')+'-'+String(new Date(MC.rok,MC.mies,0).getDate()).padStart(2,'0');
  showModal('<div class="modal-title">Wydruk grafiku</div>'+
    '<div class="cb-grid2"><div class="cb-field"><label class="cb-lbl">Od</label>'+
    '<input type="date" class="ios-input" id="wd-od" value="'+esc(pierwszy)+'"></div>'+
    '<div class="cb-field"><label class="cb-lbl">Do</label>'+
    '<input type="date" class="ios-input" id="wd-do" value="'+esc(ostatni)+'"></div></div>'+
    '<div class="cb-grid2"><div class="cb-field"><label class="cb-lbl">Godzina od (opcjonalnie)</label>'+
    '<input type="time" class="ios-input" id="wd-god"></div>'+
    '<div class="cb-field"><label class="cb-lbl">Godzina do (opcjonalnie)</label>'+
    '<input type="time" class="ios-input" id="wd-gdo"></div></div>'+
    '<div class="cb-field"><label class="cb-lbl">Gabinety (puste = wszystkie)</label>'+
    '<div class="cb-tags" id="wd-gab">'+(MC.dane.gabinety||[]).map(function(g){
      return '<button type="button" class="cb-tag off" data-g="'+esc(g.id)+'">'+esc(g.nazwa)+'</button>';
    }).join('')+'</div></div>'+
    '<div class="cb-field"><label class="cb-lbl">Osoby (puste = wszystkie)</label>'+
    '<div class="cb-tags" id="wd-os">'+(MC.dane.personel||[]).map(function(p){
      return '<button type="button" class="cb-tag off" data-o="'+esc(p.id)+'">'+esc(p.imie+' '+p.nazwisko)+'</button>';
    }).join('')+'</div></div>'+
    '<button class="btn-primary" id="wd-ok" style="margin-top:14px">Przygotuj i drukuj</button>');

  var gWyb=[], oWyb=[];
  function przelacz(sel,wyb,attr){
    document.querySelectorAll(sel).forEach(function(b){
      b.addEventListener('click',function(){
        var v=this.getAttribute(attr);
        var i=wyb.indexOf(v);
        if(i===-1) wyb.push(v); else wyb.splice(i,1);
        this.classList.toggle('off',wyb.indexOf(v)===-1);
      });
    });
  }
  przelacz('#wd-gab [data-g]',gWyb,'data-g');
  przelacz('#wd-os [data-o]',oWyb,'data-o');

  document.getElementById('wd-ok').addEventListener('click',function(){
    var opts={

function gcalSheet(){
  showModal('<div class="modal-title">Google Calendar</div>'+
    '<div id="gc-body">'+skeleton(2)+'</div>');
  gas('masterGcalGetConfig',[S.token],function(res){
    var box=document.getElementById('gc-body');
    if(!box) return;
    if(!res||!res.ok){ box.innerHTML=pusto('⚠️','Nie wczytano',(res&&res.msg)||''); return; }
    gcalRysuj(res);

function gcalRysuj(cfg){
  var box=document.getElementById('gc-body');
  var status=cfg.calendarId
    ? (cfg.polaczony
        ? '<div class="ios-row"><div class="ios-row-b"><div class="ios-row-t">Podłączony kalendarz</div>'+
          '<div class="ios-row-s">'+esc(cfg.nazwaKalendarza)+'</div></div>'+
          '<span class="badge badge-green">połączono</span></div>'
        : '<div class="ios-row"><div class="ios-row-b"><div class="ios-row-t">Kalendarz niedostępny</div>'+
          '<div class="ios-row-s">Sprawdź identyfikator albo uprawnienia.</div></div>'+
          '<span class="badge badge-red">błąd</span></div>')
    : '<div class="ios-row-s" style="margin-bottom:8px">Nie podłączono jeszcze kalendarza.</div>';

  box.innerHTML=
    (cfg.calendarId?'<div class="ios-card" style="margin-bottom:14px">'+status+'</div>':'')+
    '<div class="cb-field"><label class="cb-lbl">Identyfikator kalendarza Google</label>'+
    '<input class="ios-input" id="gc-id" value="'+esc(cfg.calendarId||'')+'" '+
      'placeholder="np. twoj.email@gmail.com albo xxxx@group.calendar.google.com"></div>'+
    '<div class="ios-row-s" style="margin-bottom:12px">Znajdziesz go w Ustawieniach kalendarza Google → '+
      'Integracja → Identyfikator kalendarza.</div>'+
    '<button class="btn-primary" id="gc-polacz">'+(cfg.calendarId?'Zaktualizuj połączenie':'Połącz')+'</button>'+
    (cfg.calendarId?'<button class="btn-secondary" id="gc-odlacz" style="margin-top:10px">Odłącz kalendarz</button>':'')+
    (cfg.polaczony?
      '<div class="section-title" style="margin-top:18px">Synchronizacja</div>'+
      '<div class="ios-row-s" style="margin-bottom:12px">Obejmuje bieżąco otwarty miesiąc w zakładce Miesiąc'+
        (MC.dane?' ('+esc(MIESIACE[MC.mies-1])+' '+MC.rok+')':'')+'.</div>'+
      '<button class="btn-primary" id="gc-sync">Synchronizuj ten miesiąc</button>'+
      '<div id="gc-wynik"></div>'
      :'');

  document.getElementById('gc-polacz').addEventListener('click',function(){
    var id=document.getElementById('gc-id').value.trim();
    if(!id){ showErr('Podaj identyfikator kalendarza.'); return; }
    showToast('Łączenie…','info');
    gas('masterGcalSetConfig',[S.token,id],function(r){
      if(!r||!r.ok){ showErr((r&&r.msg)||'Nie udało się połączyć.'); return; }
      showOk('Połączono z „'+r.nazwaKalendarza+'”.');
      gcalSheet();
    });
  });
  var odlaczBtn=document.getElementById('gc-odlacz');
  if(odlaczBtn) odlaczBtn.addEventListener('click',function(){
    gas('masterGcalSetConfig',[S.token,''],function(r){
      if(!r||!r.ok){ showErr((r&&r.msg)||'Błąd.'); return; }
      showOk('Odłączono kalendarz.');
      gcalSheet();
    });
  });
  var syncBtn=document.getElementById('gc-sync');
  if(syncBtn) syncBtn.addEventListener('click',function(){
    if(!MC.dane){ showErr('Otwórz najpierw zakładkę Miesiąc.'); return; }
    syncBtn.disabled=true; syncBtn.textContent='Synchronizuję…';
    gas('masterGcalSync',[S.token,MC.rok,MC.mies],function(r){
      syncBtn.disabled=false; syncBtn.textContent='Synchronizuj ten miesiąc';
      var wynik=document.getElementById('gc-wynik');
      if(!r||!r.ok){ if(wynik) wynik.innerHTML=pusto('⚠️','Błąd synchronizacji',(r&&r.msg)||''); return; }
      if(wynik) wynik.innerHTML='<div class="ios-row-s" style="margin-top:10px">'+
        'Utworzono: '+r.utworzono+' · Zaktualizowano: '+r.zaktualizowane+' · Usunięto: '+r.usuniete+
        ' · Pobrano zmian godzin z kalendarza: '+r.pociagnieteZKalendarza+
        (r.bledyPull&&r.bledyPull.length?'<br><span style="color:var(--cb-red)">'+esc(r.bledyPull.join(' · '))+'</span>':'')+
        '</div>';
      showOk('Zsynchronizowano.');
      mcWczytaj();
    });
  });
}

function rysujZespol(){
  var box=document.getElementById('z-lista');
  if(!box) return;

    var braki=[];
    if(!e.forma) braki.push('brak formy zatrudnienia');
    if(e.grupa==='lekarz'&&!(e.tagi||[]).length) braki.push('brak specjalizacji');

        '<span class="badge badge-green">'+esc(e.forma)+'</span>')+chev()+'</button>';

    b.addEventListener('click',function(){ zespolOsoba(this.getAttribute('data-emp')); });

function zespolOsoba(id){
  var e=S.emps.find(function(x){return x.id===id;});
  if(!e) return;
  var lekarz=e.grupa==='lekarz';
  var FORMY={UoP:'Umowa o pracę',Zlecenie:'Umowa zlecenie',B2B:'B2B'};

  showModal('<div class="modal-title">'+esc(e.imie+' '+e.nazwisko)+'</div>'+
    '<div class="ios-row-s" style="margin-bottom:16px">'+esc(e.rola||'')+
    (lekarz?' · nie odbija się w RCP':'')+'</div>'+
    '<div class="cb-field"><label class="cb-lbl">Forma zatrudnienia</label>'+
    '<select class="ios-select" id="e-forma"><option value="">— nieustawiona —</option>'+
    Object.keys(FORMY).map(function(f){
      return '<option value="'+f+'"'+(e.forma===f?' selected':'')+'>'+FORMY[f]+'</option>';
    }).join('')+'</select></div>'+
    (lekarz?'<div class="cb-field"><label class="cb-lbl">Specjalizacje</label>'+
      '<div class="cb-tags" id="e-tagi">'+S.tagi.map(function(t){
        var on=(e.tagi||[]).indexOf(t)!==-1;
        return '<button type="button" class="cb-tag'+(on?'':' off')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>';
      }).join('')+'</div></div>':'')+
    '<button class="btn-primary" id="e-zapisz">Zapisz</button>'+
    (String(e.rola).toLowerCase()==='admin'?'':
      '<button class="btn-destructive" id="e-arch" style="margin-top:10px">Przenieś do archiwum</button>'));

  document.querySelectorAll('#e-tagi [data-t]').forEach(function(b){
    b.addEventListener('click',function(){
      var t=this.getAttribute('data-t');
      var l=(e.tagi||[]).slice();
      var i=l.indexOf(t);
      if(i===-1) l.push(t); else l.splice(i,1);
      var self=this;
      gas('masterSetDoctorTags',[S.token,id,l],function(r){
        if(!r||!r.ok){ showErr((r&&r.msg)||'Błąd.'); return; }
        e.tagi=r.tagi||l;
        self.classList.toggle('off',e.tagi.indexOf(t)===-1);
      });
    });
  });
  document.getElementById('e-zapisz').addEventListener('click',function(){
    gas('masterSetEmploymentForm',[S.token,id,document.getElementById('e-forma').value],function(r){
      if(!r||!r.ok){ showErr((r&&r.msg)||'Błąd.'); return; }
      e.forma=document.getElementById('e-forma').value;
      closeModal(); showOk('Zapisano.'); rysujZespol();
    });
  });
  var ar=document.getElementById('e-arch');
  if(ar) ar.addEventListener('click',function(){
    var b=this;
    if(b.getAttribute('data-armed')!=='1'){
      b.setAttribute('data-armed','1'); b.textContent='Na pewno? Kliknij ponownie';
      setTimeout(function(){b.removeAttribute('data-armed');b.textContent='Przenieś do archiwum';},4000);
      return;
    }
    gas('masterRemoveEmployee',[S.token,id],function(r){
      if(!r||!r.ok){ showErr((r&&r.msg)||'Błąd.'); return; }
      S.emps=S.emps.filter(function(x){return x.id!==id;});
      closeModal(); showOk('Przeniesiono do archiwum.'); rysujZespol();
    });
  });
}

    gas('masterAddEmployee',[S.token,imie,nazw,rola,p],function(r){
      if(!r||!r.ok){ showErr((r&&r.msg)||'Błąd.'); return; }
      S.emps.push(r.employee);

function modRaporty(){

    '<div class="cb-wrap">'+naglowek('Raporty','Czas pracy zespołu',

    '<div class="section-title" id="r-lbl">—</div>'+
    '<div id="r-lista">'+skeleton(4)+'</div></div>';
  document.getElementById('r-prev').addEventListener('click',function(){
    S.rpMonth--; if(S.rpMonth<1){S.rpMonth=12;S.rpYear--;} rapWczytaj();
  });
  document.getElementById('r-next').addEventListener('click',function(){
    S.rpMonth++; if(S.rpMonth>12){S.rpMonth=1;S.rpYear++;} rapWczytaj();
  });
  document.getElementById('r-exp').addEventListener('click',function(){
    showInfo('Generuję plik…');
    gas('masterDashExportXlsx',[S.token,{mode:'month',year:S.rpYear,month:S.rpMonth}],function(res){
      if(!res||!res.ok){ showErr('Błąd eksportu.'); return; }
      var bc=atob(res.base64),n=new Array(bc.length);
      for(var i=0;i<bc.length;i++) n[i]=bc.charCodeAt(i);
      var blob=new Blob([new Uint8Array(n)],
        {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      var u=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=u; a.download=res.filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(u);
      showOk('Plik pobrany.');
    });
  });
  rapWczytaj();
}

var KOD={win:30,left:0,laduje:false,timer:null};
function modKod(){
  document.getElementById('cb-content').innerHTML=
    '<div class="cb-wrap">'+naglowek('Kod autoryzacyjny','Kod rotacyjny z tabletu recepcji')+
    '<div class="ios-card pad" style="text-align:center">'+
    '<div id="k-kod" style="font-size:56px;font-weight:700;letter-spacing:.1em;'+
    'font-variant-numeric:tabular-nums;color:var(--cb-blue);margin:12px 0">----</div>'+
    '<div id="k-st" class="ios-row-s"></div></div>'+
    '<button class="btn-secondary" id="k-odswiez" style="margin-top:16px">Odśwież kod</button>'+
    '<a class="btn-secondary" style="margin-top:10px;display:block;text-align:center;text-decoration:none" '+
    'href="'+esc(BASE_URL)+'?page=admin" target="_blank" rel="noopener">Otwórz pełny ekran</a></div>';

  document.getElementById('k-odswiez').addEventListener('click',function(){ kodPobierz(true); });
  kodPobierz(false);
  if(KOD.timer) clearInterval(KOD.timer);
  KOD.timer=setInterval(function(){
    if(S.modul!=='kod') return;
    if(KOD.left>0){ KOD.left--; kodRysuj(); if(KOD.left===0) kodPobierz(false); }
  },1000);
}
function kodPobierz(force){
  if(KOD.laduje) return;
  KOD.laduje=true;
  gas('getToken',[!!force],function(res){
    KOD.laduje=false;
    if(!res||!res.ok) return;
    var el=document.getElementById('k-kod');
    if(el) el.textContent=res.token;
    KOD.win=res.winSec||30;
    KOD.left=Math.max(1,Math.min(KOD.win,parseInt(res.secLeft,10)||KOD.win));
    kodRysuj();
  });
}
function kodRysuj(){
  var st=document.getElementById('k-st');
  if(!st) return;
  var zielony=(KOD.win-KOD.left)<=20;
  st.textContent=zielony?('Ważny jeszcze '+KOD.left+' s'):('Kod wkrótce wygaśnie ('+KOD.left+' s)');
  var el=document.getElementById('k-kod');
  if(el) el.style.color=zielony?'var(--cb-blue)':'var(--cb-red)';
}

function modPomoc(){
  document.getElementById('cb-content').innerHTML=
    '<div class="cb-wrap">'+naglowek('Pomoc','Słownik pojęć i wyszukiwarka')+
    '<div class="cb-field"><input type="text" class="ios-input" id="h-szukaj" placeholder="Szukaj…"></div>'+
    '<div id="h-lista"></div></div>';
  var dane=(window.WS_GLOSSARY||[]);
  function rysuj(q){
    q=(q||'').toLowerCase().trim();
    var l=dane.filter(function(e){
      return !q||e.term.toLowerCase().indexOf(q)!==-1||e.def.toLowerCase().indexOf(q)!==-1;
    });
    document.getElementById('h-lista').innerHTML=l.length
      ? '<div class="ios-card">'+l.map(function(e){
          return '<div class="ios-row"><div class="ios-row-b">'+
            '<div class="ios-row-t">'+esc(e.term)+'</div>'+
            '<div class="ios-row-s">'+esc(e.def)+'</div>'+
            (e.loc?'<div class="ios-row-s" style="color:var(--cb-blue);margin-top:4px">'+esc(e.loc)+'</div>':'')+
            '</div><span class="badge badge-gray">'+esc(e.cat)+'</span></div>';
        }).join('')+'</div>'
      : pusto('🔍','Brak wyników','Spróbuj innego hasła');
  }
  document.getElementById('h-szukaj').addEventListener('input',function(){ rysuj(this.value); });
  rysuj('');
}
