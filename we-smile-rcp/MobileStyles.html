<style>
/* ════════════════════════════════════════════════════════════
   WSPÓLNE STYLE INTERFEJSU MOBILNEGO
   Powłoka aplikacji i komponenty używane przez wszystkie ekrany
   mobilne (Panel Właściciela, Panel Raportowy). Jedno miejsce,
   żeby wersje mobilne nie rozjechały się z czasem — dokładnie
   ta sama rola, jaką Styles.html pełni dla desktopu.
   ════════════════════════════════════════════════════════════ */
:root{
  --m-head-h:54px;
  --m-nav-h:58px;
  --m-safe-b:env(safe-area-inset-bottom,0px);
  --m-gap:12px;
}

html,body{overscroll-behavior-y:none}
body{background:var(--c-offwhite)}

/* Elementy współdzielone ze Styles.html, które na mobile muszą ustąpić
   dolnej nawigacji — inaczej zasłaniałyby przyciski. */
.faq-fab{display:none !important}
.ws-status-footer{bottom:calc(var(--m-nav-h) + var(--m-safe-b));padding-bottom:8px;font-size:11px}
#toast{bottom:calc(var(--m-nav-h) + var(--m-safe-b) + 20px)}

/* ── Logowanie ── */
.m-login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px 20px calc(24px + var(--m-safe-b));
  background:var(--grad-hero)}
.m-login .wm{color:#fff;margin-bottom:6px}
.m-login-sub{color:rgba(255,255,255,.72);font-size:13px;margin-bottom:26px;text-align:center}
.m-login-card{background:var(--c-white);border-radius:24px;padding:24px 20px;width:100%;
  max-width:360px;box-shadow:var(--shadow-l)}

/* ── Powłoka aplikacji ── */
.m-head{position:sticky;top:0;z-index:40;height:var(--m-head-h);
  display:flex;align-items:center;gap:6px;padding:0 8px;
  background:var(--grad-hero);color:#fff}
.m-head-title{flex:1;min-width:0;font-size:16px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.m-hbtn{width:42px;height:42px;flex-shrink:0;border:none;background:transparent;color:#fff;
  border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.m-hbtn:active{background:rgba(255,255,255,.18)}

/* Pełna szerokość ekranu — strona nie ma bocznego marginesu.
   Bloki treści (karty, listy) idą od krawędzi do krawędzi, a wcięcie
   dają dopiero wewnętrznym paddingiem. Elementy sterujące (przyciski,
   pola) dostają własny margines, bo przycisk dosunięty do samej krawędzi
   ekranu trudno trafić kciukiem. */
#m-main{padding:var(--m-gap) 0 calc(var(--m-nav-h) + var(--m-safe-b) + 34px)}
.m-view{display:none}
.m-view.on{display:block;animation:mFade .18s ease}
@keyframes mFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── Nawigacja dolna (strefa kciuka) ── */
.m-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(var(--m-nav-h) + var(--m-safe-b));padding-bottom:var(--m-safe-b);
  display:flex;background:var(--c-white);border-top:1px solid var(--c-border);
  box-shadow:0 -2px 14px rgba(6,16,24,.07)}
.m-nav-btn{flex:1;border:none;background:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--c-muted);font-size:10.5px;font-weight:600;font-family:inherit;padding:0;
  -webkit-tap-highlight-color:transparent}
.m-nav-btn svg{width:23px;height:23px}
.m-nav-btn.on{color:var(--c-primary)}
.m-nav-btn .m-nav-dot{position:absolute;top:6px;margin-left:18px;width:7px;height:7px;
  border-radius:50%;background:var(--c-accent)}
@keyframes mNavPop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}
.m-nav-btn.pop svg{animation:mNavPop .34s ease-out}

/* ── Karty i listy ── */
.m-card{background:var(--c-white);border:1px solid var(--c-border);border-left:none;border-right:none;
  border-radius:0;padding:14px var(--m-gap);margin-bottom:var(--m-gap)}
.m-card-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  color:var(--c-muted);margin-bottom:10px}

.m-list{background:var(--c-white);border:1px solid var(--c-border);border-left:none;border-right:none;
  border-radius:0;overflow:hidden;margin-bottom:var(--m-gap)}
.m-item{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;
  padding:11px 14px;background:none;border:none;border-bottom:1px solid var(--c-border);
  text-align:left;font-family:inherit;cursor:pointer;color:var(--c-ink)}
.m-item:last-child{border-bottom:none}
.m-item:active{background:var(--c-offwhite)}
.m-item-body{flex:1;min-width:0}
.m-item-t{font-size:15px;font-weight:600;color:var(--c-ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-item-s{font-size:12.5px;color:var(--c-muted);margin-top:2px;line-height:1.4}
.m-item-r{flex-shrink:0;font-size:13px;color:var(--c-muted);font-weight:600;
  display:flex;align-items:center;gap:8px}
.m-chev{color:var(--c-muted);flex-shrink:0}
.m-ico-box{width:38px;height:38px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--c-primary-tint);color:var(--c-primary)}
.m-ico-box svg{width:20px;height:20px}

/* ── Kafelki podsumowań ── */
.m-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 var(--m-gap) var(--m-gap)}
.m-tile{background:var(--c-white);border:1px solid var(--c-border);border-radius:14px;padding:13px}
.m-tile-v{font-size:22px;font-weight:800;color:var(--c-primary);line-height:1.15}
.m-tile-v.accent{color:var(--c-accent)}
.m-tile-v.ok{color:var(--c-success)}
.m-tile-l{font-size:11px;color:var(--c-muted);font-weight:600;margin-top:3px;line-height:1.3}

/* ── Poziomy pasek wyboru (dni, miesiące) ── */
.m-chips{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding:2px var(--m-gap) 10px;margin:0}
.m-chips::-webkit-scrollbar{display:none}
.m-chip{flex:0 0 auto;min-height:42px;padding:0 16px;border-radius:999px;border:none;
  background:var(--c-white);color:var(--c-ink);font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer;border:1px solid var(--c-border);
  display:flex;align-items:center;gap:6px}
.m-chip.on{background:var(--grad-brand);color:#fff;border-color:transparent}
.m-chip-b{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--c-accent);
  color:#fff;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.m-chip.on .m-chip-b{background:rgba(255,255,255,.9);color:var(--c-accent)}

/* ── Pasek nawigacji miesiąca / dnia ── */
.m-stepper{display:flex;align-items:center;gap:10px;margin:0 var(--m-gap) var(--m-gap)}
.m-stepper-l{flex:1;text-align:center;font-size:15px;font-weight:700;color:var(--c-ink)}
.m-step-btn{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:1px solid var(--c-border);
  background:var(--c-white);color:var(--c-ink);display:flex;align-items:center;
  justify-content:center;cursor:pointer}

/* ── Arkusz pełnoekranowy (zamiast okna modalnego) ── */
.m-sheet{position:fixed;inset:0;z-index:120;background:var(--c-offwhite);
  display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);visibility:hidden}
.m-sheet.on{transform:translateY(0);visibility:visible}
.m-sheet-head{flex-shrink:0;height:var(--m-head-h);display:flex;align-items:center;gap:6px;
  padding:0 6px;background:var(--c-white);border-bottom:1px solid var(--c-border)}
.m-sheet-title{flex:1;min-width:0;text-align:center;font-size:15px;font-weight:700;color:var(--c-ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-sheet-btn{min-width:64px;height:42px;border:none;background:none;color:var(--c-primary);
  font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;padding:0 10px;border-radius:10px}
.m-sheet-btn:active{background:var(--c-primary-tint)}
.m-sheet-btn.ghost{color:var(--c-muted)}
.m-sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:var(--m-gap) 0 calc(var(--m-gap) + var(--m-safe-b) + 20px)}

/* ── Pola formularzy — powiększone pod palec ── */
.m-field{margin:0 var(--m-gap) 14px}
.m-lbl{display:block;font-size:12px;font-weight:700;color:var(--c-muted);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.m-inp,.m-sel,.m-ta{width:100%;min-height:52px;border-radius:13px;border:1.5px solid var(--c-border-strong);
  background:var(--c-white);color:var(--c-ink);padding:13px 15px;
  font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none}
.m-inp:focus,.m-sel:focus,.m-ta:focus{outline:none;border-color:var(--c-primary)}
.m-ta{min-height:96px;resize:vertical;line-height:1.5}
.m-sel{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B7B8A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:right 14px center;background-size:20px;padding-right:44px}
.m-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.m-btn{width:calc(100% - var(--m-gap) * 2);min-height:52px;border-radius:14px;border:none;
  font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px;margin:0 var(--m-gap) 10px}
.m-btn-p{background:var(--grad-brand);color:#fff;box-shadow:var(--shadow-cta)}
.m-btn-a{background:var(--c-accent);color:#fff}
.m-btn-g{background:var(--c-white);color:var(--c-ink);border:1.5px solid var(--c-border-strong)}
.m-btn-d{background:none;color:var(--c-accent);font-weight:600}
.m-btn:active{transform:scale(.985)}

/* ── Obecność ── */
.m-pres{display:flex;align-items:center;gap:11px;padding:11px 14px;
  border-bottom:1px solid var(--c-border)}
.m-pres:last-child{border-bottom:none}
.m-pres-n{flex:1;font-size:14.5px;font-weight:600;color:var(--c-ink)}
.m-pres-t{font-family:ui-monospace,monospace;font-size:13px;font-weight:700;color:var(--c-primary)}
.m-pres.done .m-pres-n{color:var(--c-muted)}
.m-pres.done .m-pres-t{color:var(--c-muted)}

/* ── Dzień w widoku miesiąca / raportu ── */
.m-day{background:var(--c-white);border:1px solid var(--c-border);border-left:none;border-right:none;
  border-radius:0;padding:12px var(--m-gap);margin-bottom:9px}
.m-day.wknd{background:var(--c-offwhite)}
.m-day-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.m-day-n{font-size:15px;font-weight:800;color:var(--c-ink)}
.m-day-d{font-size:12.5px;color:var(--c-muted);font-weight:600;flex:1}
.m-day-tot{font-family:ui-monospace,monospace;font-size:14px;font-weight:800;color:var(--c-primary)}
.m-day-b{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.m-time{width:100%;min-height:48px;border-radius:11px;border:1.5px solid var(--c-border-strong);
  background:var(--c-white);color:var(--c-ink);padding:10px 12px;font-size:16px;
  font-family:ui-monospace,monospace;-webkit-appearance:none;appearance:none}
.m-time:focus{outline:none;border-color:var(--c-primary)}
.m-time.saving{border-color:var(--c-accent)}
.m-time.saved{border-color:var(--c-primary)}
.m-badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:7px;
  background:var(--c-primary-tint);color:var(--c-primary)}
.m-badge.ovr{background:var(--c-accent-tint);color:var(--c-accent)}

/* ── Drobne ── */
.m-empty{text-align:center;color:var(--c-muted);font-size:14px;padding:32px 16px;line-height:1.55}
.m-note{font-size:12.5px;color:var(--c-muted);line-height:1.5;margin:0 var(--m-gap) var(--m-gap)}
.m-tag{display:inline-block;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;
  background:var(--c-primary-tint);color:var(--c-primary);margin:0 5px 5px 0;border:none;
  font-family:inherit;cursor:pointer}
.m-tag.off{background:var(--c-field);color:var(--c-muted)}
.m-hint-b{display:flex;gap:9px;align-items:flex-start;background:var(--c-navy-tint);
  border-radius:0;padding:12px var(--m-gap);font-size:12.5px;line-height:1.5;color:var(--c-navy);
  margin:0 0 var(--m-gap)}
.m-hint-b .ic-sm{flex-shrink:0;margin-top:1px}
.m-hint-x{background:none;border:none;color:var(--c-navy);opacity:.55;padding:0;cursor:pointer;flex-shrink:0}
</style>
