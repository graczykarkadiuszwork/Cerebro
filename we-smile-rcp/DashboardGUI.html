<title>We SMILE — Panel Raportowy</title>

<style>
/* ── Hero rows specific to this view ── */
.month-nav{display:flex;align-items:center;gap:10px;flex:1;justify-content:center}
.month-label{font-size:20px;font-weight:700;min-width:150px;text-align:center;color:#fff;letter-spacing:.01em}
.norma-group{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:8px 16px;flex:1;min-height:44px;backdrop-filter:blur(6px)}
.norma-lbl{font-size:13px;color:rgba(255,255,255,.65);white-space:nowrap}
.norma-inp{background:transparent;border:none;color:#fff;font-size:15px;font-weight:700;width:64px;text-align:right}
.norma-inp:focus{outline:none}
.norma-tick{color:#fff;opacity:0;transition:.4s;display:flex}
.norma-tick.on{opacity:1}

/* ── Akcja: eksport Excel (przeniesiona z paska górnego — pkt 10/11) ── */
.export-cta{margin-bottom:16px}


/* ── Employee selector (style dropdownu wspólne w Styles) ── */
.sel-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--c-muted);font-weight:600;margin-bottom:6px}
.emp-sel-wrap{position:relative;margin-bottom:16px}

/* ── Employee card ── */
.emp-card{margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.emp-name{font-size:19px;font-weight:700;color:var(--c-ink);margin-bottom:4px}
.emp-role{font-size:12px;color:var(--c-muted);background:var(--c-offwhite);padding:3px 11px;border-radius:var(--radius-pill);display:inline-block}
.hours-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--c-muted)}
.hours-val{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hours-ok{color:var(--c-primary)}
.hours-bad{color:var(--c-accent)}
.hours-neutral{color:var(--c-ink)}
.emp-flags{display:flex;gap:8px;flex-wrap:wrap}

/* ── Annotation ── */
.note-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--c-muted);font-weight:600;margin-bottom:6px}
.note-ta.warn{border-color:var(--c-accent)}
.note-save-row{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--c-primary);font-size:12px;font-weight:600}
.note-tick{opacity:0;transition:.4s;display:flex;align-items:center;gap:6px}
.note-tick.on{opacity:1}

/* ── Table ── */
.table-wrap{overflow-x:auto;border-radius:var(--radius-m);border:1px solid var(--c-border);-webkit-overflow-scrolling:touch;background:var(--c-white)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--c-offwhite);color:var(--c-muted);font-weight:600;padding:10px 12px;text-align:left;border-bottom:1px solid var(--c-border);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{padding:11px 12px;border-bottom:1px solid var(--c-border);vertical-align:middle;color:var(--c-ink)}
tr:last-child td{border-bottom:none}
tr.wknd td{color:var(--c-muted)}
tr[data-date]{cursor:pointer}
tr[data-date]:active td{background:var(--c-offwhite)}
.t-time{font-family:ui-monospace,monospace;font-weight:600;color:var(--c-ink);font-size:13px}
.t-empty{color:#C6CBD2}
.t-hours{font-weight:700;color:var(--c-primary);font-family:ui-monospace,monospace}
.t-miss{color:var(--c-accent);font-weight:700}
.ovr-ico{color:var(--c-accent);margin-left:5px;display:inline-flex;vertical-align:-3px}
tr.note-tr td{background:var(--c-offwhite);font-size:12px;color:var(--c-muted);line-height:1.5;padding:8px 12px;border-bottom:1px solid var(--c-border)}
tr.note-tr .nt-row{display:flex;align-items:center;gap:6px}
tr.note-tr .nt-abs{color:var(--c-primary)}
tr.note-tr .nt-ovr{color:var(--c-accent)}

/* ── Calendar ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-head{text-align:center;font-size:11px;font-weight:700;color:var(--c-muted);padding:6px 0}
.cal-cell{background:var(--c-white);border:1px solid var(--c-border);border-radius:8px;padding:6px 4px;min-height:74px;font-size:11px;cursor:pointer;position:relative}
.cal-wknd{background:var(--c-offwhite)}
.cal-empty{background:transparent;border-color:transparent;cursor:default}
.cal-dn{font-size:12px;font-weight:700;color:var(--c-muted);margin-bottom:3px}
.cal-in,.cal-out{font-family:ui-monospace,monospace;font-size:10px;color:var(--c-ink);font-weight:600;white-space:nowrap}
.cal-h{font-size:10px;color:var(--c-primary);font-weight:700;margin-top:2px;font-family:ui-monospace,monospace}
.cal-miss{color:var(--c-accent);font-weight:700;font-size:12px}
.cal-abs{display:inline-block;background:var(--c-primary-tint);color:var(--c-primary);font-size:10px;font-weight:800;padding:2px 5px;border-radius:6px;margin-top:2px}
.cal-ovr{position:absolute;top:4px;right:5px;color:var(--c-accent);display:flex}

@media(min-width:600px){
  .hero{flex-direction:row;flex-wrap:wrap;padding:14px 22px 18px;align-items:center}
  .hero-row{flex:initial}
  .norma-group{flex:initial}
  .emp-card{flex-direction:row;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
}
</style>
</head>

<script>
/* Wybór wersji interfejsu — identyczna zasada jak w Panelu Właściciela.
   Raz podjęty wybór zapamiętujemy w localStorage. */
(function () {
  try {
    var wybor = localStorage.getItem('wesmile_ui');
    var param = (location.search.match(/[?&]ui=(\w+)/) || [])[1];
    if (param) { localStorage.setItem('wesmile_ui', param); wybor = param; }
    if (wybor === 'desktop') return;
    var maly = window.matchMedia('(max-width:820px)').matches;
    var dotyk = /Android|iPhone|iPod|Windows Phone/i.test(navigator.userAgent);
    if (wybor === 'mobile' || maly || dotyk) {
      document.documentElement.style.visibility = 'hidden';
      window.open("<?= BASE_URL ?>?page=dashboard-mobile", '_top');
    }
  } catch (e) { /* przy problemie zostajemy na desktopie */ }
})();
</script>

        <input type="radio" name="exp-mode" value="month" checked style="accent-color:var(--c-primary);width:18px;height:18px"> Jeden miesiąc</label>
      <label class="field-lbl" style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--c-ink);cursor:pointer">
        <input type="radio" name="exp-mode" value="range" style="accent-color:var(--c-primary);width:18px;height:18px"> Zakres dat</label>
    </div>

    <div id="exp-mode-month" class="field" style="margin-top:14px">
      <input type="month" id="exp-month" class="inp">
    </div>

    <div id="exp-mode-range" class="field-row2" style="display:none;margin-top:14px">
      <div class="field">
        <div class="field-lbl">Od</div>
        <input type="month" id="exp-from" class="inp">
      </div>
      <div class="field">
        <div class="field-lbl">Do</div>
        <input type="month" id="exp-to" class="inp">
      </div>
    </div>

    <div class="section">
      <div class="section-title" style="justify-content:space-between;display:flex">
        <span>Pracownicy</span>
        <span><a href="#" id="exp-all" style="color:var(--c-primary);font-weight:700">wszyscy</a> · <a href="#" id="exp-none" style="color:var(--c-primary);font-weight:700">żaden</a></span>
      </div>
      <div id="exp-emp-list" style="max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:2px"></div>
    </div>

    <button id="exp-generate" class="btn btn-accent" style="margin-top:14px">Generuj plik</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* global google */
wsMountFaq();

var S = {
  token:  null,
  year:   new Date().getFullYear(),
  month:  new Date().getMonth() + 1,
  data:   null,
  selId:  null,
  view:   'list'   // 'list' | 'cal'
};

var MONTHS = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec',
              'Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];

var _activeTimer = null;

var ICO = {
  note: '<svg class="ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  warn: '<svg class="ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  abs:  '<svg class="ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/></svg>'
};

// ── Utilities ─────────────────────────────────────────────────

var _tt;
function toast(msg, ok) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'on' + (ok ? ' g' : ' err');
  clearTimeout(_tt);
  _tt = setTimeout(function(){ el.className = ''; }, 2800);
}

function gas(action, args, cb) {
  google.script.run
    .withSuccessHandler(function(res) {
      wsSetConnStatus(true, 'Połączono.');
      try { cb(res); } catch(ex) {
        toast('Błąd: ' + ex.message, false);
        console.error(ex);
      }
    })
    .withFailureHandler(function(e) {
      var msg = (e && e.message) || 'Błąd połączenia';
      toast(msg, false);
      wsSetConnStatus(false, 'Błąd połączenia: ' + msg);
      wsShowError('Błąd połączenia: ' + msg);
    })
    .callRCP(action, JSON.stringify(args || []));
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Format minut jako H:MM (max 59 minut)
function fmtHM(mins) {
  var n = parseInt(mins, 10);
  if (isNaN(n)) return '—';
  var h = Math.floor(n / 60);
  var m = n % 60;
  return h + ':' + String(m).padStart(2, '0');
}

function absShort(a) {
  return a && a.code ? a.code : '';
}

// ── Login ─────────────────────────────────────────────────────

var lPin = '';
function setDots(p) {
  for (var i = 0; i < 4; i++)
    document.getElementById('ld' + i).className = 'dot' + (i < p.length ? ' on' : '');
}

document.getElementById('kp-login').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-v]');
  if (!btn) return;
  var v = btn.getAttribute('data-v');
  if (v === 'C') lPin = '';
  else if (v === 'X') lPin = lPin.slice(0, -1);
  else if (lPin.length < 4) lPin += v;
  setDots(lPin);
  if (lPin.length === 4) {
    toast('Logowanie…', true);
    gas('dashLogin', [lPin], function(res) {
      if (res && res.ok) {
        S.token = res.token;
        document.getElementById('login').style.display = 'none';
        document.getElementById('dash').style.display  = 'block';
        updateMonthLabel();
        loadMonth();
        pollActive();
        _activeTimer = setInterval(pollActive, 60000);
      } else {
        toast((res && res.msg) || 'Nieprawidłowy PIN.', false);
        lPin = ''; setDots('');
      }
    });
  }
});

// ── Kto jest w pracy / kto skończył — pasek + modal ───────────

function pollActive() {
  if (!S.token) return;
  gas('getActive', [S.token], function(res) {
    if (!res || !res.ok) return;
    renderPresenceBar(res.active, res.finished);
    renderModalList(res.active, res.finished);
  });
}

function renderPresenceBar(active, finished) {
  var bar   = document.getElementById('presence-bar');
  var track = document.getElementById('presence-track');
  bar.style.display = 'block';
  active   = active || [];
  finished = finished || [];

  if (active.length === 0 && finished.length === 0) {
    track.className = 'presence-track';
    track.style.paddingLeft = '16px';
    track.innerHTML = '<span class="presence-empty">Nikt dziś nie rozpoczął pracy</span>';
    return;
  }

  var itemsHtml = active.map(function(p) {
    return '<span class="presence-item"><span class="p-dot"></span>' +
      esc(p.imie + ' ' + p.nazwisko) + ' — od ' + esc(p.wejscie) + '</span>';
  }).join('') + finished.map(function(p) {
    return '<span class="presence-item done"><span class="p-dot done"></span>' +
      esc(p.imie + ' ' + p.nazwisko) + ' — zakończono ' +
      esc((p.wejscie || '?') + '–' + (p.wyjscie || '?')) + '</span>';
  }).join('');

  track.className = 'presence-track';
  track.style.paddingLeft = '16px';
  track.innerHTML = itemsHtml;

  var overflow = track.scrollWidth > bar.clientWidth;
  if (overflow) {
    track.style.paddingLeft = '100%';
    track.innerHTML = itemsHtml + itemsHtml;
    track.className = 'presence-track scrolling';
  }
}

function renderModalList(active, finished) {
  var el = document.getElementById('modal-list');
  active   = active || [];
  finished = finished || [];

  if (active.length === 0 && finished.length === 0) {
    el.innerHTML = '<div class="modal-empty">Nikt dziś nie rozpoczął pracy</div>';
    return;
  }

  var html = '';
  if (active.length > 0) {
    html += '<div class="modal-sec">W pracy</div>';
    html += active.map(function(p) {
      return '<div class="modal-row"><span class="modal-row-name"><span class="p-dot"></span>' +
        esc(p.imie + ' ' + p.nazwisko) + '</span>' +
        '<span style="color:var(--c-primary);font-weight:700;font-family:ui-monospace,monospace">od ' + esc(p.wejscie) + '</span></div>';
    }).join('');
  }
  if (finished.length > 0) {
    html += '<div class="modal-sec">Zakończyli dziś</div>';
    html += finished.map(function(p) {
      return '<div class="modal-row done"><span class="modal-row-name"><span class="p-dot done"></span>' +
        esc(p.imie + ' ' + p.nazwisko) + '</span>' +
        '<span style="color:var(--c-muted);font-weight:700;font-family:ui-monospace,monospace">' +
        esc((p.wejscie || '?') + '–' + (p.wyjscie || '?')) + '</span></div>';
    }).join('');
  }
  el.innerHTML = html;
}

document.getElementById('presence-bar').addEventListener('click', function() {
  document.getElementById('active-modal').style.display = 'flex';
});
document.getElementById('modal-close').addEventListener('click', function() {
  document.getElementById('active-modal').style.display = 'none';
});
document.getElementById('active-modal').addEventListener('click', function(e) {
  if (e.target === this) this.style.display = 'none';
});

// ── Miesiąc ───────────────────────────────────────────────────

function updateMonthLabel() {
  document.getElementById('month-lbl').textContent = MONTHS[S.month - 1] + ' ' + S.year;
}

document.getElementById('btn-prev').addEventListener('click', function() {
  S.month--; if (S.month < 1) { S.month = 12; S.year--; }
  updateMonthLabel(); loadMonth();
});
document.getElementById('btn-next').addEventListener('click', function() {
  S.month++; if (S.month > 12) { S.month = 1; S.year++; }
  updateMonthLabel(); loadMonth();
});

// ── Norma ─────────────────────────────────────────────────────

function saveEtat() {
  var val = parseFloat(document.getElementById('etat-inp').value);
  if (isNaN(val) || val < 0) return;
  gas('setEtat', [S.token, S.year, S.month, val], function(res) {
    if (res && res.ok) {
      if (S.data) S.data.etat = val;
      var tk = document.getElementById('norma-tick');
      tk.className = 'norma-tick on';
      setTimeout(function(){ tk.className = 'norma-tick'; }, 2000);
      if (S.selId) refreshEmpDisplay();
    } else if (res && res.errorType === 'UNAUTHORIZED') {
      doLogout();
    } else {
      toast('Błąd zapisu normy: ' + ((res && res.msg) || ''), false);
    }
  });
}

document.getElementById('etat-inp').addEventListener('blur', saveEtat);
document.getElementById('etat-inp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') this.blur();
});

// ── Selector pracownika ───────────────────────────────────────

var _emps = [];

function fillSelector(employees) {
  _emps = employees || [];
  renderOpts(_emps);
}

function renderOpts(list) {
  var dl = document.getElementById('emp-dropdown');
  if (list.length === 0) {
    dl.innerHTML = '<div class="emp-opt-none">Brak wyników</div>';
    return;
  }
  dl.innerHTML = '';
  list.forEach(function(emp) {
    var d = document.createElement('div');
    d.className = 'emp-opt';
    d.textContent = emp.imie + ' ' + emp.nazwisko;
    d.addEventListener('mousedown', function(e) {
      e.preventDefault();
      pickEmp(emp);
    });
    dl.appendChild(d);
  });
}

document.getElementById('emp-input').addEventListener('focus', function() {
  renderOpts(_emps);
  document.getElementById('emp-dropdown').style.display = 'block';
});
document.getElementById('emp-input').addEventListener('input', function() {
  var q = this.value.toLowerCase();
  renderOpts(_emps.filter(function(e) {
    return (e.imie + ' ' + e.nazwisko).toLowerCase().indexOf(q) !== -1;
  }));
  document.getElementById('emp-dropdown').style.display = 'block';
});
document.getElementById('emp-input').addEventListener('blur', function() {
  setTimeout(function(){ document.getElementById('emp-dropdown').style.display = 'none'; }, 160);
});

function pickEmp(emp) {
  S.selId = emp.id;
  document.getElementById('emp-input').value = emp.imie + ' ' + emp.nazwisko;
  document.getElementById('emp-dropdown').style.display = 'none';
  renderEmp(emp);
}

function getEmp(id) {
  if (!S.data || !S.data.employees) return null;
  for (var i = 0; i < S.data.employees.length; i++)
    if (S.data.employees[i].id === id) return S.data.employees[i];
  return null;
}

function refreshEmpDisplay() {
  if (!S.selId) return;
  var emp = getEmp(S.selId);
  if (emp) renderEmp(emp);
}

// ── Ładowanie danych ──────────────────────────────────────────

function loadMonth() {
  document.getElementById('emp-data').innerHTML = '<div class="hint">Ładowanie danych…</div>';
  gas('getDashboard', [S.token, S.year, S.month], function(res) {
    if (!res || !res.ok) {
      if (res && res.errorType === 'UNAUTHORIZED') { doLogout(); return; }
      document.getElementById('emp-data').innerHTML =
        '<div class="hint" style="color:var(--c-accent)">' + esc((res && res.msg) || 'Błąd ładowania.') +
        '<br><button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="loadMonth()">Ponów</button></div>';
      return;
    }
    S.data = res;
    document.getElementById('etat-inp').value = res.etat > 0 ? res.etat : '';
    fillSelector(res.employees);
    if (S.selId) {
      var emp = getEmp(S.selId);
      if (emp) { renderEmp(emp); return; }
    }
    document.getElementById('emp-data').innerHTML = '';
  });
}

// ── Wyświetlanie pracownika ───────────────────────────────────

function renderEmp(emp) {
  var etat      = (S.data && S.data.etat > 0) ? S.data.etat : 0;
  var etatMins  = etat > 0 ? Math.round(etat * 60) : 0;
  var totalMins = parseInt(emp.totalMinutes, 10) || 0;

  var hoursHtml, hoursCls, isBad;
  if (etat > 0) {
    hoursHtml = fmtHM(totalMins) + ' z ' + fmtHM(etatMins);
    isBad     = totalMins < etatMins;
    hoursCls  = isBad ? 'hours-bad' : 'hours-ok';
  } else {
    hoursHtml = fmtHM(totalMins);
    hoursCls  = 'hours-neutral';
    isBad     = false;
  }

  var note = esc(emp.note || '');

  var html = '<div class="card emp-card">';
  html += '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">';
  html += '<div><div class="emp-name">' + esc(emp.imie + ' ' + emp.nazwisko) + '</div>';
  html += '<div class="emp-role">' + esc(emp.rola || '') + '</div></div>';
  html += '<div style="text-align:right"><div class="hours-lbl">Przepracowane</div>';
  html += '<div class="hours-val ' + hoursCls + '">' + hoursHtml + '</div></div>';
  html += '</div>';
  if ((emp.absDays > 0) || (emp.ovrDays > 0)) {
    html += '<div class="emp-flags">';
    if (emp.absDays > 0) html += '<span class="chip chip-primary">' + ICO.abs + ' Nieobecności: ' + emp.absDays + '</span>';
    if (emp.paidAbsDays > 0) html += '<span class="chip chip-success">' + ICO.abs + ' Płatny urlop (8h/dzień): ' + emp.paidAbsDays + '</span>';
    if (emp.ovrMinutes > 0) html += '<span class="chip chip-accent" id="ovr-chip" style="cursor:pointer">' + ICO.warn + ' Poza godz. Kliniki: ' + fmtHM(emp.ovrMinutes) + '</span>';
    html += '</div>';
  }
  html += '</div>';

  // Adnotacja
  html += '<div class="field" style="margin-top:14px">';
  html += '<div class="note-lbl">Adnotacja' + (isBad ? ' — niedobór godzin' : '') + '</div>';
  html += '<textarea id="note-ta" class="ta' + (isBad ? ' warn' : '') + '"';
  html += ' placeholder="Wpisz adnotację…">' + note + '</textarea>';
  html += '<div class="note-save-row"><span id="note-tick" class="note-tick">' +
          '<svg class="ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Zapisano</span></div>';
  html += '</div>';

  // View toggle
  html += '<div class="seg" style="margin-top:14px">';
  html += '<button class="seg-btn' + (S.view === 'list' ? ' on' : '') + '" onclick="switchView(\'list\')">Lista</button>';
  html += '<button class="seg-btn' + (S.view === 'cal'  ? ' on' : '') + '" onclick="switchView(\'cal\')">Kalendarz</button>';
  html += '</div>';

  // Data view
  html += '<div id="data-view" style="margin-top:14px">';
  html += S.view === 'cal' ? renderCalendar(emp) : renderList(emp);
  html += '</div>';

  document.getElementById('emp-data').innerHTML = html;

  // Bind note textarea
  var ta = document.getElementById('note-ta');
  if (ta) {
    ta.addEventListener('blur', function() { saveNote(emp.id, ta.value); });
    ta.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) ta.blur();
    });
  }

  var ovrChip = document.getElementById('ovr-chip');
  if (ovrChip) ovrChip.addEventListener('click', function() { openOvrModal(emp); });
}

// ── Modal — dni poza godzinami Kliniki (klik w chip sumy) ──────
function openOvrModal(emp) {
  var days = (emp.days || []).filter(function(d) { return d.overtime; });
  var el = document.getElementById('ovr-modal-list');
  if (days.length === 0) {
    el.innerHTML = '<div class="modal-empty">Brak dni poza godzinami Kliniki</div>';
  } else {
    el.innerHTML = days.map(function(d) {
      var czas = (d.wejscie || '?') + '–' + (d.wyjscie || '?');
      return '<div class="modal-row" style="align-items:flex-start;flex-direction:column;gap:4px">' +
        '<div style="display:flex;justify-content:space-between;width:100%">' +
        '<span class="modal-row-name">' + esc(d.date) + ' (' + esc(d.dow) + ')</span>' +
        '<span style="color:var(--c-accent);font-weight:700;font-family:ui-monospace,monospace">' + esc(czas) + '</span></div>' +
        '<div style="font-size:13px;color:var(--c-muted)">' +
        (d.overtimeNote ? 'Uzasadnienie: ' + esc(d.overtimeNote) : 'Brak uzasadnienia') + '</div>' +
        '</div>';
    }).join('');
  }
  document.getElementById('ovr-modal').style.display = 'flex';
}
document.getElementById('ovr-modal-close').addEventListener('click', function() {
  document.getElementById('ovr-modal').style.display = 'none';
});
document.getElementById('ovr-modal').addEventListener('click', function(e) {
  if (e.target === this) this.style.display = 'none';
});

function switchView(v) {
  S.view = v;
  var emp = getEmp(S.selId);
  if (!emp) return;
  document.getElementById('data-view').innerHTML =
    v === 'cal' ? renderCalendar(emp) : renderList(emp);
  document.querySelectorAll('.seg-btn').forEach(function(b) {
    b.className = 'seg-btn' + (b.textContent.trim() === (v === 'cal' ? 'Kalendarz' : 'Lista') ? ' on' : '');
  });
}

// ── Lista ─────────────────────────────────────────────────────

function renderList(emp) {
  var days = Array.isArray(emp.days) ? emp.days : [];
  var html = '<div class="table-wrap"><table>';
  html += '<thead><tr><th>Dzień</th><th>Data</th><th>Wejście</th><th>Wyjście</th><th>Godziny</th></tr></thead><tbody>';
  days.forEach(function(d) {
    if (!d) return;
    var dn   = String(d.date || '').split('-')[2] || '';
    var mm   = String(S.month).padStart(2, '0');
    var wknd = d.dow === 'Sb' || d.dow === 'Nd';
    var hasH = d.mins !== null && d.mins !== undefined;

    html += '<tr' + (wknd ? ' class="wknd"' : '') + ' data-date="' + esc(d.date) + '">';
    html += '<td><strong>' + esc(d.dow || '') + '</strong>' +
            (d.overtime ? '<span class="ovr-ico">' + ICO.warn + '</span>' : '') + '</td>';
    html += '<td>' + dn + '.' + mm + '</td>';

    if (d.absence) {
      var absPaid = d.mins !== null && d.mins !== undefined;
      html += '<td colspan="2"><span class="chip chip-primary">' + esc(d.absence.typ) + '</span></td>';
      html += '<td class="' + (absPaid ? 't-hours' : 't-empty') + '">' + (absPaid ? fmtHM(d.mins) : '—') + '</td>';
    } else {
      html += '<td class="' + (d.wejscie ? 't-time' : 't-empty') + '">' + esc(d.wejscie || '—') + '</td>';
      html += '<td class="' + (d.wyjscie ? 't-time' : (d.wejscie ? 't-miss' : 't-empty')) + '">';
      html += d.wyjscie ? esc(d.wyjscie) : (d.wejscie ? 'brak !' : '—');
      html += '</td>';
      html += '<td class="' + (hasH ? 't-hours' : 't-empty') + '">' + (hasH ? fmtHM(d.mins) : '—') + '</td>';
    }
    html += '</tr>';

    if (d.absence && d.absence.note) {
      html += '<tr class="note-tr" data-date="' + esc(d.date) + '"><td colspan="5"><span class="nt-row nt-abs">' + ICO.note + ' ' + esc(d.absence.note) + '</span></td></tr>';
    }
    if (d.overtime) {
      html += '<tr class="note-tr" data-date="' + esc(d.date) + '"><td colspan="5"><span class="nt-row nt-ovr">' + ICO.warn + ' Poza godzinami Kliniki — ' +
        (d.overtimeNote ? 'uzasadnienie: ' + esc(d.overtimeNote) : 'brak uzasadnienia') +
        '</span></td></tr>';
    }
  });
  html += '</tbody></table></div>';
  return html;
}

// ── Kalendarz ─────────────────────────────────────────────────

function renderCalendar(emp) {
  var days = Array.isArray(emp.days) ? emp.days : [];
  if (days.length === 0) return '<div class="hint">Brak danych</div>';

  var firstJs  = new Date(days[0].date + 'T12:00:00').getDay(); // 0=Nd
  var firstCol = firstJs === 0 ? 6 : firstJs - 1;

  var html = '<div class="cal-grid">';
  ['Pn','Wt','Śr','Cz','Pt','Sb','Nd'].forEach(function(h) {
    html += '<div class="cal-head">' + h + '</div>';
  });
  for (var i = 0; i < firstCol; i++) {
    html += '<div class="cal-cell cal-empty"></div>';
  }
  days.forEach(function(d) {
    if (!d) return;
    var dn   = parseInt(String(d.date || '').split('-')[2]) || 0;
    var wknd = d.dow === 'Sb' || d.dow === 'Nd';
    var hasH = d.mins !== null && d.mins !== undefined;
    html += '<div class="cal-cell' + (wknd ? ' cal-wknd' : '') + '" data-date="' + esc(d.date) + '">';
    if (d.overtime) html += '<span class="cal-ovr" title="Poza godzinami Kliniki' + (d.overtimeNote ? ': ' + esc(d.overtimeNote) : ' (brak uzasadnienia)') + '">' + ICO.warn + '</span>';
    html += '<div class="cal-dn">' + dn + '</div>';
    if (d.absence) {
      html += '<span class="cal-abs" title="' + esc(d.absence.typ) + '">' + esc(absShort(d.absence)) + '</span>';
      if (hasH) html += '<div class="cal-h">' + fmtHM(d.mins) + '</div>';
    } else if (d.wejscie) {
      html += '<div class="cal-in">' + esc(d.wejscie) + '</div>';
      if (d.wyjscie) {
        html += '<div class="cal-out">' + esc(d.wyjscie) + '</div>';
        if (hasH) html += '<div class="cal-h">' + fmtHM(d.mins) + '</div>';
      } else {
        html += '<div class="cal-miss">!</div>';
      }
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// ── Szczegóły dnia (tap w wiersz listy / komórkę kalendarza) ──

document.getElementById('emp-data').addEventListener('click', function(e) {
  var el = e.target.closest('[data-date]');
  if (!el) return;
  showDayDetails(el.getAttribute('data-date'));
});

function showDayDetails(date) {
  var emp = getEmp(S.selId);
  if (!emp || !date) return;
  var d = null;
  (emp.days || []).forEach(function(x) { if (x && x.date === date) d = x; });
  if (!d) return;

  var dn = date.split('-')[2] + '.' + date.split('-')[1] + '.' + date.split('-')[0];
  document.getElementById('day-modal-title').textContent = d.dow + ', ' + dn;

  var row = function(lbl, val) {
    return '<div style="display:flex;justify-content:space-between;gap:10px;background:var(--c-offwhite);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:8px">' +
      '<span class="muted">' + lbl + '</span><span style="font-weight:700;font-family:ui-monospace,monospace">' + val + '</span></div>';
  };

  var html = '';
  html += row('Wejście', esc(d.wejscie || '—'));
  html += row('Wyjście', esc(d.wyjscie || '—'));
  html += row('Godziny', (d.mins !== null && d.mins !== undefined) ? fmtHM(d.mins) : '—');

  if (d.absence) {
    html += '<div class="section" style="border-left:3px solid var(--c-primary)"><div class="section-title" style="margin-bottom:4px">Nieobecność</div>' + esc(d.absence.typ) +
      (d.absence.note ? '<div class="muted" style="margin-top:6px">' + ICO.note + ' ' + esc(d.absence.note) + '</div>' : '') + '</div>';
  }
  if (d.overtime) {
    html += '<div class="section" style="border-left:3px solid var(--c-accent)"><div class="section-title" style="margin-bottom:4px;color:var(--c-accent)">Przekroczono regularne godziny pracy Kliniki</div>' +
      (d.overtimeNote ? 'Uzasadnienie: ' + esc(d.overtimeNote)
                      : '<span style="color:var(--c-accent)">Brak uzasadnienia</span>') + '</div>';
  }
  if (!d.absence && !d.overtime && !d.wejscie && !d.wyjscie) {
    html += '<div class="modal-empty">Brak zdarzeń tego dnia</div>';
  }

  document.getElementById('day-modal-body').innerHTML = html;
  document.getElementById('day-modal').style.display = 'flex';
}

document.getElementById('day-modal-close').addEventListener('click', function() {
  document.getElementById('day-modal').style.display = 'none';
});
document.getElementById('day-modal').addEventListener('click', function(e) {
  if (e.target === this) this.style.display = 'none';
});

// ── Adnotacja ─────────────────────────────────────────────────

function saveNote(empId, text) {
  gas('setNote', [S.token, empId, S.year, S.month, text], function(res) {
    if (res && res.ok) {
      var emp = getEmp(empId);
      if (emp) emp.note = text;
      var tk = document.getElementById('note-tick');
      if (tk) { tk.className = 'note-tick on'; setTimeout(function(){ tk.className = 'note-tick'; }, 2000); }
    } else if (res && res.errorType === 'UNAUTHORIZED') {
      doLogout();
    }
  });
}

// ── Excel — okno wyboru zakresu i pracowników ──────────────────

document.getElementById('btn-csv').addEventListener('click', openExportModal);

function openExportModal() {
  if (!S.token) return;
  document.getElementById('export-modal').style.display = 'flex';
  document.getElementById('exp-emp-list').innerHTML = '<div class="modal-empty">Ładowanie…</div>';

  document.querySelector('input[name="exp-mode"][value="month"]').checked = true;
  document.getElementById('exp-mode-month').style.display = 'block';
  document.getElementById('exp-mode-range').style.display = 'none';

  gas('getExportMeta', [S.token], function(res) {
    if (!res || !res.ok) {
      if (res && res.errorType === 'UNAUTHORIZED') { doLogout(); return; }
      toast('Błąd wczytywania danych eksportu.', false);
      document.getElementById('export-modal').style.display = 'none';
      return;
    }

    var now = new Date();
    var curMonthVal = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    var earliestVal = String(res.earliest).slice(0, 7);

    var monthInp = document.getElementById('exp-month');
    monthInp.value = curMonthVal;
    monthInp.max = curMonthVal;

    var fromInp = document.getElementById('exp-from');
    var toInp   = document.getElementById('exp-to');
    fromInp.value = earliestVal;
    fromInp.min   = earliestVal;
    fromInp.max   = curMonthVal;
    toInp.value   = curMonthVal;
    toInp.min     = earliestVal;
    toInp.max     = curMonthVal;

    var list = document.getElementById('exp-emp-list');
    if (!res.employees || res.employees.length === 0) {
      list.innerHTML = '<div class="modal-empty">Brak aktywnych pracowników</div>';
      return;
    }
    list.innerHTML = res.employees.map(function(e) {
      return '<label style="display:flex;align-items:center;gap:10px;padding:9px 4px;font-size:14px;cursor:pointer">' +
        '<input type="checkbox" class="exp-emp-cb" value="' + esc(e.id) + '" checked style="accent-color:var(--c-primary);width:19px;height:19px"> ' +
        esc(e.imie + ' ' + e.nazwisko) + '</label>';
    }).join('');
  });
}

document.getElementById('export-close').addEventListener('click', function() {
  document.getElementById('export-modal').style.display = 'none';
});
document.getElementById('export-modal').addEventListener('click', function(e) {
  if (e.target === this) this.style.display = 'none';
});

document.querySelectorAll('input[name="exp-mode"]').forEach(function(r) {
  r.addEventListener('change', function() {
    var isRange = document.querySelector('input[name="exp-mode"]:checked').value === 'range';
    document.getElementById('exp-mode-month').style.display = isRange ? 'none' : 'block';
    document.getElementById('exp-mode-range').style.display = isRange ? 'block' : 'none';
  });
});

document.getElementById('exp-all').addEventListener('click', function(e) {
  e.preventDefault();
  document.querySelectorAll('.exp-emp-cb').forEach(function(cb){ cb.checked = true; });
});
document.getElementById('exp-none').addEventListener('click', function(e) {
  e.preventDefault();
  document.querySelectorAll('.exp-emp-cb').forEach(function(cb){ cb.checked = false; });
});

document.getElementById('exp-generate').addEventListener('click', function() {
  var mode = document.querySelector('input[name="exp-mode"]:checked').value;
  var employeeIds = Array.prototype.map.call(
    document.querySelectorAll('.exp-emp-cb:checked'), function(cb){ return cb.value; }
  );
  if (employeeIds.length === 0) { toast('Wybierz przynajmniej jednego pracownika.', false); return; }

  var opts = { employeeIds: employeeIds };

  if (mode === 'range') {
    var from = document.getElementById('exp-from').value;
    var to   = document.getElementById('exp-to').value;
    if (!from || !to) { toast('Wybierz zakres dat.', false); return; }
    if (from > to) { toast('Data "od" nie może być późniejsza niż "do".', false); return; }
    opts.mode = 'range';
    opts.from = from + '-01';
    var toYear  = parseInt(to.slice(0, 4), 10);
    var toMonth = parseInt(to.slice(5, 7), 10);
    var toDim   = new Date(toYear, toMonth, 0).getDate();
    opts.to = to + '-' + String(toDim).padStart(2, '0');
  } else {
    var mv = document.getElementById('exp-month').value;
    if (!mv) { toast('Wybierz miesiąc.', false); return; }
    opts.mode  = 'month';
    opts.year  = parseInt(mv.slice(0, 4), 10);
    opts.month = parseInt(mv.slice(5, 7), 10);
  }

  document.getElementById('export-modal').style.display = 'none';
  toast('Generowanie pliku Excel…', true);
  gas('dashExportXlsx', [S.token, opts], function(res) {
    if (!res || !res.ok) { toast('Błąd eksportu: ' + ((res && res.msg) || ''), false); return; }
    var byteChars = atob(res.base64);
    var byteNumbers = new Array(byteChars.length);
    for (var i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    var byteArray = new Uint8Array(byteNumbers);
    var blob = new Blob([byteArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = res.filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    wsConfirmPopup('Plik pobrany!');
  });
});

// ── Logout ────────────────────────────────────────────────────

function doLogout() {
  S.token = null; S.data = null; S.selId = null;
  lPin = ''; setDots('');
  if (_activeTimer) { clearInterval(_activeTimer); _activeTimer = null; }
  document.getElementById('emp-input').value = '';
  document.getElementById('etat-inp').value  = '';
  document.getElementById('emp-data').innerHTML = '';
  document.getElementById('presence-bar').style.display = 'none';
  document.getElementById('active-modal').style.display = 'none';
  document.getElementById('day-modal').style.display = 'none';
  document.getElementById('ovr-modal').style.display = 'none';
  document.getElementById('export-modal').style.display = 'none';
  document.getElementById('dash').style.display  = 'none';
  document.getElementById('login').style.display = 'flex';
}

document.getElementById('btn-logout').addEventListener('click', doLogout);
document.getElementById('m-theme').addEventListener('click', function() { wsToggleTheme(); });
</script>
