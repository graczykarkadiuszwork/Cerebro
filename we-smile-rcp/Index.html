<div id="toast"></div>

<script>
/* global google */
var PAGE = "<?= PAGE ?>";

// ── Toast ─────────────────────────────────────────────────────
var _tt;
function toast(msg, isOk) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'on' + (isOk ? ' g' : ' err');
  clearTimeout(_tt);
  _tt = setTimeout(function () { el.className = ''; }, 3200);
}

// ── GAS call ──────────────────────────────────────────────────
function gas(action, args, cb) {
  google.script.run
    .withSuccessHandler(cb)
    .withFailureHandler(function (e) { toast(e.message || 'Błąd połączenia.', false); })
    .callRCP(action, JSON.stringify(args || []));
}

// ── Żywy zegar (tylko widok pracownika) ───────────────────────
(function () {
  var t = document.getElementById('live-time');
  if (!t) return;
  var d = document.getElementById('live-date');
  function tick() {
    var now = new Date();
    t.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    d.textContent = now.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  tick();
  setInterval(tick, 1000);
})();

// ════════════════════════════════════════════════════════════
if (PAGE === 'admin') {
// ════════════════════════════════════════════════════════════

  var WIN = 30;          // sekundy okna
  var GREEN_UNTIL = 20;  // 0–20 s od zmiany kodu → zielony
  var CIRC = 2 * Math.PI * 45; // obwód pierścienia (r=45)
  var left = 0;
  var loading = false;
  var retryIn = 0;

  var elToken   = document.getElementById('token');
  var elRing    = document.getElementById('ring');
  var elRingWrap= document.querySelector('.ring-wrap');
  var elStatus  = document.getElementById('tok-status');
  var elRefresh = document.getElementById('btn-refresh');

  function refreshToken(forceNext) {
    if (loading) return;
    loading = true;
    gas('getToken', [!!forceNext], function (res) {
      loading = false;
      if (!res || !res.ok) return;
      elToken.textContent = res.token;
      WIN  = res.winSec || 30;
      left = Math.max(1, Math.min(WIN, parseInt(res.secLeft, 10) || WIN));
      render();
    });
  }

  function render() {
    var elapsed = WIN - left;
    var green = elapsed <= GREEN_UNTIL;

    var offset = CIRC * (1 - left / WIN);
    elRing.style.strokeDashoffset = offset;
    elRing.className = 'ring-fill' + (green ? '' : ' red');
    elRingWrap.classList.toggle('red', !green);

    if (green) {
      elStatus.className = 'tok-status green';
      elStatus.textContent = 'Przepisz kod — ważny jeszcze ' + left + ' s';
      elRefresh.className = 'btn btn-accent btn-refresh';
    } else {
      elStatus.className = 'tok-status red';
      elStatus.textContent = 'Kod wkrótce ulegnie przedawnieniu (' + left + ' s)';
      elRefresh.className = 'btn btn-accent btn-refresh show';
    }
  }

  elRefresh.addEventListener('click', function () { refreshToken(true); });

  setInterval(function () {
    if (left > 0) {
      left--;
      render();
      if (left === 0) refreshToken(false);
    } else if (!loading) {
      retryIn--;
      if (retryIn <= 0) { retryIn = 5; refreshToken(false); }
    }
  }, 1000);

  refreshToken(false);

// ════════════════════════════════════════════════════════════
} else {
// ════════════════════════════════════════════════════════════

  var pin = '', code = '', empPin = '', empName = '';
  var absTypes = null;
  var resetTimer = null;

  var ICON_OK  = '<svg class="ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5"/></svg>';
  var ICON_ABS = '<svg class="ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/><path d="M9.5 14.5l5 5M14.5 14.5l-5 5"/></svg>';

  function show(id) {
    ['s-pin', 's-code', 's-abs', 's-ovr', 's-month', 's-ok'].forEach(function (s) {
      document.getElementById(s).className = 'step' + (s === id ? ' on' : '');
    });
  }

  function resetAll() {
    pin = ''; code = ''; empPin = ''; empName = '';
    absTypes = null; // lista zależy od formy zatrudnienia — nie może przetrwać zmiany pracownika
    setDots(pin, 'p');
    setDots(code, 'c');
    show('s-pin');
  }

  function finishOk(icon, accent, title, msg, delayMs) {
    var wrap = document.getElementById('ok-icon-wrap');
    wrap.className = 'ok-icon-wrap' + (accent ? ' accent' : '');
    wrap.innerHTML = icon;
    document.getElementById('ok-title').textContent = title;
    document.getElementById('ok-msg').textContent   = msg;
    show('s-ok');
    clearTimeout(resetTimer);
    resetTimer = setTimeout(resetAll, delayMs || 3000);
  }

  function setDots(val, pfx) {
    for (var i = 0; i < 4; i++) {
      var d = document.getElementById(pfx + i);
      if (d) d.className = 'dot' + (i < val.length ? ' on' : '');
    }
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }

  // ── Klawiatura PIN ────────────────────────────────────────
  document.getElementById('kp-pin').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-v]');
    if (!btn) return;
    var v = btn.getAttribute('data-v');
    if (v === 'C')      { pin = ''; }
    else if (v === 'X') { pin = pin.slice(0, -1); }
    else if (pin.length < 4) { pin += v; }
    setDots(pin, 'p');

    if (pin.length === 4) {
      toast('Weryfikacja…', true);
      gas('checkPin', [pin], function (res) {
        if (res && res.ok) {
          empPin  = pin;
          empName = res.imie + ' ' + res.nazwisko;
          document.getElementById('w-name').textContent = empName;
          document.getElementById('w-role').textContent = res.rola;
          code = '';
          setDots(code, 'c');
          var banner = document.getElementById('pending-banner');
          if (res.pendingJustifications > 0) {
            document.getElementById('pending-count').textContent =
              res.pendingJustifications + (res.pendingJustifications === 1 ? ' dzień ' : ' dni ');
            banner.style.display = 'block';
          } else {
            banner.style.display = 'none';
          }
          show('s-code');
        } else {
          toast((res && res.msg) || 'Nieprawidłowy PIN.', false);
          pin = '';
          setDots(pin, 'p');
        }
      });
    }
  });

  // ── Klawiatura kodu ───────────────────────────────────────
  document.getElementById('kp-code').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-c]');
    if (!btn) return;
    var v = btn.getAttribute('data-c');
    if (v === 'C')      { code = ''; }
    else if (v === 'X') { code = code.slice(0, -1); }
    else if (code.length < 4) { code += v; }
    setDots(code, 'c');
  });

  // ── Rejestracja zdarzenia ─────────────────────────────────
  function submit(action) {
    if (code.length !== 4) {
      toast('Wpisz 4-cyfrowy kod z tabletu admina.', false);
      return;
    }
    toast('Rejestrowanie…', true);
    var rpc = (action === 'WEJSCIE') ? 'clockIn' : 'clockOut';
    gas(rpc, [empPin, code], function (res) {
      if (res && res.ok) {
        var label = (action === 'WEJSCIE') ? 'Wejście' : 'Wyjście';
        var msg = res.imie + ' — ' + label + ' o ' + res.godzina;
        if (res.overtime) {
          document.getElementById('ovr-sub').textContent = msg;
          document.getElementById('ovr-note').value = '';
          show('s-ovr');
        } else {
          finishOk(ICON_OK, false, 'Zarejestrowano', msg, 3000);
        }
      } else {
        toast((res && res.msg) || 'Błąd rejestracji.', false);
        code = '';
        setDots(code, 'c');
      }
    });
  }

  document.getElementById('btn-in').addEventListener('click',   function () { submit('WEJSCIE'); });
  document.getElementById('btn-out').addEventListener('click',  function () { submit('WYJSCIE'); });
  document.getElementById('btn-back').addEventListener('click', resetAll);

  // ── Uzasadnienie przekroczenia godzin ─────────────────────
  document.getElementById('ovr-save').addEventListener('click', function () {
    var note = document.getElementById('ovr-note').value.trim();
    if (!note) { toast('Wpisz uzasadnienie.', false); return; }
    toast('Zapisywanie…', true);
    gas('setOvertimeNote', [empPin, note], function (res) {
      if (res && res.ok) {
        finishOk(ICON_OK, false, 'Zarejestrowano', 'Uzasadnienie zapisane. Dziękujemy.', 3000);
      } else {
        toast((res && res.msg) || 'Błąd zapisu.', false);
      }
    });
  });

  document.getElementById('ovr-skip').addEventListener('click', function () {
    finishOk(ICON_OK, false, 'Zarejestrowano', 'Pamiętaj o uzupełnieniu uzasadnienia u administratora.', 3500);
  });

  // ── Nieobecność ───────────────────────────────────────────
  function fillAbsTypes() {
    var sel = document.getElementById('abs-typ');
    sel.innerHTML = '<option value="">— wybierz typ —</option>';
    (absTypes || []).forEach(function (t) {
      if (t.code === 'DW') return; // zastrzeżone dla właściciela (dzień wolny kliniki)
      var o = document.createElement('option');
      o.value = t.code;
      o.textContent = t.label;
      sel.appendChild(o);
    });
  }

  document.getElementById('btn-abs').addEventListener('click', function () {
    document.getElementById('abs-who').textContent = empName;
    document.getElementById('abs-from').value = todayStr();
    document.getElementById('abs-to').value   = todayStr();
    document.getElementById('abs-note').value = '';
    if (absTypes) {
      fillAbsTypes();
      show('s-abs');
    } else {
      toast('Ładowanie…', true);
      gas('getAbsenceTypes', [empPin], function (res) {
        if (res && res.ok) {
          absTypes = res.types || [];
          fillAbsTypes();
          show('s-abs');
        } else {
          toast('Błąd ładowania typów nieobecności.', false);
        }
      });
    }
  });

  document.getElementById('abs-back').addEventListener('click', function () {
    show('s-code');
  });

  document.getElementById('abs-submit').addEventListener('click', function () {
    var from = document.getElementById('abs-from').value;
    var to   = document.getElementById('abs-to').value;
    var typ  = document.getElementById('abs-typ').value;
    var note = document.getElementById('abs-note').value.trim();

    if (!from || !to)  { toast('Wybierz zakres dat.', false); return; }
    if (from > to)     { toast('Data „od” nie może być późniejsza niż „do”.', false); return; }
    if (!typ)          { toast('Wybierz typ nieobecności.', false); return; }
    if (typ === 'INNE' && !note) { toast('Dla typu „Inne” adnotacja jest wymagana.', false); return; }

    toast('Zgłaszanie…', true);
    gas('reportAbsence', [empPin, from, to, typ, note], function (res) {
      if (res && res.ok) {
        var dni = res.dni === 1 ? '1 dzień' : res.dni + ' dni';
        finishOk(ICON_ABS, true, 'Zgłoszono nieobecność', res.typ + ' — ' + dni, 3500);
      } else {
        toast((res && res.msg) || 'Błąd zgłoszenia.', false);
      }
    });
  });

  // ── "Mój miesiąc" — niedytowalne godziny, edytowalne adnotacje ─────
  var MYM = { year: new Date().getFullYear(), month: new Date().getMonth() + 1, days: [] };
  var MYM_MONTHS = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec',
                     'Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];

  function fmtHM(mins) {
    var n = parseInt(mins, 10);
    if (isNaN(n)) return '—';
    return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
  }

  document.getElementById('btn-month').addEventListener('click', function () {
    show('s-month');
    loadMyMonth();
  });
  document.getElementById('mym-back').addEventListener('click', function () { show('s-code'); });
  document.getElementById('mym-prev').addEventListener('click', function () {
    MYM.month--; if (MYM.month < 1) { MYM.month = 12; MYM.year--; }
    loadMyMonth();
  });
  document.getElementById('mym-next').addEventListener('click', function () {
    MYM.month++; if (MYM.month > 12) { MYM.month = 1; MYM.year++; }
    loadMyMonth();
  });

  function loadMyMonth() {
    document.getElementById('mym-label').textContent = MYM_MONTHS[MYM.month - 1] + ' ' + MYM.year;
    document.getElementById('mym-cal').innerHTML = '<div class="hint">Ładowanie…</div>';
    gas('getMyMonth', [empPin, MYM.year, MYM.month], function (res) {
      if (!res || !res.ok) {
        document.getElementById('mym-cal').innerHTML = '<div class="hint">' + ((res && res.msg) || 'Błąd ładowania.') + '</div>';
        return;
      }
      MYM.days = res.days || [];
      document.getElementById('mym-hours').textContent = fmtHM(res.totalMinutes);
      document.getElementById('mym-abs').textContent = res.absDays || 0;
      renderMyCalendar();
    });
  }

  function renderMyCalendar() {
    var days = MYM.days;
    if (days.length === 0) { document.getElementById('mym-cal').innerHTML = '<div class="hint">Brak danych</div>'; return; }
    var firstJs = new Date(days[0].date + 'T12:00:00').getDay();
    var firstCol = firstJs === 0 ? 6 : firstJs - 1;
    var html = '<div class="cal-grid stagger">';
    ['Pn','Wt','Śr','Cz','Pt','Sb','Nd'].forEach(function (h) { html += '<div class="cal-head">' + h + '</div>'; });
    for (var i = 0; i < firstCol; i++) html += '<div class="cal-cell cal-empty"></div>';
    days.forEach(function (d) {
      var dn = parseInt(d.date.split('-')[2]);
      var wknd = d.dow === 'Sb' || d.dow === 'Nd';
      var pending = d.overtime && !d.overtimeNote;
      html += '<div class="cal-cell' + (wknd ? ' cal-wknd' : '') + '" data-date="' + d.date + '">';
      if (d.overtime) html += '<span class="cal-ovr" style="color:' + (pending ? 'var(--c-accent)' : 'var(--c-primary)') + '">' +
        '<svg class="ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>';
      html += '<div class="cal-dn">' + dn + '</div>';
      if (d.absence) html += '<span class="cal-abs">' + d.absence.code + '</span>';
      else if (d.wejscie) {
        html += '<div class="cal-in">' + d.wejscie + '</div>';
        if (d.wyjscie) html += '<div class="cal-out">' + d.wyjscie + '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    document.getElementById('mym-cal').innerHTML = html;
    document.querySelectorAll('#mym-cal [data-date]').forEach(function (el) {
      el.addEventListener('click', function () { openMyDayModal(el.getAttribute('data-date')); });
    });
  }

  function openMyDayModal(date) {
    var d = null;
    MYM.days.forEach(function (x) { if (x.date === date) d = x; });
    if (!d) return;
    var dn = date.split('-')[2] + '.' + date.split('-')[1] + '.' + date.split('-')[0];
    document.getElementById('mym-modal-title').textContent = d.dow + ', ' + dn;

    var html = '';
    html += '<div style="display:flex;justify-content:space-between;gap:10px;background:var(--c-field);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:8px">' +
      '<span class="muted">Wejście / Wyjście</span><span style="font-weight:700;font-family:ui-monospace,monospace">' +
      (d.wejscie || '—') + ' – ' + (d.wyjscie || '—') + '</span></div>';

    if (!d.editable) {
      html += '<div class="hint" style="padding:16px 0">Ten dzień jest już poza oknem edycji (bieżący i poprzedni miesiąc).</div>';
    } else {
      if (d.absence) {
        html += '<div class="field"><span class="field-lbl">Adnotacja nieobecności (' + esc_h(d.absence.typ) + ')</span>' +
          '<textarea id="mym-abs-note" class="ta">' + esc_h(d.absence.note || '') + '</textarea></div>' +
          '<button class="btn btn-primary btn-sm" style="width:100%" id="mym-save-abs">Zapisz adnotację nieobecności</button>';
      }
      if (d.overtime) {
        html += '<div class="field" style="margin-top:14px"><span class="field-lbl">Uzasadnienie pracy poza godzinami Kliniki</span>' +
          '<textarea id="mym-ovr-note" class="ta">' + esc_h(d.overtimeNote || '') + '</textarea></div>' +
          '<button class="btn btn-accent btn-sm" style="width:100%;margin-top:8px" id="mym-save-ovr">Zapisz uzasadnienie</button>';
      }
      if (!d.absence && !d.overtime) {
        html += '<div class="hint" style="padding:16px 0">Brak zdarzeń wymagających adnotacji tego dnia.</div>';
      }
    }

    document.getElementById('mym-modal-body').innerHTML = html;
    document.getElementById('mym-modal').style.display = 'flex';

    var absBtn = document.getElementById('mym-save-abs');
    if (absBtn) absBtn.addEventListener('click', function () {
      gas('setMyAbsenceNote', [empPin, date, document.getElementById('mym-abs-note').value], function (res) {
        if (res && res.ok) { toast('Zapisano.', true); document.getElementById('mym-modal').style.display = 'none'; loadMyMonth(); }
        else toast((res && res.msg) || 'Błąd zapisu.', false);
      });
    });
    var ovrBtn = document.getElementById('mym-save-ovr');
    if (ovrBtn) ovrBtn.addEventListener('click', function () {
      gas('setMyOvertimeNote', [empPin, date, document.getElementById('mym-ovr-note').value], function (res) {
        if (res && res.ok) { toast('Zapisano.', true); document.getElementById('mym-modal').style.display = 'none'; loadMyMonth(); }
        else toast((res && res.msg) || 'Błąd zapisu.', false);
      });
    });
  }

  function esc_h(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('mym-modal-close').addEventListener('click', function () {
    document.getElementById('mym-modal').style.display = 'none';
  });
  document.getElementById('mym-modal').addEventListener('click', function (e) {
    if (e.target === this) this.style.display = 'none';
  });

  document.getElementById('pending-banner').addEventListener('click', function () {
    document.getElementById('btn-month').click();
  });
}
</script>
</body>
</html>
