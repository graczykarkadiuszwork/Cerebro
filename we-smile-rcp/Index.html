<script>
/* global google */
var PAGE = "<?= PAGE ?>";

// ── Toast ─────────────────────────────────────────────────────
var _tt;
function toast(msg, isOk) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'on' + (isOk ? ' g' : ' err');
  clearTimeout(_tt);
  _tt = setTimeout(function () { el.className = ''; }, 3200);
}

// ── GAS call ──────────────────────────────────────────────────
function gas(action, args, cb) {
  google.script.run
    .withSuccessHandler(function (res) { wsSetConnStatus(true, 'Połączono.'); cb(res); })
    .withFailureHandler(function (e) {
      var msg = (e && e.message) || 'Błąd połączenia.';
      toast(msg, false);
      wsSetConnStatus(false, 'Błąd połączenia: ' + msg);
      wsShowError('Błąd połączenia: ' + msg);
    })
    .callRCP(action, JSON.stringify(args || []));
}

wsMountFaq();

// ── Żywy zegar (tylko widok pracownika) ───────────────────────
(function () {
  var t = document.getElementById('live-time');
  if (!t) return;
  var d = document.getElementById('live-date');
  function tick() {
    var now = new Date();
    t.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    d.textContent = now.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  tick();
  setInterval(tick, 1000);
})();

// ════════════════════════════════════════════════════════════
if (PAGE === 'admin') {
// ════════════════════════════════════════════════════════════

  var WIN = 30;          // sekundy okna
  var GREEN_UNTIL = 20;  // 0–20 s od zmiany kodu → zielony
  var left = 0;          // sekundy do zmiany kodu
  var loading = false;
  var retryIn = 0;

  var elToken   = document.getElementById('token');
  var elRing    = document.getElementById('ring');
  var elStatus  = document.getElementById('tok-status');
  var elRefresh = document.getElementById('btn-refresh');
  var RING_C    = 2 * Math.PI * 54;
  elRing.style.strokeDasharray = RING_C;

  // forceNext=true → prosi serwer o kod KOLEJNEGO okna (przycisk "Odśwież"),
  // ważny od razu dzięki tolerancji ±1 okna po stronie serwera.
  function refreshToken(forceNext) {
    if (loading) return;
    loading = true;
    gas('getToken', [!!forceNext], function (res) {
      loading = false;
      if (!res || !res.ok) return;
      elToken.textContent = res.token;
      WIN  = res.winSec || 30;
      left = Math.max(1, Math.min(WIN, parseInt(res.secLeft, 10) || WIN));
      render();
    });
  }

  function render() {
    var elapsed = WIN - left;
    var green = elapsed <= GREEN_UNTIL;

    elToken.className = 'token-display ' + (green ? 'green' : 'red');
    elRing.style.strokeDashoffset = RING_C * (1 - left / WIN);
    elRing.className = 'ring-fill' + (green ? '' : ' red');

    if (green) {
      elStatus.className = 'tok-status green';
      elStatus.textContent = 'Przepisz kod — ważny jeszcze ' + left + ' s';
      elRefresh.className = 'btn btn-accent btn-refresh';
    } else {
      elStatus.className = 'tok-status red';
      elStatus.textContent = 'Kod wkrótce ulegnie przedawnieniu (' + left + ' s)';
      elRefresh.className = 'btn btn-accent btn-refresh show';
    }
  }

  elRefresh.addEventListener('click', function () { refreshToken(true); });

  setInterval(function () {
    if (left > 0) {
      left--;
      render();
      if (left === 0) refreshToken(false);
    } else if (!loading) {
      retryIn--;
      if (retryIn <= 0) { retryIn = 5; refreshToken(false); }
    }
  }, 1000);

  refreshToken(false);

// ════════════════════════════════════════════════════════════
} else {
// ════════════════════════════════════════════════════════════

  var pin = '', code = '', empPin = '', empName = '';
  var absTypes = null;
  var resetTimer = null;

  var ICON_OK  = '<svg class="ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5"/></svg>';
  var ICON_ABS = '<svg class="ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/><path d="M9.5 14.5l5 5M14.5 14.5l-5 5"/></svg>';

  // Przełączanie kroków
  function show(id) {
    ['s-pin', 's-code', 's-abs', 's-ovr', 's-ok'].forEach(function (s) {
      document.getElementById(s).className = 'step' + (s === id ? ' on' : '');
    });
  }

  function resetAll() {
    pin = ''; code = ''; empPin = ''; empName = '';
    absTypes = null; // lista zależy od formy zatrudnienia — nie może przetrwać zmiany pracownika
    setDots(pin, 'p');
    setDots(code, 'c');
    show('s-pin');
  }

  function finishOk(icon, accent, title, msg, delayMs) {
    var wrap = document.getElementById('ok-icon-wrap');
    wrap.className = 'ok-icon-wrap' + (accent ? ' accent' : '');
    wrap.innerHTML = icon;
    document.getElementById('ok-title').textContent = title;
    document.getElementById('ok-msg').textContent   = msg;
    show('s-ok');
    clearTimeout(resetTimer);
    resetTimer = setTimeout(resetAll, delayMs || 3000);
  }

  // Aktualizacja kropek
  function setDots(val, pfx) {
    for (var i = 0; i < 4; i++) {
      var d = document.getElementById(pfx + i);
      if (d) d.className = 'dot' + (i < val.length ? ' on' : '');
    }
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }

  // ── Klawiatura PIN ────────────────────────────────────────
  document.getElementById('kp-pin').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-v]');
    if (!btn) return;
    var v = btn.getAttribute('data-v');
    if (v === 'C')      { pin = ''; }
    else if (v === 'X') { pin = pin.slice(0, -1); }
    else if (pin.length < 4) { pin += v; }
    setDots(pin, 'p');

    if (pin.length === 4) {
      toast('Weryfikacja…', true);
      gas('checkPin', [pin], function (res) {
        if (res && res.ok) {
          empPin  = pin;
          empName = res.imie + ' ' + res.nazwisko;
          document.getElementById('w-name').textContent = empName;
          document.getElementById('w-role').textContent = res.rola;
          code = '';
          setDots(code, 'c');
          show('s-code');
        } else {
          toast((res && res.msg) || 'Nieprawidłowy PIN.', false);
          pin = '';
          setDots(pin, 'p');
        }
      });
    }
  });

  // ── Klawiatura kodu ───────────────────────────────────────
  document.getElementById('kp-code').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-c]');
    if (!btn) return;
    var v = btn.getAttribute('data-c');
    if (v === 'C')      { code = ''; }
    else if (v === 'X') { code = code.slice(0, -1); }
    else if (code.length < 4) { code += v; }
    setDots(code, 'c');
  });

  // ── Rejestracja zdarzenia ─────────────────────────────────
  function submit(action) {
    if (code.length !== 4) {
      toast('Wpisz 4-cyfrowy kod z tabletu admina.', false);
      return;
    }
    toast('Rejestrowanie…', true);
    var rpc = (action === 'WEJSCIE') ? 'clockIn' : 'clockOut';
    gas(rpc, [empPin, code], function (res) {
      if (res && res.ok) {
        var label = (action === 'WEJSCIE') ? 'Wejście' : 'Wyjście';
        var msg = res.imie + ' — ' + label + ' o ' + res.godzina;
        if (res.overtime) {
          // Praca poza regularnymi godzinami Kliniki → uzasadnienie
          document.getElementById('ovr-sub').textContent = msg;
          document.getElementById('ovr-note').value = '';
          show('s-ovr');
        } else {
          finishOk(ICON_OK, false, 'Zarejestrowano', msg, 3000);
        }
      } else {
        toast((res && res.msg) || 'Błąd rejestracji.', false);
        code = '';
        setDots(code, 'c');
      }
    });
  }

  document.getElementById('btn-in').addEventListener('click',   function () { submit('WEJSCIE'); });
  document.getElementById('btn-out').addEventListener('click',  function () { submit('WYJSCIE'); });
  document.getElementById('btn-back').addEventListener('click', resetAll);

  // ── Uzasadnienie przekroczenia godzin ─────────────────────
  document.getElementById('ovr-save').addEventListener('click', function () {
    var note = document.getElementById('ovr-note').value.trim();
    if (!note) { toast('Wpisz uzasadnienie.', false); return; }
    toast('Zapisywanie…', true);
    gas('setOvertimeNote', [empPin, note], function (res) {
      if (res && res.ok) {
        finishOk(ICON_OK, false, 'Zarejestrowano', 'Uzasadnienie zapisane. Dziękujemy.', 3000);
      } else {
        toast((res && res.msg) || 'Błąd zapisu.', false);
      }
    });
  });

  document.getElementById('ovr-skip').addEventListener('click', function () {
    finishOk(ICON_OK, false, 'Zarejestrowano', 'Pamiętaj o uzupełnieniu uzasadnienia u administratora.', 3500);
  });

  // ── Nieobecność ───────────────────────────────────────────
  function fillAbsTypes() {
    var sel = document.getElementById('abs-typ');
    sel.innerHTML = '<option value="">— wybierz typ —</option>';
    (absTypes || []).forEach(function (t) {
      if (t.code === 'DW') return; // zastrzeżone dla właściciela (dzień wolny kliniki)
      var o = document.createElement('option');
      o.value = t.code;
      o.textContent = t.label;
      sel.appendChild(o);
    });
  }

  document.getElementById('btn-abs').addEventListener('click', function () {
    document.getElementById('abs-who').textContent = empName;
    document.getElementById('abs-from').value = todayStr();
    document.getElementById('abs-to').value   = todayStr();
    document.getElementById('abs-note').value = '';
    if (absTypes) {
      fillAbsTypes();
      show('s-abs');
    } else {
      toast('Ładowanie…', true);
      gas('getAbsenceTypes', [empPin], function (res) {
        if (res && res.ok) {
          absTypes = res.types || [];
          fillAbsTypes();
          show('s-abs');
        } else {
          toast('Błąd ładowania typów nieobecności.', false);
        }
      });
    }
  });

  document.getElementById('abs-back').addEventListener('click', function () {
    show('s-code');
  });

  document.getElementById('abs-submit').addEventListener('click', function () {
    var from = document.getElementById('abs-from').value;
    var to   = document.getElementById('abs-to').value;
    var typ  = document.getElementById('abs-typ').value;
    var note = document.getElementById('abs-note').value.trim();

    if (!from || !to)  { toast('Wybierz zakres dat.', false); return; }
    if (from > to)     { toast('Data „od” nie może być późniejsza niż „do”.', false); return; }
    if (!typ)          { toast('Wybierz typ nieobecności.', false); return; }
    if (typ === 'INNE' && !note) { toast('Dla typu „Inne” adnotacja jest wymagana.', false); return; }

    toast('Zgłaszanie…', true);
    gas('reportAbsence', [empPin, from, to, typ, note], function (res) {
      if (res && res.ok) {
        var dni = res.dni === 1 ? '1 dzień' : res.dni + ' dni';
        finishOk(ICON_ABS, true, 'Zgłoszono nieobecność', res.typ + ' — ' + dni, 3500);
      } else {
        toast((res && res.msg) || 'Błąd zgłoszenia.', false);
      }
    });
  });
}
</script>
</body>
</html>
