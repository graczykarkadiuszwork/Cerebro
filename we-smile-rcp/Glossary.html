  { cat: 'Odbicia i czas pracy', term: 'Norma godzin a rzeczywiste godziny', def: 'Norma to tylko punkt odniesienia do porównania — nieprzepracowanie normy nie blokuje żadnej funkcji systemu.', loc: 'Pasek normy godzin (góra ekranu), Panel Raportowy, Panel Właściciela → Raporty' },
  { cat: 'Odbicia i czas pracy', term: 'Brakujące odbicie — pytanie na kiosku', def: 'Jeśli pracownik zapomni odbić wejście albo wyjście, przy najbliższym odbiciu kiosk pyta o godzinę tego jednego, NAJNOWSZEGO braku. Pytanie pojawia się dopiero po zarejestrowaniu bieżącego odbicia i nigdy nie ustawia się w kolejkę — starsze zaległości porządkuje administrator.', loc: 'Kiosk (ekran pracownika) — po odbiciu' },
  { cat: 'Odbicia i czas pracy', term: 'Oznaczenie poprawki pracownika', def: 'Godzina wpisana przez pracownika w oknie brakującego odbicia jest zapisywana z oznaczeniem, że pochodzi od niego — to sygnał do sprawdzenia. Poprawka administratora nie jest oznaczana; jej ślad pozostaje w arkuszu Google zasilającym RCP.', loc: 'Kiosk → brakujące odbicie; Panel Właściciela → Dzień' },
  { cat: 'Odbicia i czas pracy', term: 'Pominięcie pytania o brakujące odbicie', def: 'Pracownik może pominąć pytanie — odbicie, po które przyszedł, i tak jest już zapisane. Brak trafia wtedy do uzupełnienia przez administratora zamiast blokować kiosk.', loc: 'Kiosk (ekran pracownika)' },
  { cat: 'Odbicia i czas pracy', term: 'Przerwa w trakcie dnia pracy', def: 'Rejestracja przerwy bez dodatkowego odbicia Wejście/Wyjście — jeden przycisk na kiosku zawiesza i wznawia liczenie czasu pracy w trakcie już rozpoczętego dnia (np. higienistka ma lukę między przygotowaniem gabinetów a asystą). Rozpoczęcie przerwy wymaga krótkiej adnotacji z powodem; zakończenie przerwy nie wymaga adnotacji.', loc: 'Kiosk (ekran pracownika) — przycisk „Przerwa"; widoczne w zakładce „Dzień" i osi czasu dnia w Panelu Właściciela' },

  { cat: 'Nieobecności', term: 'Maksymalny zakres dat nieobecności', def: 'Jednorazowy zapis nieobecności (dla jednej osoby lub całej Kliniki) obejmuje ograniczoną liczbę dni — dłuższy okres trzeba podzielić na kilka zapisów.', loc: 'Panel Właściciela → Dzień, Urlop, Dni wolne' },

  { cat: 'Grafik', term: 'Asysta częściowa', def: 'Asysta nie musi pokrywać całego bloku lekarskiego — można ustawić jej własny, krótszy zakres godzin.', loc: 'Panel Właściciela → Grafik → edycja bloku' },
  { cat: 'Grafik', term: 'Godziny poza oknem otwarcia gabinetu', def: 'Blok zaczynający się przed otwarciem lub kończący po zamknięciu danego dnia zostaje odrzucony przy zapisie.', loc: 'Panel Właściciela → Grafik' },

  { cat: 'Grafik', term: 'Ikona rekomendacji przy dniu', def: 'Wykrzyknik przy konkretnym dniu w grafiku oznacza, że silnik rekomendacji ma dla tego dnia sugestię — kliknięcie pokazuje szczegóły.', loc: 'Panel Właściciela → Grafik' },
  { cat: 'Grafik', term: 'Tagi specjalizacji a rekomendacje', def: 'Bez ustawionych tagów specjalizacji lekarza system nie potrafi zaproponować, kto najlepiej pasuje do wolnego miejsca — rekomendacje będą ogólne.', loc: 'Panel Właściciela → Zespół, Grafik → Rekomendacje' },
  { cat: 'Grafik', term: 'Grafik lekarza — kalendarz miesiąca', def: 'Wybierasz lekarza i klikasz dzień w kalendarzu, żeby ustawić jego godziny i gabinet — każdy dzień edytuje się osobno, niezależnie od pozostałych. Ustawienia z jednego dnia można rozesłać na te same dni tygodnia w całym miesiącu jednym przyciskiem.', loc: 'Panel Właściciela → Grafik → „Grafik lekarza"' },
  { cat: 'Grafik', term: 'Import grafiku — podgląd przed zastosowaniem', def: 'Import pokazuje najpierw, co się zmieni, zanim cokolwiek zostanie zapisane — można sprawdzić skutki przed potwierdzeniem.', loc: 'Panel Właściciela → Grafik → Import' },
  { cat: 'Grafik', term: 'Menu „Więcej" (Grafik)', def: 'Rzadziej używane narzędzia grafiku obsady — Adnotacje, Import i Wydruk — są schowane pod jednym rozwijanym przyciskiem „Więcej", żeby na co dzień nie zaśmiecały widoku edytora.', loc: 'Panel Właściciela → Grafik → przycisk „Więcej"' },
  { cat: 'Grafik', term: 'Miesiąc jako punkt wyjścia', def: 'Grafik buduje się zawsze w widoku miesiąca — każdy dzień ma własną, niezależną obsadę przypisaną do konkretnej daty. Dzięki temu lekarz może w jeden poniedziałek pracować do 16, a w kolejny do 18, bez wpływu na pozostałe tygodnie.', loc: 'Panel Właściciela → Grafik → widok „Miesiąc"' },
  { cat: 'Grafik', term: 'Lista grafiku — dzień po dniu, gabinet po gabinecie', def: 'Domyślny i jedyny sposób układania obsady: płaska, przewijana lista całego miesiąca — każdy dzień roboczy, a w nim każdy gabinet z wierszem (lub kilkoma) na zmianę. Zastąpiła wolny kalendarz kafelkowy z modalami; edycja jest wprost w polu, bez otwierania osobnego okna.', loc: 'Panel Właściciela → Grafik' },
  { cat: 'Grafik', term: 'Wiersz zmiany w liście grafiku', def: 'Godziny, osoba (lekarz albo higienistka) i asysta w jednym wierszu. Zmiana zapisuje się sama po opuszczeniu pola — żółte podświetlenie dnia w trakcie zapisu, zielone po sukcesie — dokładnie jak w zakładce „Miesiąc" w RCP.', loc: 'Panel Właściciela → Grafik' },
  { cat: 'Grafik', term: '„+ dodaj zmianę"', def: 'Dokłada kolejny wiersz w tym samym gabinecie tego samego dnia — przydatne, gdy w jednym gabinecie pracują po sobie różne osoby (np. zmiana poranna i popołudniowa). Liczba zmian w gabinecie na dzień nie jest ograniczona.', loc: 'Panel Właściciela → Grafik → pod każdym gabinetem' },
  { cat: 'Grafik', term: 'Wypełnienie pustego miesiąca', def: 'Nowy, pusty miesiąc proponuje dwa punkty startowe: skopiowanie poprzedniego miesiąca albo rozsianie wzorcowego tygodnia. Po wypełnieniu każdy wiersz pozostaje w pełni edytowalny osobno — to tylko podstawa, nie sztywny szablon.', loc: 'Panel Właściciela → Grafik (pusty miesiąc)' },
  { cat: 'Grafik', term: 'Higienistka w liście grafiku', def: 'Wybranie higienistki w wierszu blokuje pole asysty — higienistka prowadząca gabinet jest samodzielnym specjalistą. Przy lekarzu w innym wierszu może występować jako asysta — to inna rola w innym miejscu listy.', loc: 'Panel Właściciela → Grafik' },
  { cat: 'Grafik', term: 'Higienistka jako samodzielny specjalista', def: 'Higienistka prowadząca własny gabinet pracuje samodzielnie — asysta jej nie przysługuje, a sekcja asysty jest wtedy ukryta. Przy lekarzu ta sama osoba może występować jako asysta; to inna rola, nie inny pracownik.', loc: 'Panel Właściciela → Grafik → Miesiąc → edytor dnia' },
  { cat: 'Grafik', term: 'Wydruk A4 miesiąca', def: 'Wydruk odwzorowuje papierowy grafik kliniki: miesiąc rozbity na pasma tygodni, sześć kolumn dni (Pn–Sb), operator wersalikami i jego asysta pod spodem, higienistka z sufiksem -HIG. Układ przygotowany pod A4 w poziomie.', loc: 'Panel Właściciela → Grafik → Miesiąc → „Wydruk A4"' },
  { cat: 'Grafik', term: 'Zatwierdzenie grafiku (dwuetapowe)', def: 'Zatwierdzenie miesiąca grafiku wymaga dwóch kolejnych kliknięć tego samego przycisku (pierwsze tylko uzbraja potwierdzenie) — zabezpieczenie przed przypadkowym zatwierdzeniem niedokończonego planu.', loc: 'Panel Właściciela → Miesiąc → przycisk zatwierdzenia grafiku' },
  { cat: 'Grafik', term: 'Zgodność grafiku z RCP', def: 'Panel porównujący zaplanowane bloki grafiku z faktycznie zarejestrowanymi godzinami w RCP dla tego samego miesiąca — pokazuje, gdzie plan i rzeczywistość się rozjeżdżają.', loc: 'Panel Właściciela → Miesiąc → panel zgodności z RCP' },

  { cat: 'Urlop — pokrycie grafiku', term: 'Rola „obsada"', def: 'Dotyczy bloku, w którym urlopowana osoba jest głównym prowadzącym (lekarzem lub higienistką) — zastępca przejmuje cały blok.', loc: 'Panel Właściciela → Urlop → pokrycie grafiku' },
  { cat: 'Urlop — pokrycie grafiku', term: 'Rola „asysta"', def: 'Dotyczy bloku, w którym urlopowana osoba jest tylko asystą przy kimś innym — zastępca przejmuje wyłącznie jej miejsce w asyście, nie cały blok.', loc: 'Panel Właściciela → Urlop → pokrycie grafiku' },
  { cat: 'Urlop — pokrycie grafiku', term: 'Przypisanie zastępcy', def: 'Wybranie kandydata z listy i kliknięcie „Przypisz" od razu zapisuje zmianę w grafiku tego dnia — dokładnie tak, jakby zrobił to administrator ręcznie w Grafiku.', loc: 'Panel Właściciela → Urlop → pokrycie grafiku' },
  { cat: 'Urlop — pokrycie grafiku', term: 'Brak dostępnych zastępców', def: 'Jeśli nikt z odpowiedniej grupy zawodowej nie jest wolny w danym oknie czasowym, lista kandydatów jest pusta, a przycisk „Przypisz" nieaktywny — trzeba rozwiązać obsadę ręcznie.', loc: 'Panel Właściciela → Urlop → pokrycie grafiku' },
  { cat: 'Urlop — pokrycie grafiku', term: 'Czego ta funkcja NIE robi', def: 'To wyłącznie podpowiedź dla administratora — nie ma tu formularza wniosku urlopowego, limitów dni ani przepływu zatwierdzania. Nic nie dzieje się automatycznie bez kliknięcia „Przypisz".', loc: 'Panel Właściciela → Urlop' },
  { cat: 'Urlop — pokrycie grafiku', term: 'Odświeżenie po przypisaniu', def: 'Po przypisaniu zastępcy lista pokrycia odświeża się sama — jeśli blok już nie koliduje z urlopem, znika z listy.', loc: 'Panel Właściciela → Urlop → pokrycie grafiku' },

  { cat: 'Dni wolne — kalendarz świąt', term: 'Kalendarz świąt', def: 'Gotowa, wyliczona z góry lista wszystkich polskich świąt ustawowo wolnych od pracy na najbliższe 10 lat — bez ręcznego wpisywania dat.', loc: 'Panel Właściciela → Dni wolne → „Kalendarz świąt"' },
  { cat: 'Dni wolne — kalendarz świąt', term: 'Święta ruchome', def: 'Cztery święta zależne od daty Wielkanocy (Niedziela Wielkanocna, Poniedziałek Wielkanocny, Zielone Świątki, Boże Ciało) — ich data zmienia się co roku i jest wyliczana automatycznie.', loc: 'Panel Właściciela → Dni wolne → „Kalendarz świąt"' },
  { cat: 'Dni wolne — kalendarz świąt', term: 'Święta stałe', def: 'Dziewięć świąt przypadających zawsze na tę samą datę kalendarzową (np. 1 stycznia, 1 maja, 25 grudnia).', loc: 'Panel Właściciela → Dni wolne → „Kalendarz świąt"' },
  { cat: 'Dni wolne — kalendarz świąt', term: 'Zastosowanie pojedynczego święta', def: 'Przycisk „Zastosuj" przy konkretnym święcie ustawia dzień wolny dla całego zespołu na tę jedną datę — tak samo jak ręczne „Dni wolne".', loc: 'Panel Właściciela → Dni wolne → „Kalendarz świąt"' },
  { cat: 'Dni wolne — kalendarz świąt', term: 'Zastosowanie wszystkich świąt roku', def: 'Jedno kliknięcie zastosowuje od razu wszystkie jeszcze niezastosowane święta wybranego roku — nie trzeba klikać każdego z osobna.', loc: 'Panel Właściciela → Dni wolne → „Kalendarz świąt"' },
  { cat: 'Dni wolne — kalendarz świąt', term: 'Cofnięcie zastosowania święta', def: 'Przycisk „Cofnij" usuwa nieobecność zespołu z tej daty i wraca ją do stanu „nie zastosowano" — można to zrobić, jeśli klinika jednak pracuje danego dnia.', loc: 'Panel Właściciela → Dni wolne → „Kalendarz świąt"' },
  { cat: 'Dni wolne — kalendarz świąt', term: 'Status „zastosowano" / „nie zastosowano"', def: 'Każde święto na liście pokazuje, czy dzień wolny został już dla niego ustawiony — bez potrzeby sprawdzania tego osobno w nieobecnościach.', loc: 'Panel Właściciela → Dni wolne → „Kalendarz świąt"' },
  { cat: 'Dni wolne — kalendarz świąt', term: 'Wybór roku w kalendarzu świąt', def: 'Lista pokazuje jeden rok naraz; przełącznik roku pozwala przejrzeć dowolny z najbliższych 10 lat.', loc: 'Panel Właściciela → Dni wolne → „Kalendarz świąt"' },
  { cat: 'Dni wolne — kalendarz świąt', term: 'Wymagany typ dnia wolnego', def: 'Zastosowanie święta korzysta z typu wybranego w polu „Typ" powyżej — bez wybranego typu system poprosi o jego uzupełnienie.', loc: 'Panel Właściciela → Dni wolne' },
  { cat: 'Dni wolne — kalendarz świąt', term: 'Dlaczego 10 lat z góry', def: 'Tyle lat starcza na wieloletnie planowanie bez konieczności ręcznego dopisywania nowych dat co roku — lista sama „przesuwa się" wraz z upływem czasu.', loc: 'Panel Właściciela → Dni wolne → „Kalendarz świąt"' },

  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Sesja wygasła."', def: 'Sesja logowania minęła (do 1 godziny bezczynności) — trzeba zalogować się ponownie PIN-em.', loc: 'Dowolna zakładka Panelu Właściciela / Raportowego' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Nieprawidłowy PIN."', def: 'Wpisany PIN nie pasuje do żadnego aktywnego pracownika — sprawdź literówkę albo poproś administratora o przypomnienie kodu.', loc: 'Ekran logowania (PIN)' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Zbyt wiele prób. Odczekaj 5 minut."', def: 'Zbyt wiele błędnych prób logowania z rzędu — zabezpieczenie przed zgadywaniem PIN-u, trzeba odczekać.', loc: 'Ekran logowania (PIN)' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Klinika jest w tym dniu nieczynna."', def: 'Próba zapisania bloku grafiku w niedzielę lub innym dniu bez godzin otwarcia — grafik nie przyjmuje obsady w dni zamknięcia.', loc: 'Panel Właściciela → Grafik / Miesiąc' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„…godziny co 5 minut."', def: 'Wpisane godziny bloku nie leżą na siatce co 5 minut (np. 9:07) — popraw je do najbliższej wielokrotności 5 minut.', loc: 'Panel Właściciela → Grafik / Miesiąc' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„…poza godzinami otwarcia."', def: 'Blok wykracza poza godziny otwarcia gabinetów tego dnia tygodnia — skróć zakres godzin albo wybierz inny dzień.', loc: 'Panel Właściciela → Grafik / Miesiąc' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„…ten gabinet jest już zajęty w tych godzinach."', def: 'W tym gabinecie jest już inny blok nachodzący się czasowo — zmień godziny albo wybierz inny gabinet.', loc: 'Panel Właściciela → Grafik / Miesiąc' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„…jest w tym czasie w innym gabinecie."', def: 'Wybrana osoba ma już blok w innym gabinecie w nachodzącym się czasie — jedna osoba nie może być w dwóch miejscach naraz.', loc: 'Panel Właściciela → Grafik / Miesiąc' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„…higienizację prowadzi higienistka."', def: 'Blok typu Higienizacja można przypisać tylko osobie z rolą higienistki.', loc: 'Panel Właściciela → Grafik / Miesiąc' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„…blok lekarski obsadza lekarz."', def: 'Blok typu Lekarz można przypisać tylko osobie z rolą lekarza.', loc: 'Panel Właściciela → Grafik / Miesiąc' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Zakres zbyt długi na podgląd pokrycia."', def: 'Zakres dat urlopu wybrany do sprawdzenia pokrycia grafiku przekracza dopuszczalne 62 dni — podziel go na krótsze odcinki.', loc: 'Panel Właściciela → Urlop → pokrycie grafiku' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Zastępca musi być inną osobą."', def: 'Nie można przypisać urlopowanej osoby jako swojego własnego zastępcy — wybierz kogoś innego z listy kandydatów.', loc: 'Panel Właściciela → Urlop → pokrycie grafiku' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Wybierz typ dnia wolnego."', def: 'Próba zastosowania święta z kalendarza bez wcześniejszego wybrania typu w polu „Typ" — uzupełnij pole i spróbuj ponownie.', loc: 'Panel Właściciela → Dni wolne' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Nieprawidłowy zakres lat."', def: 'Kalendarz świąt obsługuje maksymalnie 10 lat naraz — wybierz mniejszy zakres.', loc: 'Panel Właściciela → Dni wolne → „Kalendarz świąt"' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Nie znaleziono bloku w tym dniu (mógł się zmienić w międzyczasie)."', def: 'Blok, który miał otrzymać zastępcę, został w międzyczasie zmieniony przez inny zapis — odśwież widok i spróbuj ponownie.', loc: 'Panel Właściciela → Urlop → pokrycie grafiku' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Nieprawidłowy zakres dat."', def: 'Data „Od" jest późniejsza niż data „Do", albo któraś z dat ma zły format — popraw zakres.', loc: 'Panel Właściciela → Dzień, Urlop, Dni wolne' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Wybierz pracownika."', def: 'Formularz wymaga wskazania konkretnej osoby, zanim pozwoli zapisać zmianę.', loc: 'Panel Właściciela → Dzień, Urlop' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Wpisz treść notatki."', def: 'Próba dodania pustej notatki sesji — wpisz treść przed kliknięciem „+ Dodaj notatkę".', loc: 'Panel Właściciela → Dzień → Notatki sesji' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Nie znaleziono notatki / adnotacji / szablonu."', def: 'Element, który próbujesz usunąć lub zmienić, został już wcześniej usunięty (np. przez inną osobę) — odśwież listę.', loc: 'Panel Właściciela → różne zakładki' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Podaj nazwę." (szablon zmiany)', def: 'Szablon zmiany wymaga nazwy przed zapisaniem — pole nie może być puste.', loc: 'Panel Właściciela → Grafik → „Szablony zmian"' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Wpisz treść." (adnotacja)', def: 'Adnotacja w grafiku nie może być zapisana bez treści.', loc: 'Panel Właściciela → Miesiąc → „Adnotacje"' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: '„Wybierz sposób powtarzania."', def: 'Próba utworzenia serii adnotacji bez wybrania trybu (tydzień/miesiąc/rok) — uzupełnij pole przed zapisem.', loc: 'Panel Właściciela → Miesiąc → „Adnotacje" → powtarzaj' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: 'Toast czerwony vs zielony', def: 'Czerwony komunikat (u góry ekranu) oznacza błąd i nic nie zostało zapisane; zielony potwierdza, że operacja się udała.', loc: 'Cały Panel Właściciela' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: 'Przycisk wymaga dwóch kliknięć', def: 'Niektóre nieodwracalne akcje (np. usunięcie szablonu, „Dni wolne dla całego zespołu") wymagają kliknięcia dwa razy z rzędu — pierwsze tylko uzbraja przycisk, w kilka sekund wraca do stanu początkowego.', loc: 'Panel Właściciela → różne zakładki' },
  { cat: 'Rozwiązywanie problemów — komunikaty', term: 'Dane nie odświeżają się automatycznie między zakładkami', def: 'Przejście do innej zakładki i powrót pobiera dane na nowo — jeśli coś nie wygląda na aktualne, sprawdź, czy nie trzeba ponownie wejść w zakładkę.', loc: 'Cały Panel Właściciela' },

  { cat: 'Skróty i FAQ', term: 'Zapomniany PIN', def: 'Tylko administrator może sprawdzić lub nadać nowy PIN w zakładce Zespół — pracownik nie ma dostępu do własnego PIN-u z poziomu kiosku.', loc: 'Panel Właściciela → Zespół' },
  { cat: 'Skróty i FAQ', term: 'Czy można cofnąć zapisaną zmianę?', def: 'Nie ma jednego przycisku „cofnij" — trzeba ręcznie wprowadzić poprzedni stan (np. wpisać z powrotem poprzednie godziny albo usunąć błędnie dodany wpis).', loc: 'Cały Panel Właściciela' },
  { cat: 'Skróty i FAQ', term: 'Co jeśli dwóch administratorów edytuje jednocześnie?', def: 'Ostatni zapis wygrywa — Arkusze Google nie ostrzegają o nadpisaniu zmiany innej osoby, więc warto ustalić w zespole, kto edytuje co i kiedy.', loc: 'Cały Panel Właściciela' },
  { cat: 'Skróty i FAQ', term: 'Czy dane są gdzieś kopiowane poza Arkusze Google?', def: 'Nie — wszystkie dane RCP mieszkają wyłącznie w arkuszu Google powiązanym z aplikacją, bez zewnętrznych baz danych.', loc: '—' },
  { cat: 'Skróty i FAQ', term: 'Co się dzieje z danymi zwolnionego pracownika?', def: 'Archiwizacja w zakładce Zespół oznacza pracownika jako nieaktywnego, ale zachowuje całą jego historię — nic nie jest kasowane.', loc: 'Panel Właściciela → Zespół' },
  { cat: 'Skróty i FAQ', term: 'Czy da się przywrócić zarchiwizowanego pracownika?', def: 'Tak, przyciskiem przywracania przy jego wpisie na liście archiwum — wraca z tym samym ID i historią.', loc: 'Panel Właściciela → Zespół → Archiwum' },
  { cat: 'Skróty i FAQ', term: 'Dlaczego lekarz nie ma godzin w Raportach?', def: 'Lekarze nie odbijają się na kiosku (nie mają tam czego liczyć), więc ich czas pracy nie pojawia się w raportach godzin — ich obecność widać w Grafiku.', loc: 'Panel Właściciela → Raporty, Grafik' },
  { cat: 'Skróty i FAQ', term: 'Czy Panel Raportowy widzi wszystkich pracowników?', def: 'Nie — każdy zalogowany PIN-em widzi domyślnie tylko własne dane w „Mój miesiąc"; pełny widok wszystkich mają tylko administratorzy w Panelu Właściciela.', loc: 'Panel Raportowy, Panel Właściciela' },
  { cat: 'Skróty i FAQ', term: 'Jak zgłosić błąd w godzinach za poprzedni miesiąc?', def: 'Zakładka Miesiąc pozwala edytować dowolny wcześniejszy miesiąc, nie tylko bieżący — wystarczy przełączyć się na niego strzałkami nawigacji.', loc: 'Panel Właściciela → Miesiąc' },
  { cat: 'Skróty i FAQ', term: 'Czy eksport Excel zawiera nieobecności?', def: 'Tak, eksport łączy godziny i nieobecności w jednym pliku, zgodnie z wybranym zakresem i filtrem osób.', loc: 'Panel Właściciela → Raporty → Eksport Excel' },
  { cat: 'Skróty i FAQ', term: 'Co się liczy do frekwencji, a co nie?', def: 'Do frekwencji liczą się dni z odbiciem; dni z usprawiedliwioną nieobecnością nie obniżają jej, bo nie są uznawane za „brakujące".', loc: 'Panel Właściciela → Raporty → Obecność' },
  { cat: 'Skróty i FAQ', term: 'Czy mogę dodać własny typ nieobecności?', def: 'Nie z poziomu interfejsu — katalog kodów nieobecności jest zdefiniowany na stałe w systemie; kod „INNE" służy do przypadków spoza listy.', loc: 'Panel Właściciela → Dzień, Urlop' },
  { cat: 'Skróty i FAQ', term: 'Czy grafik lekarza wpływa na jego wynagrodzenie?', def: 'Nie — RCP nie liczy wynagrodzeń; grafik służy wyłącznie do planowania obsady gabinetów.', loc: 'Panel Właściciela → Grafik' },
  { cat: 'Skróty i FAQ', term: 'Jak sprawdzić, kto jest teraz w pracy?', def: 'Widok „Dziś" pokazuje osoby aktualnie zalogowane na Wejściu bez odbitego Wyjścia.', loc: 'Panel Właściciela / Raportowy → Dziś' },
  { cat: 'Skróty i FAQ', term: 'Czy mogę zobaczyć grafik na przyszły rok?', def: 'Tak, widok Miesiąc pozwala przechodzić dowolnie do przodu i do tyłu strzałkami nawigacji — bez ograniczenia do bieżącego roku.', loc: 'Panel Właściciela → Miesiąc' },
  { cat: 'Skróty i FAQ', term: 'Co zrobić, gdy tablet z kodem nie działa?', def: 'Zakładka Kod w Panelu Właściciela pokazuje ten sam kod rotacyjny co tablet — można go otworzyć na innym urządzeniu jako zastępcze źródło.', loc: 'Panel Właściciela → Kod' },
  { cat: 'Skróty i FAQ', term: 'Czy zmiana motywu (jasny/ciemny) wpływa na dane?', def: 'Nie, to wyłącznie ustawienie wyglądu zapisywane lokalnie w przeglądarce — nie ma wpływu na żadne dane w arkuszu.', loc: 'Ekran logowania — przełącznik motywu' },
  { cat: 'Skróty i FAQ', term: 'Jak długo trzymane są dane w Logach administracyjnych?', def: 'Logi_Admin rośnie bez automatycznego czyszczenia — to pełna, trwała historia działań administratorów w systemie.', loc: '—' },
  { cat: 'Skróty i FAQ', term: 'Czy da się cofnąć przypisanie zastępcy z pokrycia urlopu?', def: 'Tak, ręcznie w zakładce Grafik lub Miesiąc — przypisanie zastępcy to zwykła edycja bloku, więc można ją zmienić tak samo jak każdą inną.', loc: 'Panel Właściciela → Grafik, Miesiąc' },
  { cat: 'Skróty i FAQ', term: 'Dlaczego niektóre przyciski są wyszarzone?', def: 'Przycisk jest nieaktywny, gdy akcja nie ma sensu w danym stanie (np. brak dostępnych kandydatów na zastępcę) — to celowa podpowiedź, a nie usterka.', loc: 'Cały Panel Właściciela' },

  { cat: 'Nawigacja i interfejs', term: 'Nawigacja dolna / boczna', def: 'W wersji mobilnej menu jest na dole ekranu (w zasięgu kciuka); w wersji desktopowej — z boku lub u góry, zależnie od interfejsu.', loc: 'Cały Panel Właściciela' },
  { cat: 'Nawigacja i interfejs', term: 'Szybkie wyszukiwanie w Pomocy', def: 'Wpisanie dowolnego słowa w polu wyszukiwania od razu przeszukuje wszystkie kategorie naraz, nawet jeśli wcześniej wybrana była tylko jedna.', loc: 'Panel Właściciela → Pomoc' },
  { cat: 'Nawigacja i interfejs', term: 'Kategorie w Pomocy', def: 'Kliknięcie kategorii ogranicza listę do niej; kliknięcie „Wszystko" wraca do pełnej listy.', loc: 'Panel Właściciela → Pomoc' },
  { cat: 'Nawigacja i interfejs', term: '„Gdzie znaleźć" przy każdym haśle', def: 'Każdy wpis w Pomocy pokazuje dokładnie, w której zakładce i pod jakim przyciskiem znajduje się opisywana funkcja.', loc: 'Panel Właściciela → Pomoc' },
  { cat: 'Nawigacja i interfejs', term: 'Przełącznik widoku (segmentowany)', def: 'Wzorzec z dwoma lub trzema przyciskami obok siebie (np. Lista/Kalendarz, Godziny/Obecność) pozwala przełączać sposób pokazania tych samych danych bez przeładowania zakładki.', loc: 'Panel Właściciela → Miesiąc, Raporty' },
  { cat: 'Nawigacja i interfejs', term: 'Strzałki nawigacji miesiąca/roku', def: 'Przenoszą widok o jeden miesiąc lub rok do przodu/do tyłu — działają identycznie we wszystkich zakładkach z widokiem kalendarzowym.', loc: 'Panel Właściciela → Miesiąc, Dni wolne' },
  { cat: 'Nawigacja i interfejs', term: 'Modal (okno na wierzchu)', def: 'Wyskakujące okno do szybkiej edycji bez opuszczania bieżącego widoku — zamyka się kliknięciem poza nim lub przyciskiem zamknięcia.', loc: 'Cały Panel Właściciela' },
  { cat: 'Nawigacja i interfejs', term: 'Skeleton (stan ładowania)', def: 'Wyszarzone, migające bloki pokazywane, zanim dane wczytają się z serwera — informują, że coś się ładuje, a nie że lista jest naprawdę pusta.', loc: 'Cały Panel Właściciela' },
