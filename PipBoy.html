<!-- ============================================================
     CEREBRO — PipBoy.html
     Widok Dnia (6.1), Trening (6.3) i Karta Postaci (6.6) — Faza 1-2.
     ============================================================ -->
<div class="pipboy-shell crt-low" id="pb-shell">
  <div class="pb-eyebrow">CEREBRO // PIP-BOY // ORGANIZACJA ŻYCIA</div>
  <div class="pb-title" id="pb-view-title">WIDOK DNIA</div>

  <div class="pb-tabs">
    <button class="pb-tab active" id="pb-tab-dzien" onclick="pbSwitchTab('dzien')">DZIEŃ</button>
    <button class="pb-tab" id="pb-tab-trening" onclick="pbSwitchTab('trening')">TRENING</button>
    <button class="pb-tab" id="pb-tab-postac" onclick="pbSwitchTab('postac')">POSTAĆ</button>
    <button class="pb-tab" id="pb-tab-dashboard" onclick="pbSwitchTab('dashboard')">DASHBOARD</button>
    <button class="pb-tab disabled">TYDZIEŃ <span class="pb-tab-note">(Faza 2)</span></button>
    <button class="pb-tab disabled">PORTFOLIO <span class="pb-tab-note">(Faza 3)</span></button>
  </div>

  <div class="pb-statusbar">
    <span class="pb-hp-label" id="pb-date-label">—</span>
    <span class="pb-hp-label">HP</span>
    <div class="pb-hp-track"><div class="pb-hp-fill" id="pb-hp-fill" style="width:100%"></div></div>
    <span class="pb-hp-value" id="pb-hp-value">100%</span>
    <button class="pb-godmode-btn" id="pb-godmode-btn" onclick="pbToggleGodMode()">GOD_MODE_24H: OFF</button>
  </div>

  <!-- ===== WIDOK: DZIEŃ ===== -->
  <div id="pb-view-dzien">
    <div class="pb-quote" id="pb-quote" style="display:none;">
      <div id="pb-quote-text"></div>
      <div class="pb-quote-author" id="pb-quote-author"></div>
    </div>

    <div class="pb-marquee-wrap">
      <div class="pb-marquee-track" id="pb-marquee-track">Ładowanie…</div>
    </div>

    <div id="pb-przypomnienia" style="margin-bottom:10px;"></div>

    <div id="pb-blocks">
      <div style="color:var(--pb-green-dim); font-size:0.85em;">Ładowanie dnia…</div>
    </div>
  </div>

  <!-- ===== WIDOK: TRENING (Moduł 2) ===== -->
  <div id="pb-view-trening" style="display:none;">
    <div style="color:var(--pb-green-dim); font-size:0.85em; margin-bottom:10px;">
      Plan startowy A/B — w pełni edytowalny. Reguła plateau: 3+ kolejne wystąpienia ćwiczenia bez progresji.
    </div>
    <div id="pb-trening-plany"><div style="color:var(--pb-green-dim);">Ładowanie planu…</div></div>

    <div class="pb-eyebrow" style="margin-top:18px;">ZAPISZ SERIĘ</div>
    <div class="pb-mood-grid" style="grid-template-columns: 1fr 1fr;">
      <label>Ćwiczenie</label>
      <select class="pb-input" id="pb-log-cwiczenie"></select>
      <label>Status</label>
      <select class="pb-input" id="pb-log-status" onchange="pbOnStatusChange()">
        <option value="pelna">Pełna sesja</option>
        <option value="zmodyfikowana">Zmodyfikowana — ograniczenie zdrowotne</option>
        <option value="ad-hoc">Ad-hoc / inny trening</option>
      </select>
      <label id="pb-log-powod-label" style="display:none;">Powód</label>
      <select class="pb-input" id="pb-log-powod" style="display:none;">
        <option value="zdrowie">Zdrowie / kontuzja</option>
        <option value="zmeczenie">Zmęczenie</option>
        <option value="zle-samopoczucie">Złe samopoczucie</option>
        <option value="inne">Inne</option>
      </select>
      <label>Seria nr</label>
      <input class="pb-input" id="pb-log-seria" type="number" min="1" value="1">
      <label>Powtórzenia</label>
      <input class="pb-input" id="pb-log-powt" type="text" placeholder="np. 8-10">
      <label>Ciężar (kg)</label>
      <input class="pb-input" id="pb-log-ciezar" type="number" step="0.5">
      <label>Ocena sesji (1-10)</label>
      <input class="pb-input" id="pb-log-ocena" type="number" min="1" max="10">
    </div>
    <textarea class="pb-textarea" id="pb-log-notatka" rows="2" placeholder="Notatka (opcjonalnie)" style="margin-top:8px;"></textarea>
    <button class="pb-btn" onclick="pbLogSet()">Zapisz serię</button>
    <button class="pb-btn" onclick="pbZakonczTrening()">Zakończ trening (+20 XP Ciało)</button>
    <div id="pb-plateau-warning"></div>
  </div>

  <!-- ===== WIDOK: POSTAĆ (Karta Postaci, sekcja 6.6) ===== -->
  <div id="pb-view-postac" style="display:none;">
    <div id="pb-postac-body"><div style="color:var(--pb-green-dim);">Ładowanie karty postaci…</div></div>
  </div>

  <!-- ===== WIDOK: DASHBOARD (sekcja 6.13) ===== -->
  <div id="pb-view-dashboard" style="display:none;">
    <div class="pb-tabs" style="margin-bottom:12px;">
      <button class="pb-tab active" id="pb-dash-sub-ogolny" onclick="pbDashSwitchSub('ogolny')">OGÓLNY</button>
      <button class="pb-tab" id="pb-dash-sub-trening" onclick="pbDashSwitchSub('trening')">TRENING</button>
      <button class="pb-tab" id="pb-dash-sub-dieta" onclick="pbDashSwitchSub('dieta')">DIETA / UMYSŁ</button>
      <button class="pb-tab" id="pb-dash-sub-sen" onclick="pbDashSwitchSub('sen')">SEN / NASTRÓJ</button>
      <button class="pb-tab" id="pb-dash-sub-dom" onclick="pbDashSwitchSub('dom')">DOM</button>
      <button class="pb-tab disabled">PORTFOLIO <span class="pb-tab-note">(Faza 3)</span></button>
    </div>
    <div id="pb-dashboard-body"><div style="color:var(--pb-green-dim);">Ładowanie dashboardu…</div></div>
  </div>

  <div class="pb-settings-row">
    <span>Efekty CRT</span>
    <div class="pb-segmented" id="pb-crt-seg">
      <button data-level="low" class="active" onclick="pbSetCrtLevel('low')">LOW</button>
      <button data-level="medium" onclick="pbSetCrtLevel('medium')">MEDIUM</button>
      <button data-level="ultra" onclick="pbSetCrtLevel('ultra')">ULTRA</button>
    </div>
  </div>
  <div class="pb-settings-row">
    <span>Rozmiar tekstu</span>
    <div class="pb-segmented" id="pb-font-seg">
      <button data-scale="0.9" onclick="pbSetFontScale(0.9)">A-</button>
      <button data-scale="1" class="active" onclick="pbSetFontScale(1)">A</button>
      <button data-scale="1.2" onclick="pbSetFontScale(1.2)">A+</button>
      <button data-scale="1.4" onclick="pbSetFontScale(1.4)">A++</button>
    </div>
  </div>
</div>

<script>
let PB_DAY = null;
let PB_PLAN = null;

function initModule() {
  pbLoadSettings();
  pbLoadDay();
}

function pbToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ---- Przełączanie wewnętrznych widoków Pip-Boy (sekcja 6.2) ----
function pbSwitchTab(tab) {
  ['dzien', 'trening', 'postac', 'dashboard'].forEach(function(t) {
    document.getElementById('pb-view-' + t).style.display = (t === tab) ? 'block' : 'none';
    document.getElementById('pb-tab-' + t).classList.toggle('active', t === tab);
  });
  const titles = { dzien: 'WIDOK DNIA', trening: 'TRENING', postac: 'KARTA POSTACI', dashboard: 'DASHBOARD' };
  document.getElementById('pb-view-title').textContent = titles[tab];
  if (tab === 'trening' && !PB_PLAN) pbLoadTrainingPlan();
  if (tab === 'postac') pbLoadKartaPostaci();
  if (tab === 'dashboard') pbLoadDashboard();
}

function pbLoadDay() {
  const dataStr = pbToday();
  document.getElementById('pb-date-label').textContent = dataStr;
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result.success) { showError('Pip-Boy: ' + result.error); return; }
      PB_DAY = result.data;
      pbRenderHP(result.data.hp);
      pbRenderGodMode(result.data.godModeAktywny);
      pbRenderQuote(result.data.cytatDnia);
      pbRenderBlocks(result.data);
      pbRenderPrzypomnienia(result.data.przypomnieniaAktywne);
      pbLoadMarquee();
    })
    .withFailureHandler(function(err) { showError('Błąd ładowania Pip-Boy: ' + err.message); })
    .getPipBoyDzien(dataStr);
}

function pbRenderHP(hp) {
  const fill = document.getElementById('pb-hp-fill');
  fill.style.width = hp + '%';
  fill.className = 'pb-hp-fill' + (hp <= 10 ? ' crit' : hp <= 25 ? ' warn' : '');
  document.getElementById('pb-hp-value').textContent = hp + '%';
}

function pbRenderGodMode(aktywny) {
  const btn = document.getElementById('pb-godmode-btn');
  btn.textContent = 'GOD_MODE_24H: ' + (aktywny ? 'ON' : 'OFF');
  btn.classList.toggle('on', !!aktywny);
}

function pbRenderQuote(cytat) {
  if (!cytat) return;
  document.getElementById('pb-quote').style.display = 'block';
  document.getElementById('pb-quote-text').textContent = '"' + cytat.tresc + '"';
  document.getElementById('pb-quote-author').textContent = '— ' + (cytat.autor || 'nieznany autor');
}

function pbLoadMarquee() {
  const kontekst = { pora: pbCurrentPora(), god_mode_aktywny: PB_DAY.godModeAktywny ? 'tak' : 'nie' };
  google.script.run
    .withSuccessHandler(function(result) {
      const track = document.getElementById('pb-marquee-track');
      if (result.success && result.data.length > 0) {
        track.textContent = result.data.map(function(m){ return m.tresc; }).join('     •     ');
      } else {
        track.textContent = 'Pip-Boy gotowy do pracy.';
      }
    })
    .withFailureHandler(function() {})
    .getMarqueeKomunikaty(kontekst);
}

function pbRenderPrzypomnienia(lista) {
  const el = document.getElementById('pb-przypomnienia');
  if (!lista || lista.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = lista.map(function(p) {
    return '<div class="pb-check-row" style="border:1px solid var(--pb-green-faint); border-radius:6px; padding:6px 10px;" onclick="pbOznaczPrzypomnienie(\'' + p.klucz + '\')">' +
      '<span class="pb-check-mark">[!]</span><span>' + p.nazwa + ' — kliknij, gdy zrobione (cykl ' + p.cyklDni + ' dni)</span></div>';
  }).join('');
}
function pbOznaczPrzypomnienie(klucz) {
  google.script.run.withSuccessHandler(function(result) {
    if (result.success) { showSuccess('Odnotowano.'); pbLoadDay(); } else showError(result.error);
  }).oznaczPrzypomnienieWykonane(klucz, pbToday());
}

function pbCurrentPora() {
  const h = new Date().getHours();
  return h < 12 ? 'rano' : (h < 18 ? 'popoludnie' : 'wieczor');
}

function pbBlockStatus(blok, dane) {
  if (blok.modul === 'suplementy') {
    const dzieci = blok.dzieci || [];
    const wykonane = dzieci.filter(function(k){
      const w = dane.suplementyLog.find(function(r){ return r.klucz === k; });
      return w && (w.wykonano === true || w.wykonano === 'true' || w.wykonano === 'TRUE');
    });
    return wykonane.length === dzieci.length && dzieci.length > 0;
  }
  if (blok.modul === 'dieta') {
    const w = dane.posilkiLog.find(function(r){ return Number(r.numer) === blok.numer; });
    return !!(w && (w.wykonano === true || w.wykonano === 'true' || w.wykonano === 'TRUE'));
  }
  if (blok.modul === 'mood') {
    return dane.moodLog.some(function(r){ return r.pora === blok.pora; });
  }
  if (blok.modul === 'rozciaganie' || blok.modul === 'sen') {
    const w = dane.dziennyLog.find(function(r){ return r.modul === blok.modul; });
    return !!(w && (w.wykonano === true || w.wykonano === 'true' || w.wykonano === 'TRUE'));
  }
  if (blok.modul === 'pielegnacja') {
    const dzieci = blok.dzieci || [];
    if (dzieci.length === 0) return false;
    return dzieci.every(function(k){
      const w = dane.pielegnacjaLog.find(function(r){ return r.produkt === k; });
      return w && (w.wykonano === true || w.wykonano === 'true' || w.wykonano === 'TRUE');
    });
  }
  if (blok.modul === 'sprzatanie') {
    const min = (dane.sprzatanieLog || []).reduce(function(s, r){ return s + (Number(r.minuty) || 0); }, 0);
    return min >= 15;
  }
  if (blok.modul === 'czytelnictwo') {
    const min = (dane.czytelnictwoLog || []).reduce(function(s, r){ return s + (Number(r.minuty) || 0); }, 0);
    return min > 0;
  }
  if (blok.modul === 'spacer') { return (dane.spacerLog || []).length > 0; }
  if (blok.modul === 'natura') { return (dane.naturaLog || []).length > 0; }
  if (blok.modul === 'zakupy') { return (dane.zakupyLog || []).length > 0; }
  if (blok.modul === 'czas_wolny') { return (dane.czasWolnyLog || []).length > 0; }
  return false;
}

function pbRenderBlocks(dane) {
  const el = document.getElementById('pb-blocks');
  el.innerHTML = dane.bloki.map(function(blok, idx) {
    const done = pbBlockStatus(blok, dane);
    const obl = blok.obligatoryjne;
    const marker = done ? '+' : (obl ? 'o' : '·');
    const bracket = obl ? ['[',']'] : ['(',')'];
    const trescBlokowa = (blok.modul === 'trening')
      ? '<span style="color:var(--pb-green-dim); text-decoration:underline; cursor:pointer;" onclick="event.stopPropagation(); pbSwitchTab(\'trening\')">' + blok.nazwa + ' → zakładka TRENING</span>'
      : blok.nazwa;
    return (
      '<div class="pb-block ' + (obl ? 'obligatoryjne' : 'opcjonalne') + (done ? ' done' : '') + '" id="pb-block-' + idx + '">' +
        '<div class="pb-block-head" onclick="pbToggleExpand(' + idx + ')">' +
          '<span class="pb-block-marker">' + bracket[0] + marker + bracket[1] + '</span>' +
          '<span class="pb-block-name">' + trescBlokowa + '</span>' +
          '<span class="pb-block-tag">' + (obl ? 'OBLIGATORYJNE' : 'opcjonalne') + '</span>' +
          '<span class="pb-block-chevron">›</span>' +
        '</div>' +
        '<div class="pb-block-body">' + pbBlockBody(blok, dane) + '</div>' +
      '</div>'
    );
  }).join('');
}

function pbBlockBody(blok, dane) {
  if (blok.modul === 'suplementy') {
    return (blok.dzieci || []).map(function(klucz) {
      const w = dane.suplementyLog.find(function(r){ return r.klucz === klucz; });
      const done = !!(w && (w.wykonano === true || w.wykonano === 'true' || w.wykonano === 'TRUE'));
      const nazwa = pbSuplementNazwa(klucz);
      return '<div class="pb-check-row" onclick="pbToggleSuplement(\'' + klucz + '\', ' + (!done) + ')">' +
        '<span class="pb-check-mark">' + (done ? '[x]' : '[ ]') + '</span><span>' + nazwa + '</span></div>';
    }).join('') || '<span style="color:var(--pb-green-dim)">Brak pozycji.</span>';
  }
  if (blok.modul === 'dieta') {
    const done = pbBlockStatus(blok, dane);
    return '<div class="pb-check-row" onclick="pbToggleMeal(' + blok.numer + ', ' + (!done) + ')">' +
      '<span class="pb-check-mark">' + (done ? '[x]' : '[ ]') + '</span><span>Zjedzone</span></div>';
  }
  if (blok.modul === 'mood') {
    return pbMoodForm(blok, dane);
  }
  if (blok.modul === 'rozciaganie' || blok.modul === 'sen') {
    const done = pbBlockStatus(blok, dane);
    const note = '<div style="color:var(--pb-green-faint); font-size:0.72em; margin-top:4px;">Bez kary HP na razie — kalibracja tego modułu czeka na Arka (luka w sekcji 4.2 dokumentu).</div>';
    return '<div class="pb-check-row" onclick="pbToggleLogDzienny(\'' + blok.modul + '\', ' + (!done) + ')">' +
      '<span class="pb-check-mark">' + (done ? '[x]' : '[ ]') + '</span><span>Wykonane</span></div>' + note;
  }
  if (blok.modul === 'trening' || blok.klucz === 'praca') {
    return '<span style="color:var(--pb-green-dim)">' + (blok.modul === 'trening' ? 'Otwórz zakładkę TRENING, żeby zalogować sesję.' : 'Szczegółowy tracking (RCP) — Faza 2.') + '</span>';
  }
  if (blok.modul === 'pielegnacja') {
    return (blok.dzieci || []).map(function(klucz) {
      const w = dane.pielegnacjaLog.find(function(r){ return r.produkt === klucz; });
      const done = !!(w && (w.wykonano === true || w.wykonano === 'true' || w.wykonano === 'TRUE'));
      return '<div class="pb-check-row" onclick="pbTogglePielegnacja(\'' + klucz + '\', ' + (!done) + ')">' +
        '<span class="pb-check-mark">' + (done ? '[x]' : '[ ]') + '</span><span>' + pbPielegnacjaNazwa(klucz) + '</span></div>';
    }).join('') + '<div style="color:var(--pb-green-faint); font-size:0.72em; margin-top:4px;">Bez kary HP — stały slot w harmonogramie, ale bez presji (sekcja Moduł 7).</div>';
  }
  if (blok.modul === 'sprzatanie') {
    const min = (dane.sprzatanieLog || []).reduce(function(s, r){ return s + (Number(r.minuty) || 0); }, 0);
    return '<div style="font-size:0.85em; margin-bottom:6px;">Dziś: ' + min + ' / 15 min floor (sufit 60 min, #sprzątanie)</div>' +
      '<button class="pb-btn" onclick="pbAddSprzatanie(15)">+15 min</button> ' +
      '<button class="pb-btn" onclick="pbAddSprzatanie(30)">+30 min</button>';
  }
  if (blok.modul === 'czytelnictwo') {
    const min = (dane.czytelnictwoLog || []).reduce(function(s, r){ return s + (Number(r.minuty) || 0); }, 0);
    return '<div style="font-size:0.85em; margin-bottom:6px;">Dziś: ' + min + ' / 60 min</div>' +
      '<input class="pb-input" id="pb-czyt-minuty" type="number" placeholder="minuty" style="width:100px; display:inline-block;">' +
      '<input class="pb-input" id="pb-czyt-tytul" type="text" placeholder="tytuł (opcjonalnie)" style="width:auto; display:inline-block;">' +
      '<label style="font-size:0.82em; margin-left:6px;"><input type="checkbox" id="pb-czyt-ukonczono"> ukończona pozycja</label>' +
      '<button class="pb-btn" onclick="pbSaveCzytelnictwo()">Zapisz</button>';
  }
  if (blok.modul === 'spacer') {
    const zrobione = (dane.spacerLog || []).length;
    return '<div style="font-size:0.85em; margin-bottom:6px;">Dziś: ' + zrobione + ' spacer(y)</div>' +
      '<button class="pb-btn" onclick="pbToggleSpacer()">+1 spacer</button>' +
      '<div style="color:var(--pb-green-faint); font-size:0.72em; margin-top:4px;">Bez przypomnienia — świadoma decyzja (Moduł 6). Zalicza też kontakt z naturą.</div>';
  }
  if (blok.modul === 'natura') {
    const done = pbBlockStatus(blok, dane);
    return '<div class="pb-check-row" onclick="' + (done ? 'pbNoop()' : 'pbToggleNatura()') + '">' +
      '<span class="pb-check-mark">' + (done ? '[x]' : '[ ]') + '</span><span>' + (done ? 'Zaliczone dziś' : 'Zaznacz') + '</span></div>';
  }
  if (blok.modul === 'zakupy') {
    const rek = dane.zakupyRekomendacje || {};
    return Object.keys(rek).map(function(kat) {
      const pozycje = rek[kat].core.concat([rek[kat].rotacyjna]);
      return '<div style="margin-bottom:6px;"><b style="font-size:0.85em;">' + kat + '</b><br>' +
        pozycje.map(function(p){ return '<span class="pb-block-tag" style="margin:2px;">' + p + '</span>'; }).join('') + '</div>';
    }).join('') + '<div style="color:var(--pb-green-faint); font-size:0.72em;">Sprawdź gazetkę Aldi przed wyjściem (brak API — ręczne przypomnienie).</div>';
  }
  if (blok.modul === 'czas_wolny') {
    return '<input class="pb-input" id="pb-cw-minuty-' + blok.klucz + '" type="number" placeholder="minuty" style="width:100px; display:inline-block;">' +
      '<input class="pb-input" id="pb-cw-forma-' + blok.klucz + '" type="text" placeholder="forma (opcjonalnie)" style="width:auto; display:inline-block;">' +
      '<button class="pb-btn" onclick="pbSaveCzasWolny(\'' + blok.klucz + '\')">Zapisz</button>';
  }
  return '<div class="pb-check-row" onclick="pbNoop()"><span style="color:var(--pb-green-dim)">Bez dodatkowego trackingu w Fazie 1.</span></div>';
}

function pbSuplementNazwa(klucz) {
  const rdzenne = PIPBOY_SUPLEMENTY_RDZENNE_CLIENT;
  const found = rdzenne.find(function(s){ return s.klucz === klucz; });
  if (found) return found.nazwa;
  if (klucz === 'melatonina') return 'Melatonina (opcjonalna, bez kary)';
  if (klucz === 'gainer') return 'KFD X Gainer';
  return klucz;
}
// Kopia nazw suplementów po stronie klienta (dane źródłowe: PipBoyData.gs)
const PIPBOY_SUPLEMENTY_RDZENNE_CLIENT = [
  { klucz: 'kreatyna', nazwa: 'Kreatyna' },
  { klucz: 'vita_pak', nazwa: 'KFD Vita Pak' },
  { klucz: 'kolagen', nazwa: 'KFD Kolagen Plus' },
  { klucz: 'omega3', nazwa: 'KFD Ultra Omega 3 Plus' },
];

const PIPBOY_PIELEGNACJA_NAZWY_CLIENT = {
  krem_twarzy_rano: 'Krem do twarzy', guma_wlosy: 'Guma do włosów', krem_rak_1: 'Krem do rąk (1/2)',
  krem_twarzy_wieczor: 'Krem do twarzy', krem_rak_2: 'Krem do rąk (2/2)',
  ziaja: 'Preparat Ziaja (pocenie)', nizoral: 'Szampon Nizoral',
};
function pbPielegnacjaNazwa(klucz) { return PIPBOY_PIELEGNACJA_NAZWY_CLIENT[klucz] || klucz; }

function pbTogglePielegnacja(produkt, wartosc) {
  google.script.run.withSuccessHandler(function(){ pbLoadDay(); }).togglePielegnacja(pbToday(), produkt, wartosc);
}
function pbAddSprzatanie(minuty) {

  const gi = existing.gi || '';
  const followUp = gi && Number(gi) > 0 && Number(gi) <= 4;
  let html = '<div class="pb-mood-grid">' +
    pbMoodSlider('nastroj', 'Nastrój ogólny', existing.nastroj) +

    pbMoodSlider('sen', 'Jakość snu', existing.sen);

            pbMoodSlider('gi', 'Stan żołądkowo-jelitowy', existing.gi);
  }
  html += '</div>';
  if (pelny) {
    html += '<div class="pb-gi-followup" id="pb-gi-followup-' + blok.pora + '" style="display:' + (followUp ? 'block' : 'none') + '">' +
      '<label style="color:var(--pb-green-dim); font-size:0.82em;">GI ≤4/10 — co jadłeś w ciągu ostatnich 48h?</label>' +
      '<textarea class="pb-textarea" id="pb-gi-text-' + blok.pora + '" rows="3">' + (existing.notatka_gi_followup || '') + '</textarea>' +
    '</div>';

function pbLoadTrainingPlan() {
  google.script.run.withSuccessHandler(function(result) {
    if (!result.success) { showError(result.error); return; }
    PB_PLAN = result.data;
    pbRenderTrainingPlan();
  }).getTrainingPlan();
}

function pbRenderTrainingPlan() {
  const el = document.getElementById('pb-trening-plany');
  const typy = ['A', 'B'];
  el.innerHTML = typy.map(function(typ) {
    const cwiczenia = PB_PLAN.filter(function(p){ return p.trening_typ === typ; });
    return '<div class="pb-block obligatoryjne expanded"><div class="pb-block-head"><span class="pb-block-name">TRENING ' + typ + '</span></div><div class="pb-block-body">' +
      cwiczenia.map(function(c) {
        return '<div class="pb-check-row" style="cursor:default;"><span style="flex:1;">' + c.cwiczenie + '</span>' +
          '<span style="color:var(--pb-green-dim); font-size:0.85em;">' + c.serie_docelowe + '×' + c.powtorzenia_zakres + ', przerwa ' + c.przerwa_sek + 's</span>' +
          '<button class="pb-btn" style="margin:0 0 0 8px; padding:3px 8px;" onclick="pbEditExercise(\'' + typ + '\', ' + c.kolejnosc + ')">edytuj</button></div>';
      }).join('') +
      '</div></div>';
  }).join('');

  const select = document.getElementById('pb-log-cwiczenie');
  const wszystkie = PB_PLAN.map(function(p){ return p.cwiczenie; });
  select.innerHTML = wszystkie.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');
}

function pbEditExercise(typ, kolejnosc) {
  const c = PB_PLAN.find(function(p){ return p.trening_typ === typ && Number(p.kolejnosc) === kolejnosc; });
  const nazwa = prompt('Nazwa ćwiczenia:', c.cwiczenie);
  if (nazwa === null) return;
  const serie = prompt('Liczba serii:', c.serie_docelowe);
  if (serie === null) return;
  const powt = prompt('Zakres powtórzeń:', c.powtorzenia_zakres);
  if (powt === null) return;
  const przerwa = prompt('Przerwa (sek):', c.przerwa_sek);
  if (przerwa === null) return;
  google.script.run.withSuccessHandler(function(result) {
    if (result.success) { showSuccess('Zapisano.'); pbLoadTrainingPlan(); } else showError(result.error);
  }).updateTrainingExercise(typ, kolejnosc, { cwiczenie: nazwa, serie_docelowe: serie, powtorzenia_zakres: powt, przerwa_sek: przerwa });
}

function pbOnStatusChange() {
  const status = pbVal('pb-log-status');
  const show = status === 'zmodyfikowana';
  document.getElementById('pb-log-powod-label').style.display = show ? 'block' : 'none';
  document.getElementById('pb-log-powod').style.display = show ? 'block' : 'none';
}

function pbLogSet() {
  const status = pbVal('pb-log-status');
  const cwiczenie = pbVal('pb-log-cwiczenie');
  // treningTyp (A/B) wyznaczany z planu na podstawie wybranego ćwiczenia —
  // puste dla ćwiczeń ad-hoc spoza planu startowego.
  const planRow = (PB_PLAN || []).find(function(p) { return p.cwiczenie === cwiczenie; });
  const treningTyp = planRow ? planRow.trening_typ : '';
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result.success) { showError(result.error); return; }
      showSuccess(result.nowyRekord ? 'Zapisano — nowy rekord! (+10 XP Ciało)' : 'Seria zapisana.');
      google.script.run.withSuccessHandler(function(r) {
        const box = document.getElementById('pb-plateau-warning');
        box.innerHTML = (r.success && r.plateau && r.plateau.plateau)
          ? '<div class="pb-quote" style="border-color: var(--pb-amber); color: var(--pb-amber);">' + r.plateau.sugestia + '</div>' : '';
      }).getTrainingHistory(cwiczenie);
    })
    // UWAGA (poprawka w tej turze): to wywołanie pomijało parametr treningTyp,
    // przez co wszystkie kolejne argumenty przesuwały się o jedno miejsce
    // względem sygnatury backendu (logTrainingSet w PipBoy.gs) — ciężar
    // trafiał do pola oceny sesji, ocena do notatki itd. Naprawione.
    .logTrainingSet(pbToday(), treningTyp, status, pbVal('pb-log-powod'), cwiczenie,
      pbVal('pb-log-seria'), pbVal('pb-log-powt'), pbVal('pb-log-ciezar'), pbVal('pb-log-ocena'), pbVal('pb-log-notatka'));
}

function pbZakonczTrening() {
  google.script.run.withSuccessHandler(function(result) {
    if (result.success) { showSuccess('Trening zakończony (+20 XP Ciało).'); pbLoadDay(); } else showError(result.error);
  }).zakonczTrening(pbToday(), '', '');
}

const PB_ATRYBUT_LABEL = { cialo: 'CIAŁO', umysl: 'UMYSŁ', dyscyplina: 'DYSCYPLINA', otoczenie: 'OTOCZENIE', personal_brand: 'PERSONAL BRAND' };

function pbRenderKartaPostaci(dane) {
  const el = document.getElementById('pb-postac-body');
  let html = '<div class="pb-eyebrow">POZIOM OGÓLNY</div>' +
    '<div class="pb-title" style="font-size:1.6em;">' + dane.poziomOgolny.poziom + '</div>' +
    '<div style="color:var(--pb-green-dim); font-size:0.85em; margin-bottom:16px;">' + dane.poziomOgolny.xpWPoziomie + ' / ' + dane.poziomOgolny.xpDoNastepnego + ' XP do poziomu ' + (dane.poziomOgolny.poziom + 1) + ' — łącznie ' + dane.sumaXP + ' XP</div>';

  html += Object.keys(dane.atrybuty).map(function(a) {
    const at = dane.atrybuty[a];
    const pct = Math.round(100 * at.xpWPoziomie / (at.xpDoNastepnego || 1));
    return '<div style="margin-bottom:10px;">' +
      '<div style="display:flex; justify-content:space-between; font-size:0.85em;"><span>' + PB_ATRYBUT_LABEL[a] + '</span><span>poz. ' + at.poziom + '</span></div>' +
      '<div class="pb-hp-track" style="height:10px;"><div class="pb-hp-fill" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }).join('');

  html += '<div class="pb-eyebrow" style="margin-top:18px;">ODZNAKI (' + dane.odznakiZdobyte.length + ' / ' + dane.odznakiLacznie + ')</div>';
  if (dane.odznakiZdobyte.length === 0) {
    html += '<div style="color:var(--pb-green-dim); font-size:0.85em;">Jeszcze żadnej — pierwsza pojawi się po pełnym dniu suplementacji, posiłków lub mood checku.</div>';
  } else {
    html += dane.odznakiZdobyte.map(function(o) {
      return '<div class="pb-check-row" style="cursor:default;"><span class="pb-check-mark">[' + o.typ + ']</span><span>' + o.nazwa + '</span></div>';
    }).join('');
  }
  html += '<div style="color:var(--pb-green-faint); font-size:0.72em; margin-top:10px;">Ewaluacja obejmuje ~39 z 208 odznak — te, których warunek jest jednoznacznie obliczalny z zebranych już danych (streaki, progi łączne, liczniki). Odznaki sekretne, subiektywne i zależne od jeszcze niezbudowanych modułów (Portfolio, BJJ) czekają na Fazę 2+.</div>';

  el.innerHTML = html;
}

const PB_GREEN = '#3dff3d', PB_GREEN_DIM = '#1f8a1f', PB_AMBER = '#ffb000', PB_RED = '#ff4d3d';
let PB_DASH_DATA = null;
let PB_DASH_SUB = 'ogolny';
const PB_CHART_INSTANCES = {}; // canvasId -> Chart, żeby niszczyć przed ponownym rysowaniem

function pbLoadDashboard() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result.success) { showError('Dashboard: ' + result.error); return; }
      PB_DASH_DATA = result.data;
      pbRenderDashboardPanel(PB_DASH_SUB);
    })
    .withFailureHandler(function(err) { showError('Błąd ładowania dashboardu: ' + err.message); })
    .getDashboardData();
}

function pbDashSwitchSub(sub) {
  PB_DASH_SUB = sub;
  ['ogolny', 'trening', 'dieta', 'sen', 'dom'].forEach(function(s) {
    document.getElementById('pb-dash-sub-' + s).classList.toggle('active', s === sub);
  });
  if (PB_DASH_DATA) pbRenderDashboardPanel(sub);
}

function pbChartCanvas(id, height) {
  return '<canvas id="' + id + '" height="' + (height || 160) + '"></canvas>';
}

function pbMakeChart(canvasId, config) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  if (PB_CHART_INSTANCES[canvasId]) { PB_CHART_INSTANCES[canvasId].destroy(); }
  PB_CHART_INSTANCES[canvasId] = new Chart(el.getContext('2d'), config);
}

function pbChartDefaults() {
  return {
    scales: {
      x: { ticks: { color: PB_GREEN_DIM, font: { size: 10 } }, grid: { color: 'rgba(61,255,61,0.08)' } },
      y: { ticks: { color: PB_GREEN_DIM, font: { size: 10 } }, grid: { color: 'rgba(61,255,61,0.08)' } }
    },
    plugins: { legend: { labels: { color: PB_GREEN_DIM, font: { size: 10 } } } }
  };
}

function pbRenderDashboardPanel(sub) {
  const el = document.getElementById('pb-dashboard-body');
  const d = PB_DASH_DATA;
  if (!d) { el.innerHTML = '<div style="color:var(--pb-green-dim);">Brak danych.</div>'; return; }

  if (sub === 'ogolny') {
    el.innerHTML =
      '<div class="pb-mood-grid" style="grid-template-columns: 1fr 1fr 1fr; margin-bottom:14px;">' +
        '<div><div class="pb-eyebrow">STREAK</div><div class="pb-title" style="font-size:1.6em;">' + d.streak + ' dni</div></div>' +
        '<div><div class="pb-eyebrow">POZIOM OGÓLNY</div><div class="pb-title" style="font-size:1.6em;">' + d.poziomOgolny.poziom + '</div></div>' +
        '<div><div class="pb-eyebrow">ODZNAKI</div><div class="pb-title" style="font-size:1.6em;">' + d.odznakiZdobyteLiczba + ' / ' + d.odznakiLacznie + '</div></div>' +
      '</div>' +
      '<div class="pb-eyebrow">TREND HP (ostatnie ' + d.trendHp.length + ' zapisanych dni)</div>' +
      pbChartCanvas('pb-chart-hp') +
      '<div class="pb-eyebrow" style="margin-top:18px;">ROZKŁAD XP WG ATRYBUTU (łącznie ' + d.sumaXP + ' XP)</div>' +
      pbChartCanvas('pb-chart-atrybuty');

    pbMakeChart('pb-chart-hp', {
      type: 'line',
      data: {
        labels: d.trendHp.map(function(r) { return r.data.slice(5); }),
        datasets: [{ label: 'HP %', data: d.trendHp.map(function(r) { return Number(r.hp_procent); }),
          borderColor: PB_GREEN, backgroundColor: 'rgba(61,255,61,0.12)', fill: true, tension: 0.2, pointRadius: 2 }]
      },
      options: Object.assign(pbChartDefaults(), { scales: Object.assign(pbChartDefaults().scales, { y: Object.assign(pbChartDefaults().scales.y, { min: 0, max: 100 }) } ) })
    });

    const atrybutyLabels = Object.keys(d.atrybuty);
    pbMakeChart('pb-chart-atrybuty', {
      type: 'bar',
      data: {
        labels: atrybutyLabels.map(function(a) { return PB_ATRYBUT_LABEL[a] || a; }),
        datasets: [{ label: 'XP', data: atrybutyLabels.map(function(a) { return d.atrybuty[a]; }),
          backgroundColor: PB_GREEN_DIM, borderColor: PB_GREEN, borderWidth: 1 }]
      },
      options: Object.assign(pbChartDefaults(), { plugins: { legend: { display: false } } })
    });
    return;
  }

  if (sub === 'trening') {
    const cwiczenia = Object.keys(d.cwiczenia || {});
    if (cwiczenia.length === 0) {
      el.innerHTML = '<div style="color:var(--pb-green-dim); font-size:0.85em;">Brak jeszcze zalogowanych pełnych sesji ("pelna") — wykresy progresji ciężaru pojawią się po pierwszych wpisach w zakładce TRENING.</div>';
      return;
    }
    el.innerHTML = '<div class="pb-eyebrow">PROGRESJA CIĘŻARU — wybierz ćwiczenie</div>' +
      '<select class="pb-input" id="pb-dash-cwiczenie" onchange="pbRenderTreningChart()">' +
        cwiczenia.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('') +
      '</select>' + pbChartCanvas('pb-chart-trening');
    pbRenderTreningChart();
    return;
  }

  if (sub === 'dieta') {
    el.innerHTML = '<div class="pb-eyebrow">ŚREDNIA 7-DNIOWA CZYTELNICTWA (Moduł 20, cel: ≥55 min)</div>' +
      pbChartCanvas('pb-chart-czyt') +
      '<div style="color:var(--pb-green-faint); font-size:0.72em; margin-top:10px;">Wykres suplementów/diety per-dzień — do Fazy 2+; tu widoczny na razie sam wskaźnik czytelnictwa jako proxy „umysł" (Moduł 20 już zbiera te dane).</div>';
    if (!d.rollingCzyt || d.rollingCzyt.length === 0) {
      document.getElementById('pb-chart-czyt').outerHTML = '<div style="color:var(--pb-green-dim); font-size:0.85em;">Brak jeszcze danych czytelnictwa.</div>';
      return;
    }
    pbMakeChart('pb-chart-czyt', {
      type: 'line',
      data: {
        labels: d.rollingCzyt.map(function(r) { return r.data.slice(5); }),
        datasets: [{ label: 'śr. 7-dniowa (min)', data: d.rollingCzyt.map(function(r) { return Number(r.srednia_7dni); }),
          borderColor: PB_AMBER, backgroundColor: 'rgba(255,176,0,0.1)', fill: true, tension: 0.2, pointRadius: 2 }]
      },
      options: pbChartDefaults()
    });
    return;
  }

  if (sub === 'sen') {
    if (!d.moodRows || d.moodRows.length === 0) {
      el.innerHTML = '<div style="color:var(--pb-green-dim); font-size:0.85em;">Brak jeszcze wpisów mood checku.</div>';
      return;
    }
    el.innerHTML = '<div class="pb-eyebrow">TREND NASTRÓJ / ENERGIA / SEN (ostatnie wpisy)</div>' + pbChartCanvas('pb-chart-mood');
    const wieczorne = d.moodRows.filter(function(r) { return r.pora === 'wieczor'; });
    pbMakeChart('pb-chart-mood', {
      type: 'line',
      data: {
        labels: wieczorne.map(function(r) { return r.data.slice(5); }),
        datasets: [
          { label: 'Nastrój', data: wieczorne.map(function(r) { return Number(r.nastroj) || null; }), borderColor: PB_GREEN, tension: 0.2, pointRadius: 2 },
          { label: 'Energia', data: wieczorne.map(function(r) { return Number(r.energia) || null; }), borderColor: PB_AMBER, tension: 0.2, pointRadius: 2 },
          { label: 'Sen', data: wieczorne.map(function(r) { return Number(r.sen) || null; }), borderColor: PB_RED, tension: 0.2, pointRadius: 2 }
        ]
      },
      options: Object.assign(pbChartDefaults(), { scales: Object.assign(pbChartDefaults().scales, { y: Object.assign(pbChartDefaults().scales.y, { min: 0, max: 10 }) }) })
    });
    return;
  }

  if (sub === 'dom') {
    el.innerHTML = '<div class="pb-eyebrow">SPRZĄTANIE — MINUTY / DZIEŃ (ostatnie 30 dni, floor 15 / sufit 60)</div>' + pbChartCanvas('pb-chart-sprzatanie');
    pbMakeChart('pb-chart-sprzatanie', {
      type: 'bar',
      data: {
        labels: d.sprzatanieTrend.map(function(r) { return r.data.slice(5); }),
        datasets: [{ label: 'minuty', data: d.sprzatanieTrend.map(function(r) { return r.minuty; }),
          backgroundColor: d.sprzatanieTrend.map(function(r) { return r.minuty >= 15 ? PB_GREEN_DIM : PB_RED; }) }]
      },
      options: Object.assign(pbChartDefaults(), { plugins: { legend: { display: false } } })
    });
    return;
  }
}

function pbRenderTreningChart() {
  const cwiczenie = pbVal('pb-dash-cwiczenie');
  const seria = (PB_DASH_DATA.cwiczenia[cwiczenie] || []).slice().sort(function(a, b) { return a.data < b.data ? -1 : 1; });
  pbMakeChart('pb-chart-trening', {
    type: 'line',
    data: {
      labels: seria.map(function(r) { return r.data.slice(5); }),
      datasets: [{ label: cwiczenie + ' (kg)', data: seria.map(function(r) { return r.ciezarKg; }),
        borderColor: PB_GREEN, backgroundColor: 'rgba(61,255,61,0.12)', fill: true, tension: 0.15, pointRadius: 3 }]
    },
    options: pbChartDefaults()
  });
}
</script>
