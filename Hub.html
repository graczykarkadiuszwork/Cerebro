<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEREBRO</title>
</head>
<body>
<style>
  /* ==========================================================================
     PALETA — Alabaster Grey / Lime Yellow / Royal Orchid.
     Szary = kolor dominujący (tło paneli, obramowania, tekst).
     Limonka = wyłącznie linie/dekoracja (pierścień rdzenia, akcenty tekstu),
     nigdy stan interakcji.
     Orchid = jedyny kolor podkreślający funkcję — najechanie/fokus na
     przyciskach i węzłach koła.
     ========================================================================== */
  :root{
    --void:        #060508;
    --void-2:      #100b16;
    --panel:       rgba(24,20,28,.82);
    --panel-edge:  rgba(220,220,220,.22);   /* Alabaster Grey */
    --accent:      #dcff2a;                 /* Lime Yellow — RCP / primär */
    --accent-dim:  #626e10;
    --accent-glow: rgba(220,255,42,.45);
    --accent2:      #aa1ab1;                /* Royal Orchid — BatCave / gated */
    --accent2-dim:  #4a0c4e;
    --accent2-glow: rgba(170,26,177,.5);
    --text:        #dcdcdc;                 /* Alabaster Grey */
    --text-dim:    #8c8c90;
    --danger:      #ff5d6c;
    --success:     #58e0a0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% 115%, var(--void-2), var(--void) 60%);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  /* ---------- ambient backdrop ---------- */
  #stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding-bottom:8vh;
  }
  #stage::before{
    content:'';
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px);
    pointer-events:none;
  }

  /* ---------- top chrome (fullscreen / minimize / close) ---------- */
  #chrome{
    position:fixed; top:16px; right:18px;
    display:flex; gap:8px; z-index:80;
  }
  .chrome-btn{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:6px;
    color:var(--text-dim);
    cursor:pointer;
    transition:color .15s, border-color .15s, box-shadow .15s;
  }
  .chrome-btn:hover{ color:var(--accent2); border-color:var(--accent2); box-shadow:0 0 12px var(--accent2-glow); }
  .chrome-btn svg{ width:16px; height:16px; }

  #brand{
    position:fixed; top:18px; left:20px; z-index:80;
    font-weight:700; letter-spacing:.14em; font-size:13px;
    color:var(--text-dim);
    text-transform:uppercase;
  }
  #brand b{ color:var(--accent); }
  #applink{
    position:fixed; bottom:18px; left:20px; z-index:80;
    font-size:12px; color:var(--text-dim); text-decoration:none;
    letter-spacing:.04em;
    border-bottom:1px solid transparent;
    transition:color .15s, border-color .15s;
  }
  #applink:hover{ color:var(--accent2); border-color:var(--accent2); }

  /* ---------- minimized tab ---------- */
  #minitab{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    display:none; align-items:center; gap:8px;
    padding:8px 16px;
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:999px;
    color:var(--text-dim); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    cursor:pointer; z-index:90;
  }
  #minitab:hover{ color:var(--accent2); border-color:var(--accent2); }
  body.minimized #stage, body.minimized #chrome, body.minimized #brand, body.minimized #applink{ display:none; }
  body.minimized #minitab{ display:flex; }

  /* ---------- breadcrumb / title ---------- */
  #crumb{
    position:absolute; top:9vh; left:50%; transform:translateX(-50%);
    text-align:center;
    z-index:5;
  }
  #crumb .path{
    font-size:12px; letter-spacing:.25em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:8px;
  }
  #crumb .path b{ color:var(--accent); }
  #crumb .headline{
    font-size:clamp(22px,4vw,34px); font-weight:300; letter-spacing:.08em;
    text-shadow:0 0 24px var(--accent-glow);
  }

  /* ---------- core emblem ---------- */
  #core{
    position:relative;
    width:118px; height:118px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 35%, rgba(220,255,42,.14), transparent 70%);
    border:1px solid var(--panel-edge);
    box-shadow:0 0 40px rgba(220,255,42,.12), inset 0 0 30px rgba(220,255,42,.06);
    z-index:4;
  }
  #core::before{
    content:'';
    position:absolute; inset:-14px;
    border-radius:50%;
    border:1px dashed var(--accent);
    animation:spin 40s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #core span{ font-size:11px; letter-spacing:.2em; color:var(--accent); text-transform:uppercase; }

  /* ---------- the wheel ---------- */
  #wheel{
    position:absolute; left:50%; bottom:8vh;
    width:1px; height:1px;
    z-index:3;
  }
  .node{
    position:absolute; left:0; top:0;
    width:180px; margin-left:-90px; margin-top:-26px;
    padding:12px 16px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:10px;
    text-align:center;
    cursor:pointer;
    transition:transform .18s ease, border-color .18s, box-shadow .18s, background .18s;
    -webkit-user-select:none; user-select:none;
  }
  .node .label{
    font-size:14px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  }
  .node .sub{
    font-size:11px; color:var(--text-dim); margin-top:3px; letter-spacing:.02em;
  }
  .node:hover, .node:focus-visible{
    border-color:var(--accent2);
    box-shadow:0 0 22px var(--accent2-glow);
    background:rgba(170,26,177,.08);
    transform:scale(1.04);
    outline:none;
  }
  .node.locked .label::before{ content:'🔒 '; }
  .node.loading{ opacity:.5; pointer-events:none; }

  #back{
    position:absolute; top:9vh; left:8vw;
    display:none;
    align-items:center; gap:6px;
    font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--text-dim); cursor:pointer;
    z-index:6;
  }
  #back:hover{ color:var(--accent2); }
  #back.show{ display:flex; }

  /* ---------- centered panel (PIN / messages) ---------- */
  #panel{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(360px,86vw);
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:14px;
    padding:28px 26px;
    text-align:center;
    z-index:20;
    display:none;
    box-shadow:0 0 60px rgba(0,0,0,.5);
  }
  #panel.show{ display:block; }
  #panel h2{
    margin:0 0 6px; font-size:16px; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
  }
  #panel p.hint{ margin:0 0 18px; font-size:12px; color:var(--text-dim); }

  .dots{ display:flex; justify-content:center; gap:14px; margin-bottom:20px; }
  .dot{
    width:16px; height:16px; border-radius:50%;
    border:1px solid var(--panel-edge);
    transition:background .12s, border-color .12s, box-shadow .12s;
  }
  .dot.filled{ background:var(--accent); border-color:var(--accent); box-shadow:0 0 10px var(--accent-glow); }
  .dot.err{ background:var(--danger); border-color:var(--danger); box-shadow:0 0 10px rgba(255,93,108,.6); }

  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .key{
    padding:14px 0;
    background:rgba(255,255,255,.03);
    border:1px solid var(--panel-edge);
    border-radius:8px;
    font-size:16px; color:var(--text);
    cursor:pointer;
    transition:border-color .12s, color .12s, background .12s;
  }
  .key:hover{ border-color:var(--accent2); color:var(--accent2); background:rgba(170,26,177,.1); }
  .key.wide{ grid-column:span 1; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim); }

  #panel .status{ margin-top:14px; font-size:12px; letter-spacing:.05em; min-height:16px; }
  #panel .status.err{ color:var(--danger); }
  #panel .status.ok{ color:var(--success); }

  #panel .close-panel{
    margin-top:16px; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--text-dim); cursor:pointer;
  }
  #panel .close-panel:hover{ color:var(--accent2); }

  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:8px;
    padding:10px 18px; font-size:12px; color:var(--text-dim);
    opacity:0; pointer-events:none; transition:opacity .25s;
    z-index:100; max-width:80vw; text-align:center;
  }
  #toast.show{ opacity:1; }
</style>

<div id="brand">CEREBR<b>O</b></div>
<div id="chrome">
  <div class="chrome-btn" id="btn-fullscreen" title="Pełny ekran">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
  </div>
  <div class="chrome-btn" id="btn-minimize" title="Minimalizuj">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="18" x2="20" y2="18"/></svg>
  </div>
  <div class="chrome-btn" id="btn-close" title="Zamknij">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
  </div>
</div>
<div id="minitab">▾ CEREBRO</div>
<a id="applink" href="?view=app">Aplikacja Cerebro →</a>

<div id="stage">
  <div id="back">‹ Wstecz</div>
  <div id="crumb">
    <div class="path" id="crumb-path"></div>
    <div class="headline" id="crumb-title">Cerebro</div>
  </div>
  <div id="core"><span>Cerebro</span></div>
  <div id="wheel"></div>
</div>

<div id="panel">
  <h2 id="panel-title">BatCave</h2>
  <p class="hint" id="panel-hint">Podaj PIN właściciela RCP.</p>
  <div id="panel-body"></div>
  <div class="close-panel" id="panel-close">‹ Wstecz</div>
</div>

<div id="toast"></div>

<script>
/* ==========================================================================
   CEREBRO — Hub
   Menu inspirowane kołem dialogowym z gier (np. Mass Effect): centralny
   rdzeń, opcje rozłożone łukiem, wejście w opcję = nowy łuk potomny.

   RCP: lista widoków NIE jest wpisana na sztywno — Hub woła serwer
   (google.script.run.getRcpViews) który czyta na żywo dokument
   "RCP linki" na Dysku Google i wyciąga z niego aktualne linki. Zmiana
   linku w dokumencie na Dysku pojawia się w Hubie od razu, bez edycji kodu.

   BatCave: na razie tylko brama PIN-em właściciela RCP, weryfikowanym
   po stronie serwera (google.script.run.verifyRcpOwnerPin) — PIN nigdy
   nie trafia do przeglądarki, tylko wynik prawda/fałsz.
   ========================================================================= */

const ROOT = [
  { id:'rcp',     label:'RCP',      sub:'Ewidencja czasu pracy', kind:'live' },
  { id:'batcave', label:'BatCave',  sub:'Strefa prywatna',       kind:'pin', locked:true }
];

let stack = [{ title:'Cerebro', nodes: ROOT }];

const wheelEl   = document.getElementById('wheel');
const crumbPath = document.getElementById('crumb-path');
const crumbTitle= document.getElementById('crumb-title');
const backEl    = document.getElementById('back');
const panelEl   = document.getElementById('panel');

function currentLevel(){ return stack[stack.length-1]; }

function render(){
  const level = currentLevel();
  crumbTitle.textContent = level.title;
  crumbPath.textContent = stack.map(s=>s.title).join(' › ');
  backEl.classList.toggle('show', stack.length > 1);
  layoutNodes(level.nodes);
}

function layoutNodes(nodes){
  wheelEl.innerHTML = '';
  const n = nodes.length;
  const span = Math.min(150, 34 * Math.max(n-1, 1));      // całkowity rozstaw łuku (stopnie)
  const start = -span/2;
  const step = n > 1 ? span/(n-1) : 0;
  const radius = Math.min(300, 34 * window.innerHeight/100); // promień łuku

  nodes.forEach((node, i)=>{
    const angleDeg = start + step*i;
    const rad = angleDeg * Math.PI/180;
    const x = Math.sin(rad) * radius;
    const y = -Math.cos(rad) * radius;

    const el = document.createElement('div');
    el.className = 'node' + (node.locked ? ' locked' : '');
    el.style.transform = `translate(${x}px, ${y}px)`;
    el.tabIndex = 0;
    el.innerHTML = `<div class="label">${escapeHtml(node.label)}</div>` +
      (node.sub ? `<div class="sub">${escapeHtml(node.sub)}</div>` : '');
    el.addEventListener('click', ()=> activate(node, el));
    el.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') activate(node, el); });
    wheelEl.appendChild(el);
  });
}

function activate(node, el){
  if (node.kind === 'link') {
    window.open(node.url, '_blank', 'noopener');
    return;
  }
  if (node.kind === 'pin') {
    openPinGate(node);
    return;
  }
  if (node.kind === 'live') {
    el.classList.add('loading');
    google.script.run
      .withSuccessHandler(function(result){
        el.classList.remove('loading');
        if (!result.success) { showToast('Nie udało się pobrać widoków RCP: ' + result.error); return; }
        if (!result.data.length) { showToast('Brak linków w dokumencie "RCP linki".'); return; }
        const children = result.data.map(v => ({ label: v.name, sub:'Otwiera się w nowej karcie', kind:'link', url: v.url }));
        stack.push({ title: node.label, nodes: children });
        render();
      })
      .withFailureHandler(function(err){
        el.classList.remove('loading');
        showToast('Błąd połączenia z Dyskiem: ' + err.message);
      })
      .getRcpViews();
  }
}

document.getElementById('back').addEventListener('click', ()=>{
  if (stack.length > 1) { stack.pop(); render(); }
});
document.addEventListener('keydown', (e)=>{
  if (e.key === 'Escape') {
    if (panelEl.classList.contains('show')) closePanel();
    else if (stack.length > 1) { stack.pop(); render(); }
  }
});

/* ---------------------------- PIN gate (BatCave) ------------------------- */
let pinBuffer = '';
function openPinGate(node){
  pinBuffer = '';
  document.getElementById('panel-title').textContent = node.label;
  document.getElementById('panel-hint').textContent = 'Podaj PIN właściciela RCP.';
  renderPinBody();
  panelEl.classList.add('show');
}
function renderPinBody(status, statusType){
  const body = document.getElementById('panel-body');
  const dots = Array.from({length:4}).map((_,i)=>
    `<div class="dot${i < pinBuffer.length ? ' filled':''}${statusType==='err'?' err':''}"></div>`
  ).join('');
  const keys = [1,2,3,4,5,6,7,8,9].map(d=>`<div class="key" data-k="${d}">${d}</div>`).join('')
    + `<div class="key wide" data-k="clear">Wyczyść</div><div class="key" data-k="0">0</div><div class="key wide" data-k="back">‹</div>`;
  body.innerHTML = `
    <div class="dots">${dots}</div>
    <div class="keypad">${keys}</div>
    <div class="status ${statusType||''}">${status||''}</div>
  `;
  body.querySelectorAll('.key').forEach(k=>{
    k.addEventListener('click', ()=>{
      const v = k.dataset.k;
      if (v === 'clear') { pinBuffer=''; renderPinBody(); return; }
      if (v === 'back') { pinBuffer = pinBuffer.slice(0,-1); renderPinBody(); return; }
      if (pinBuffer.length >= 4) return;
      pinBuffer += v;
      if (pinBuffer.length === 4) {
        renderPinBody('Weryfikacja…');
        google.script.run
          .withSuccessHandler(function(result){
            if (!result.success) { renderPinBody(result.error, 'err'); return; }
            if (result.valid) {
              renderPinBody('Dostęp przyznany.', 'ok');
              setTimeout(()=> showBatCavePlaceholder(), 500);
            } else {
              renderPinBody('Nieprawidłowy PIN.', 'err');
              setTimeout(()=>{ pinBuffer=''; renderPinBody(); }, 700);
            }
          })
          .withFailureHandler(function(err){ renderPinBody('Błąd: ' + err.message, 'err'); })
          .verifyRcpOwnerPin(pinBuffer);
      } else {
        renderPinBody();
      }
    });
  });
}
function showBatCavePlaceholder(){
  document.getElementById('panel-title').textContent = 'BatCave';
  document.getElementById('panel-hint').textContent = '';
  document.getElementById('panel-body').innerHTML =
    `<p style="color:var(--text-dim); font-size:13px; line-height:1.6; margin:0 0 4px;">
      Strefa odblokowana. Zawartość BatCave jest w budowie — kolejne
      funkcje pojawią się tutaj, gdy będą gotowe.
    </p>`;
}
function closePanel(){
  panelEl.classList.remove('show');
}
document.getElementById('panel-close').addEventListener('click', closePanel);

/* ------------------------------- chrome ---------------------------------- */
document.getElementById('btn-fullscreen').addEventListener('click', ()=>{
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
});
document.addEventListener('fullscreenchange', ()=>{
  document.getElementById('btn-fullscreen').title = document.fullscreenElement ? 'Wyjdź z pełnego ekranu' : 'Pełny ekran';
});

document.getElementById('btn-minimize').addEventListener('click', ()=>{
  document.body.classList.add('minimized');
});
document.getElementById('minitab').addEventListener('click', ()=>{
  document.body.classList.remove('minimized');
});

document.getElementById('btn-close').addEventListener('click', ()=>{
  window.close();
  // window.close() działa tylko dla kart otwartych skryptem — przeglądarka
  // z założeń bezpieczeństwa ignoruje je dla zwykłych kart, więc dajemy
  // uczciwą informację zamiast udawać, że coś się stało.
  setTimeout(()=> showToast('Ta karta nie może zamknąć się sama — zamknij ją ręcznie (Ctrl/Cmd+W).'), 200);
});

/* ------------------------------- helpers --------------------------------- */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 4000);
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

window.addEventListener('resize', render);
render();
</script>
</body>
</html>
