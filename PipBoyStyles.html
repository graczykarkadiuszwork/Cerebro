<!-- ============================================================
     CEREBRO — PipBoyStyles.html
     Motyw wizualny Pip-Boy (sekcja 6.9 dokumentu koncepcyjnego).
     Wszystkie reguły zakresowane pod .pipboy-shell, żeby nie
     wyciekały do reszty (iOS-owego) interfejsu Cerebro.
     ============================================================ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap">
<style>
  .pipboy-shell {
    --pb-bg: #0a0f0a;
    --pb-bg-raised: #0f170f;
    --pb-green: #3dff3d;
    --pb-green-dim: #1f8a1f;
    --pb-green-faint: #145214;
    --pb-amber: #ffb000;
    --pb-red: #ff4d3d;
    --pb-font-scale: 1;
    background: var(--pb-bg);
    color: var(--pb-green);
    font-family: 'Share Tech Mono', ui-monospace, 'Courier New', monospace;
    font-size: calc(15px * var(--pb-font-scale));
    line-height: 1.55;
    border-radius: 14px;
    padding: 18px;
    min-height: calc(100vh - 140px);
    position: relative;
    overflow: hidden;
  }
  .pipboy-shell * { box-sizing: border-box; }

  /* --- CRT overlay: trzy poziomy intensywności, WYŁĄCZNIE ręcznie
     przełączane (Runda #17 — celowo bez powiązania z prefers-reduced-motion) --- */
  .pipboy-shell.crt-medium::before,
  .pipboy-shell.crt-ultra::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
  }
  .pipboy-shell.crt-ultra::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 6;
    background: radial-gradient(ellipse at center, rgba(61,255,61,0.05) 0%, rgba(0,0,0,0.25) 100%);
    animation: pbFlicker 4s infinite;
  }
  @keyframes pbFlicker { 0%,100%{opacity:1;} 92%{opacity:1;} 93%{opacity:0.85;} 94%{opacity:1;} 97%{opacity:0.92;} 98%{opacity:1;} }

  .pb-eyebrow { font-size: 0.72em; letter-spacing: 0.15em; color: var(--pb-green-dim); text-transform: uppercase; margin-bottom: 4px; }
  .pb-title { font-family: 'VT323', monospace; font-size: 2.4em; letter-spacing: 0.03em; color: var(--pb-green); line-height: 1; text-shadow: 0 0 6px rgba(61,255,61,0.35); }

  /* --- Zakładki nawigacyjne tekstowe (sekcja 6.2 / 6.9) --- */
  .pb-tabs { display: flex; gap: 2px; margin: 14px 0 16px; border-bottom: 1px solid var(--pb-green-faint); flex-wrap: wrap; }
  .pb-tab { background: none; border: none; color: var(--pb-green-dim); font-family: inherit; font-size: 0.85em; letter-spacing: 0.08em; padding: 7px 14px; cursor: pointer; border-bottom: 2px solid transparent; }
  .pb-tab.active { color: var(--pb-green); border-bottom-color: var(--pb-green); text-shadow: 0 0 4px rgba(61,255,61,0.4); }
  .pb-tab.disabled { color: var(--pb-green-faint); cursor: default; }
  .pb-tab-note { font-size: 0.65em; color: var(--pb-green-faint); }

  /* --- Pasek HP + status --- */
  .pb-statusbar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; padding: 10px 14px; background: var(--pb-bg-raised); border: 1px solid var(--pb-green-faint); border-radius: 8px; }
  .pb-hp-label { font-size: 0.78em; color: var(--pb-green-dim); white-space: nowrap; }
  .pb-hp-track { flex: 1 1 160px; height: 14px; background: var(--pb-green-faint); border-radius: 3px; overflow: hidden; min-width: 120px; }
  .pb-hp-fill { height: 100%; background: var(--pb-green); transition: width 0.4s ease; }
  .pb-hp-fill.warn { background: var(--pb-amber); }
  .pb-hp-fill.crit { background: var(--pb-red); }
  .pb-hp-value { font-size: 0.9em; font-weight: bold; min-width: 3.5em; text-align: right; }

  .pb-godmode-btn { background: transparent; border: 1px solid var(--pb-green-dim); color: var(--pb-green); font-family: inherit; font-size: 0.78em; letter-spacing: 0.05em; padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .pb-godmode-btn:hover { background: var(--pb-green-faint); }
  .pb-godmode-btn.on { background: var(--pb-amber); color: #1a1200; border-color: var(--pb-amber); }

  /* --- Cytat dnia --- */
  .pb-quote { border-left: 2px solid var(--pb-green-dim); padding: 8px 14px; margin-bottom: 14px; font-size: 0.88em; color: var(--pb-green); opacity: 0.92; }
  .pb-quote-author { color: var(--pb-green-dim); font-size: 0.85em; margin-top: 4px; }

  /* --- Marquee --- */
  .pb-marquee-wrap { overflow: hidden; white-space: nowrap; border-top: 1px solid var(--pb-green-faint); border-bottom: 1px solid var(--pb-green-faint); padding: 6px 0; margin-bottom: 16px; }
  .pb-marquee-track { display: inline-block; padding-left: 100%; animation: pbMarquee 45s linear infinite; font-size: 0.82em; color: var(--pb-green-dim); }
  .pipboy-shell[data-motion="off"] .pb-marquee-track { animation: none; padding-left: 0; }
  @keyframes pbMarquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }

  /* --- Oś dnia / bloki --- */
  .pb-block { border: 1px solid var(--pb-green-faint); border-radius: 6px; margin-bottom: 6px; background: var(--pb-bg-raised); }
  .pb-block-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
  .pb-block-marker { font-weight: bold; width: 1.6em; text-align: center; flex-shrink: 0; }
  .pb-block.obligatoryjne .pb-block-marker { color: var(--pb-green); }
  .pb-block.opcjonalne .pb-block-marker { color: var(--pb-green-dim); }
  .pb-block-name { flex: 1; font-size: 0.92em; }
  .pb-block.done .pb-block-name { color: var(--pb-green-dim); text-decoration: line-through; }
  .pb-block-tag { font-size: 0.68em; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .pb-block.obligatoryjne .pb-block-tag { color: var(--pb-green); }
  .pb-block.opcjonalne .pb-block-tag { color: var(--pb-green-dim); }
  .pb-block-chevron { color: var(--pb-green-faint); transition: transform 0.15s; }
  .pb-block.expanded .pb-block-chevron { transform: rotate(90deg); }
  .pb-block-body { display: none; padding: 4px 14px 14px 42px; border-top: 1px solid var(--pb-green-faint); }
  .pb-block.expanded .pb-block-body { display: block; }

  .pb-check-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 0.88em; cursor: pointer; }
  .pb-check-mark { width: 1.4em; display: inline-block; }

  .pb-mood-grid { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; margin-top: 6px; }
  .pb-mood-grid label { font-size: 0.85em; color: var(--pb-green-dim); }
  .pb-mood-grid input[type="range"] { accent-color: var(--pb-green); width: 160px; }
  .pb-gi-followup { margin-top: 10px; }
  .pb-textarea, .pb-input {
    width: 100%; background: var(--pb-bg); border: 1px solid var(--pb-green-dim); color: var(--pb-green);
    font-family: inherit; font-size: 0.88em; padding: 8px 10px; border-radius: 4px; resize: vertical;
  }
  .pb-btn { background: var(--pb-green-faint); border: 1px solid var(--pb-green-dim); color: var(--pb-green); font-family: inherit; font-size: 0.82em; padding: 6px 14px; border-radius: 5px; cursor: pointer; margin-top: 8px; }
  .pb-btn:hover { background: var(--pb-green-dim); color: #041604; }

  .pb-settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 0.85em; border-top: 1px solid var(--pb-green-faint); }
  .pb-segmented { display: flex; gap: 2px; }
  .pb-segmented button { background: transparent; border: 1px solid var(--pb-green-dim); color: var(--pb-green-dim); font-family: inherit; font-size: 0.78em; padding: 4px 10px; cursor: pointer; }
  .pb-segmented button.active { background: var(--pb-green-dim); color: #041604; }
  .pb-segmented button:first-child { border-radius: 4px 0 0 4px; }
  .pb-segmented button:last-child { border-radius: 0 4px 4px 0; }
</style>
