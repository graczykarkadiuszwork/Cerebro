<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pip-Boy">
  <title>Pip-Boy</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Marked.js (markdown) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Chart.js (wykresy Pip-Boy Dashboard, sekcja 6.13) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- iOS Design System -->
  <?!= include('Styles'); ?>

  <!-- Pip-Boy Design System (zakresowany pod .pipboy-shell) -->
  <?!= include('PipBoyStyles'); ?>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ios-blue': '#007aff',
            'ios-green': '#34c759',
            'ios-red': '#ff3b30',
            'ios-orange': '#ff9500',
            'ios-gray': '#8e8e93',
            'ios-bg': '#f2f2f7',
            'ios-card': '#ffffff',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f2f2f7] font-[-apple-system,BlinkMacSystemFont,'Inter',sans-serif]">

  <!-- PWA Install Banner -->
  <div id="pwa-banner" class="hidden fixed top-0 left-0 right-0 bg-[#007aff] text-white
    px-4 py-2 text-sm text-center z-50">
    Dodaj Pip-Boy do ekranu głównego: Udostępnij → Dodaj do ekranu głównego
    <button onclick="document.getElementById('pwa-banner').remove()"
      class="ml-3 underline">Zamknij</button>
  </div>

  <!--
    Wdrożenie samodzielne (patrz docs/Pip-Boy-Wdrozenie.md) — CAŁA otoczka
    Cerebro (Sidebar.html, logo, stałe menu boczne) jest teraz usunięta z
    layoutu, nie tylko ukryta stylami — Arek: "ta bezsensowna ramka
    Cerebro". Sidebar.html zostaje nietknięty w repozytorium (przyda się
    pod hub później), po prostu przestał być tu includowany. Pip-Boy
    zajmuje cały ekran; jedyne wyjście do Ustawień to mała ikona ⚙ w rogu
    (patrz niżej), bo tam wciąż mieszka config (suplementy, backup, itd.).
  -->

  <!-- Ikona Ustawień / powrotu — jedyny element chrome poza samym Pip-Boyem -->
  <button id="pb-chrome-settings" onclick="navigateTo('ustawienia')"
    class="fixed top-3 right-3 z-30 w-9 h-9 flex items-center justify-center
    rounded-full bg-black/70 text-[#3dff3d] hover:bg-black/90 transition-colors"
    title="Ustawienia" style="border:1px solid rgba(61,255,61,0.4);">
    <i data-lucide="settings" class="w-4 h-4"></i>
  </button>

  <!-- Module content -->
  <div id="content" class="h-screen overflow-auto p-4 md:p-6">
    <!-- Ładowanie -->
    <div class="flex items-center justify-center h-full">
      <div class="text-center">
        <div class="text-5xl mb-4">📟</div>
        <div class="text-[17px] font-semibold text-[#000]">Pip-Boy</div>
        <div class="text-[15px] text-[#8e8e93] mt-1">Ładowanie...</div>
      </div>
    </div>
  </div>

  <!-- Tooltip container -->
  <div id="tooltip" class="hidden fixed z-[9999] bg-black/75 text-white text-[13px]
    px-3 py-1.5 rounded-md pointer-events-none backdrop-blur-sm whitespace-nowrap">
  </div>

  <!-- Modal container -->
  <div id="modal-overlay" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm
    z-[100] flex items-end md:items-center justify-center">
    <div id="modal-content" class="bg-white w-full md:max-w-lg rounded-t-[20px]
      md:rounded-[16px] max-h-[90vh] overflow-auto">
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[200]
    flex flex-col gap-2 items-center">
  </div>

  <?!= include('Scripts'); ?>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      lucide.createIcons();
      checkFirstRun();
      showPWABanner();
    });

    function showPWABanner() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
      if (isIOS && !isStandalone) {
        document.getElementById('pwa-banner').classList.remove('hidden');
      }
    }

    // Wersja tymczasowa (samodzielne wdrożenie Pip-Boya, zanim powstanie hub
    // łączący wszystkie moduły Cerebro — patrz docs/Pip-Boy-Wdrozenie.md):
    // domyślnym i jedynym realnie widocznym widokiem jest Pip-Boy, więc
    // pierwsze uruchomienie sprawdza JEGO konfigurację, a nie starych pól
    // Organizacji (ta karta w Ustawieniach jest teraz ukryta).
    function checkFirstRun() {
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success && result.data.configured) {
            navigateTo('pipboy');
          } else {
            navigateTo('ustawienia');
            showInfo('Witaj! Zacznij od „Skonfiguruj Pip-Boy" w Ustawieniach.');
          }
        })
        .withFailureHandler(function() { navigateTo('pipboy'); })
        .isPipBoyConfigured();
    }

    // toggleMobileSidebar() usunięta razem z sidebarem (wdrożenie samodzielne
    // Pip-Boya — patrz komentarz w layoucie wyżej); Scripts.html sprawdza
    // `typeof toggleMobileSidebar === 'function'` przed wywołaniem, więc jej
    // brak tutaj jest bezpieczny.

    // Close modal when clicking outside
    document.getElementById('modal-overlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
</html>
