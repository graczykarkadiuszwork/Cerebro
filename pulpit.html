<div class="max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-[#000]">Pulpit</h1>
      <p class="text-[15px] text-[#8e8e93] mt-1">Przegląd działań</p>
    </div>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6" id="stats-container">
  </div>
  <div class="mb-6">
    <h2 class="text-[17px] font-semibold text-[#000] mb-3">📅 Bliskie terminy</h2>
    <div id="upcoming-tasks" class="ios-card">
      <div class="p-4"></div>
    </div>
  </div>
  <div class="mb-6">
    <h2 class="text-[17px] font-semibold text-[#000] mb-3">✨ Ostatnio dodane</h2>
    <div id="recent-items" class="ios-card">
      <div class="p-4"></div>
    </div>
  </div>
</div>

<script>
function initModule() { loadDashboard(); }

function loadDashboard() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        renderDashboard(result.data);
      } else {
        showError('Błąd: ' + result.error);
      }
    })
    .withFailureHandler(function(err) { showError('Błąd połączenia: ' + err.message); })
    .getTasks();
}

function renderDashboard(tasks) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const total = tasks.length;
  const todo = tasks.filter(function(t) { return t.status === 'todo' || t.status === ''; }).length;
  const inprogress = tasks.filter(function(t) { return t.status === 'inprogress'; }).length;
  const done = tasks.filter(function(t) { return t.status === 'done'; }).length;

  document.getElementById('stats-container').innerHTML =
    '<div class="ios-card p-4"><div class="text-[13px] text-[#8e8e93] font-semibold mb-2">Wszystkie zadania</div>' +
    '<div class="text-[28px] font-bold text-[#007aff]">' + total + '</div></div>' +
    '<div class="ios-card p-4"><div class="text-[13px] text-[#8e8e93] font-semibold mb-2">Do wykonania</div>' +
    '<div class="text-[28px] font-bold text-[#ff9500]">' + todo + '</div></div>' +
    '<div class="ios-card p-4"><div class="text-[13px] text-[#8e8e93] font-semibold mb-2">W trakcie</div>' +
    '<div class="text-[28px] font-bold text-[#ff3b30]">' + inprogress + '</div></div>' +
    '<div class="ios-card p-4"><div class="text-[13px] text-[#8e8e93] font-semibold mb-2">Ukończone</div>' +
    '<div class="text-[28px] font-bold text-[#34c759]">' + done + '</div></div>';

  // Kopiujemy tablice przed sortowaniem — nie mutujemy tasks
  const upcoming = [...tasks].filter(function(t) {
    if (!t.termin) return false;
    const date = new Date(t.termin);
    date.setHours(0, 0, 0, 0);
    const daysAhead = (date - today) / (1000 * 60 * 60 * 24);
    return daysAhead >= 0 && daysAhead <= 7 && t.status !== 'done';
  }).sort(function(a, b) { return new Date(a.termin) - new Date(b.termin); }).slice(0, 5);

  if (upcoming.length === 0) {
    document.getElementById('upcoming-tasks').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">✅</div>' +
      '<div class="empty-state-title">Brak bliskich terminów</div>' +
      '<div class="empty-state-text">Wszystkie zadania są w harmonogramie</div></div>';
  } else {
    document.getElementById('upcoming-tasks').innerHTML = '<div>' +
      upcoming.map(function(t) {
        return '<div class="ios-row cursor-pointer" onclick="navigateTo(\'zadania\')">' +
          '<div class="flex-1 min-w-0">' +
          '<div class="text-[15px] font-medium text-[#000] truncate">' + escapeHtml(t.tytul) + '</div>' +
          '<div class="text-[13px] text-[#8e8e93] mt-1">' + formatDate(t.termin) + '</div>' +
          '</div><div class="flex-shrink-0">' + getPriorityBadge(t.priorytet) + '</div></div>';
      }).join('') + '</div>';
  }

  const recent = [...tasks].sort(function(a, b) {
    return new Date(b.data_utworzenia) - new Date(a.data_utworzenia);
  }).slice(0, 5);

  if (recent.length === 0) {
    document.getElementById('recent-items').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">📝</div>' +
      '<div class="empty-state-title">Brak zadań</div>' +
      '<div class="empty-state-text">Zacznij od dodania nowego zadania</div></div>';
  } else {
    document.getElementById('recent-items').innerHTML = '<div>' +
      recent.map(function(t) {
        return '<div class="ios-row cursor-pointer" onclick="navigateTo(\'zadania\')">' +
          '<div class="flex-1 min-w-0">' +
          '<div class="text-[15px] font-medium text-[#000] truncate">' + escapeHtml(t.tytul) + '</div>' +
          '<div class="text-[13px] text-[#8e8e93] mt-1">' + formatDateTime(t.data_utworzenia) + '</div>' +
          '</div><div class="flex-shrink-0">' + getStatusBadge(t.status) + '</div></div>';
      }).join('') + '</div>';
  }
}
</script>
