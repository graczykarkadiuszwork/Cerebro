<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>We SMILE — RCP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f0f11;color:#f0f0f2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:360px;background:#1c1c1e;border-radius:22px;padding:28px 22px 24px;box-shadow:0 24px 64px rgba(0,0,0,.7)}

/* ── Admin: token display ── */
.admin-label{font-size:11px;text-transform:uppercase;letter-spacing:2.5px;color:#555;text-align:center;margin-bottom:6px}
.admin-sublabel{font-size:13px;color:#888;text-align:center;margin-bottom:4px}
#token{font-size:80px;font-weight:900;color:#e84560;letter-spacing:12px;text-align:center;line-height:1.1;margin:4px 0 16px}
.prog-wrap{height:4px;background:#2c2c2e;border-radius:2px;overflow:hidden;margin-bottom:10px}
.prog-fill{height:100%;background:#e84560;transform-origin:left}
.admin-hint{font-size:12px;color:#444;text-align:center}

/* ── Worker: steps ── */
.brand{font-size:11px;text-transform:uppercase;letter-spacing:2.5px;color:#444;text-align:center;margin-bottom:22px}
.step{display:none}
.step.on{display:block}
.step-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.step-sub{font-size:14px;color:#777;text-align:center;margin-bottom:18px;min-height:20px}

/* PIN dots */
.dots{display:flex;justify-content:center;gap:16px;margin:0 0 20px}
.dot{width:18px;height:18px;border-radius:50%;background:#2c2c2e;border:2px solid #38383a;transition:background .12s,border-color .12s}
.dot.on{background:#e84560;border-color:#e84560}

/* Keypad */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.key{background:#2c2c2e;border:none;border-radius:14px;color:#f0f0f2;font-size:24px;font-weight:600;padding:20px 0;cursor:pointer;user-select:none;transition:background .1s,transform .1s}
.key:active{background:#e84560;transform:scale(.93)}
.key.sym{color:#888;font-size:18px}
.key.clr{color:#e84560;font-weight:800;font-size:17px}

/* Action buttons */
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border:none;border-radius:14px;font-size:15px;font-weight:700;padding:18px 0;cursor:pointer;color:#fff;transition:opacity .1s,transform .1s}
.btn:active{transform:scale(.96);opacity:.85}
.btn-in{background:#00a86b}
.btn-out{background:#2979ff}
.btn-back{width:100%;background:none;border:1px solid #2c2c2e;border-radius:12px;color:#666;font-size:13px;padding:11px;cursor:pointer;margin-top:10px;transition:background .1s}
.btn-back:active{background:#2c2c2e}

/* Success */
.ok-wrap{text-align:center;padding:8px 0}
.ok-icon{font-size:60px;margin-bottom:12px}
.ok-title{font-size:22px;font-weight:700;color:#00a86b;margin-bottom:8px}
.ok-sub{font-size:14px;color:#777}

/* Toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);opacity:0;background:#e84560;color:#fff;padding:11px 22px;border-radius:40px;font-size:14px;font-weight:600;pointer-events:none;transition:.25s cubic-bezier(.4,0,.2,1);z-index:99;max-width:90vw;text-align:center;white-space:pre-line}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#toast.ok{background:#00a86b}
</style>
</head>
<body>

<? if (PAGE === 'admin') { ?>

<!-- ═══════════════════════════════════════════
     WIDOK ADMINA — wyświetlanie kodu
════════════════════════════════════════════════ -->
<div class="card">
  <div class="admin-label">We SMILE</div>
  <div class="admin-sublabel">Aktywny kod autoryzacyjny</div>
  <div id="token">----</div>
  <div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>
  <div class="admin-hint">Kod zmienia się co 30 sekund</div>
</div>

<? } else { ?>

<!-- ═══════════════════════════════════════════
     WIDOK PRACOWNIKA — rejestracja odbicia
════════════════════════════════════════════════ -->
<div class="card">
  <div class="brand">We SMILE — RCP</div>

  <!-- Krok 1: wpisz PIN -->
  <div class="step on" id="s-pin">
    <div class="step-title">Wpisz swój PIN</div>
    <div class="step-sub">4-cyfrowy kod osobisty</div>
    <div class="dots">
      <div class="dot" id="p0"></div><div class="dot" id="p1"></div>
      <div class="dot" id="p2"></div><div class="dot" id="p3"></div>
    </div>
    <div class="kp" id="kp-pin">
      <button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button>
      <button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button>
      <button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button>
      <button class="key clr" data-v="C">C</button><button class="key" data-v="0">0</button><button class="key sym" data-v="X">⌫</button>
    </div>
  </div>

  <!-- Krok 2: wpisz kod z tabletu + wybierz akcję -->
  <div class="step" id="s-code">
    <div class="step-title" id="w-name">Pracownik</div>
    <div class="step-sub" id="w-role"></div>
    <div class="dots">
      <div class="dot" id="c0"></div><div class="dot" id="c1"></div>
      <div class="dot" id="c2"></div><div class="dot" id="c3"></div>
    </div>
    <div class="kp" id="kp-code">
      <button class="key" data-c="1">1</button><button class="key" data-c="2">2</button><button class="key" data-c="3">3</button>
      <button class="key" data-c="4">4</button><button class="key" data-c="5">5</button><button class="key" data-c="6">6</button>
      <button class="key" data-c="7">7</button><button class="key" data-c="8">8</button><button class="key" data-c="9">9</button>
      <button class="key clr" data-c="C">C</button><button class="key" data-c="0">0</button><button class="key sym" data-c="X">⌫</button>
    </div>
    <div class="action-row">
      <button class="btn btn-in"  id="btn-in">✅ WEJŚCIE</button>
      <button class="btn btn-out" id="btn-out">🚪 WYJŚCIE</button>
    </div>
    <button class="btn-back" id="btn-back">← Zmień PIN</button>
  </div>

  <!-- Krok 3: potwierdzenie -->
  <div class="step" id="s-ok">
    <div class="ok-wrap">
      <div class="ok-icon">✅</div>
      <div class="ok-title">Zarejestrowano!</div>
      <div class="ok-sub" id="ok-msg"></div>
    </div>
  </div>

</div>

<? } ?>

<div id="toast"></div>

<script>
/* global google */
var PAGE = "<?= PAGE ?>";

// ── Toast ─────────────────────────────────────────────────────
var _tt;
function toast(msg, isOk) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'on' + (isOk ? ' ok' : '');
  clearTimeout(_tt);
  _tt = setTimeout(function () { el.className = ''; }, 3200);
}

// ── GAS call ──────────────────────────────────────────────────
function gas(action, args, cb) {
  google.script.run
    .withSuccessHandler(cb)
    .withFailureHandler(function (e) { toast(e.message || 'Błąd połączenia.', false); })
    .callRCP(action, JSON.stringify(args || []));
}

// ════════════════════════════════════════════════════════════
if (PAGE === 'admin') {
// ════════════════════════════════════════════════════════════

  function refreshToken() {
    gas('getToken', [], function (res) {
      if (!res || !res.ok) return;
      document.getElementById('token').textContent = res.token;
      animBar();
    });
  }

  function animBar() {
    var b = document.getElementById('prog');
    b.style.transition = 'none';
    b.style.width = '100%';
    setTimeout(function () {
      b.style.transition = 'width 30s linear';
      b.style.width = '0%';
    }, 60);
  }

  refreshToken();
  setInterval(refreshToken, 30000);

// ════════════════════════════════════════════════════════════
} else {
// ════════════════════════════════════════════════════════════

  var pin = '', code = '', empPin = '';

  // Przełączanie kroków
  function show(id) {
    ['s-pin', 's-code', 's-ok'].forEach(function (s) {
      document.getElementById(s).className = 'step' + (s === id ? ' on' : '');
    });
  }

  // Aktualizacja kropek
  function setDots(val, pfx) {
    for (var i = 0; i < 4; i++) {
      var d = document.getElementById(pfx + i);
      if (d) d.className = 'dot' + (i < val.length ? ' on' : '');
    }
  }

  // ── Klawiatura PIN ────────────────────────────────────────
  document.getElementById('kp-pin').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-v]');
    if (!btn) return;
    var v = btn.getAttribute('data-v');
    if (v === 'C')      { pin = ''; }
    else if (v === 'X') { pin = pin.slice(0, -1); }
    else if (pin.length < 4) { pin += v; }
    setDots(pin, 'p');

    if (pin.length === 4) {
      toast('Weryfikacja…', true);
      gas('checkPin', [pin], function (res) {
        if (res && res.ok) {
          empPin = pin;
          document.getElementById('w-name').textContent = res.imie + ' ' + res.nazwisko;
          document.getElementById('w-role').textContent = res.rola;
          code = '';
          setDots(code, 'c');
          show('s-code');
        } else {
          toast((res && res.msg) || 'Nieprawidłowy PIN.', false);
          pin = '';
          setDots(pin, 'p');
        }
      });
    }
  });

  // ── Klawiatura kodu ───────────────────────────────────────
  document.getElementById('kp-code').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-c]');
    if (!btn) return;
    var v = btn.getAttribute('data-c');
    if (v === 'C')      { code = ''; }
    else if (v === 'X') { code = code.slice(0, -1); }
    else if (code.length < 4) { code += v; }
    setDots(code, 'c');
  });

  // ── Rejestracja zdarzenia ─────────────────────────────────
  function submit(action) {
    if (code.length !== 4) {
      toast('Wpisz 4-cyfrowy kod z tabletu admina.', false);
      return;
    }
    toast('Rejestrowanie…', true);
    var rpc = (action === 'WEJSCIE') ? 'clockIn' : 'clockOut';
    gas(rpc, [empPin, code], function (res) {
      if (res && res.ok) {
        var label = (action === 'WEJSCIE') ? 'WEJŚCIE' : 'WYJŚCIE';
        document.getElementById('ok-msg').textContent =
          res.imie + ' — ' + label + ' o ' + res.godzina;
        show('s-ok');
        setTimeout(function () {
          pin = ''; code = ''; empPin = '';
          setDots(pin, 'p');
          show('s-pin');
        }, 3000);
      } else {
        toast((res && res.msg) || 'Błąd rejestracji.', false);
        code = '';
        setDots(code, 'c');
      }
    });
  }

  document.getElementById('btn-in').addEventListener('click',   function () { submit('WEJSCIE'); });
  document.getElementById('btn-out').addEventListener('click',  function () { submit('WYJSCIE'); });
  document.getElementById('btn-back').addEventListener('click', function () {
    pin = ''; code = ''; empPin = '';
    setDots(pin, 'p');
    show('s-pin');
  });
}
</script>
</body>
</html>
