<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>We SMILE — Panel Raportowy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0f0f11;color:#f0f0f2;min-height:100vh}

/* ── LOGIN ── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.login-card{background:#1c1c1e;border-radius:22px;padding:28px 22px;width:100%;max-width:340px;box-shadow:0 24px 64px rgba(0,0,0,.7)}
.login-brand{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#555;text-align:center;margin-bottom:20px}
.login-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px}
.login-sub{font-size:13px;color:#888;text-align:center;margin-bottom:16px}
.dots{display:flex;justify-content:center;gap:14px;margin:14px 0}
.dot{width:16px;height:16px;border-radius:50%;background:#2c2c2e;border:2px solid #3a3a3c;transition:.12s}
.dot.on{background:#e84560;border-color:#e84560}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{background:#2c2c2e;border:none;border-radius:12px;color:#f0f0f2;font-size:22px;font-weight:600;padding:18px 0;cursor:pointer;transition:.1s;user-select:none}
.key:active{background:#e84560;transform:scale(.94)}
.key.sym{color:#888;font-size:17px}
.key.clr{color:#e84560;font-weight:800;font-size:16px}

/* ── APP BAR ── */
.app-bar{background:#1c1c1e;border-bottom:1px solid #2a2a2e;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.app-title{font-weight:800;font-size:15px}
.month-nav{display:flex;align-items:center;gap:6px}
.nav-btn{background:#2c2c2e;border:none;border-radius:8px;color:#f0f0f2;width:34px;height:34px;cursor:pointer;font-size:14px}
.nav-btn:hover{background:#3a3a3c}
.month-label{font-size:13px;font-weight:700;min-width:110px;text-align:center}
.norma-group{display:flex;align-items:center;gap:6px;margin-left:4px}
.norma-lbl{font-size:12px;color:#888}
.norma-inp{background:#2a2a2e;border:1px solid #3a3a3c;border-radius:8px;color:#f0f0f2;font-size:14px;font-weight:700;padding:5px 8px;width:72px;text-align:right}
.norma-inp:focus{outline:none;border-color:#e84560}
.bar-right{display:flex;gap:8px;margin-left:auto}
.btn-sm{background:#2c2c2e;border:none;border-radius:8px;color:#f0f0f2;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn-sm:hover{background:#3a3a3c}
.btn-red{background:#e84560;color:#fff}
.btn-red:hover{background:#c73451}

/* ── MAIN ── */
.page-wrap{max-width:900px;margin:0 auto;padding:20px 20px 40px}

/* ── EMPLOYEE SELECTOR ── */
.sel-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#555;margin-bottom:6px}
.emp-sel-wrap{position:relative;margin-bottom:20px}
.emp-input{width:100%;background:#1c1c1e;border:1px solid #3a3a3c;border-radius:12px;color:#f0f0f2;font-size:15px;font-weight:600;padding:12px 16px;cursor:text}
.emp-input:focus{outline:none;border-color:#e84560}
.emp-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#1c1c1e;border:1px solid #3a3a3c;border-radius:12px;z-index:20;max-height:220px;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.6);display:none}
.emp-opt{padding:11px 16px;cursor:pointer;font-size:14px;font-weight:500;border-radius:0}
.emp-opt:first-child{border-radius:12px 12px 0 0}
.emp-opt:last-child{border-radius:0 0 12px 12px}
.emp-opt:only-child{border-radius:12px}
.emp-opt:hover{background:#2a2a2e}
.emp-opt-none{padding:11px 16px;color:#555;font-size:13px}

/* ── SUMMARY CARD ── */
.emp-card{background:#1c1c1e;border:1px solid #2a2a2e;border-radius:16px;padding:20px;margin-bottom:16px}
.emp-name{font-size:18px;font-weight:800;margin-bottom:2px}
.emp-role{font-size:12px;color:#888;background:#2a2a2e;padding:2px 10px;border-radius:20px;display:inline-block;margin-bottom:16px}
.stats-row{display:flex;gap:20px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:4px}
.stat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#555}
.stat-val{font-size:22px;font-weight:800;line-height:1}
.clr-ok{color:#00a86b}
.clr-warn{color:#ffb300}
.clr-bad{color:#e84560}

/* ── DAILY TABLE ── */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid #2a2a2e}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#111;color:#555;font-weight:600;padding:9px 14px;text-align:left;border-bottom:1px solid #222;white-space:nowrap}
td{padding:8px 14px;border-bottom:1px solid #1a1a1c;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.wknd td{color:#555}
.t-time{font-family:monospace;font-weight:600;color:#f0f0f2}
.t-empty{color:#333}
.t-hours{font-weight:700;color:#00a86b}
.t-miss{color:#e84560;font-weight:700}

/* ── HINT / ERROR ── */
.hint{text-align:center;color:#444;padding:48px;font-size:15px}
.hint-err{color:#e84560}
.retry-btn{background:#2a2a2e;border:1px solid #3a3a3c;border-radius:8px;color:#f0f0f2;padding:6px 14px;cursor:pointer;font-size:13px;margin-top:10px;display:inline-block}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);opacity:0;background:#e84560;color:#fff;padding:10px 22px;border-radius:40px;font-size:14px;font-weight:600;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#toast.g{background:#00a86b}

@media(max-width:600px){
  .app-bar{gap:8px;padding:8px 12px}
  .page-wrap{padding:12px 12px 32px}
  .stats-row{gap:14px}
}
</style>
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="login-brand">We SMILE</div>
    <div class="login-title">Panel Raportowy</div>
    <div class="login-sub">Wpisz swój PIN</div>
    <div class="dots">
      <div class="dot" id="ld0"></div><div class="dot" id="ld1"></div>
      <div class="dot" id="ld2"></div><div class="dot" id="ld3"></div>
    </div>
    <div class="kp" id="kp-login">
      <button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button>
      <button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button>
      <button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button>
      <button class="key clr" data-v="C">C</button><button class="key" data-v="0">0</button><button class="key sym" data-v="X">⌫</button>
    </div>
  </div>
</div>

<!-- ═══════ DASHBOARD ═══════ -->
<div id="dash" style="display:none">
  <header class="app-bar">
    <span class="app-title">📊 Panel Raportowy</span>
    <div class="month-nav">
      <button id="btn-prev" class="nav-btn">◀</button>
      <span id="month-lbl" class="month-label"></span>
      <button id="btn-next" class="nav-btn">▶</button>
    </div>
    <div class="norma-group">
      <span class="norma-lbl">Norma:</span>
      <input id="etat-inp" type="number" class="norma-inp" min="0" step="0.5" placeholder="h">
      <span class="norma-lbl">h/mies.</span>
    </div>
    <div class="bar-right">
      <button id="btn-csv" class="btn-sm">📥 CSV</button>
      <button id="btn-logout" class="btn-sm btn-red">Wyloguj</button>
    </div>
  </header>

  <div class="page-wrap">
    <div class="sel-label">Pracownik</div>
    <div class="emp-sel-wrap">
      <input type="text" id="emp-input" class="emp-input"
             placeholder="Wpisz imię lub nazwisko…" autocomplete="off">
      <div id="emp-dropdown" class="emp-dropdown"></div>
    </div>
    <div id="emp-data">
      <div class="hint">Wybierz pracownika z listy powyżej</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* global google */

var S = {
  token: null,
  year:  new Date().getFullYear(),
  month: new Date().getMonth() + 1,
  data:  null,
  selId: null
};

var MONTHS = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec',
              'Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];

// ── Helpers ───────────────────────────────────────────────────

var _tt;
function toast(msg, ok) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'on' + (ok ? ' g' : '');
  clearTimeout(_tt);
  _tt = setTimeout(function(){ el.className = ''; }, 2800);
}

function gas(action, args, cb) {
  google.script.run
    .withSuccessHandler(function(res) {
      try { cb(res); } catch(ex) {
        showErr('Błąd renderowania: ' + ex.message);
      }
    })
    .withFailureHandler(function(e) {
      showErr((e && e.message) || 'Błąd połączenia');
    })
    .callRCP(action, JSON.stringify(args || []));
}

function showErr(msg) {
  document.getElementById('emp-data').innerHTML =
    '<div class="hint hint-err">' + esc(msg) +
    '<br><button class="retry-btn" onclick="loadMonth()">Ponów</button></div>';
  toast(msg, false);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function nf(v, dec) {
  var n = parseFloat(v);
  if (isNaN(n)) return '—';
  return n.toFixed(dec == null ? 1 : dec).replace('.', ',');
}

// ── Login ─────────────────────────────────────────────────────

var lPin = '';
function setDots(p) {
  for (var i = 0; i < 4; i++)
    document.getElementById('ld' + i).className = 'dot' + (i < p.length ? ' on' : '');
}

document.getElementById('kp-login').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-v]');
  if (!btn) return;
  var v = btn.getAttribute('data-v');
  if (v === 'C') lPin = '';
  else if (v === 'X') lPin = lPin.slice(0, -1);
  else if (lPin.length < 4) lPin += v;
  setDots(lPin);
  if (lPin.length === 4) {
    toast('Logowanie…', true);
    gas('dashLogin', [lPin], function(res) {
      if (res && res.ok) {
        S.token = res.token;
        document.getElementById('login').style.display = 'none';
        document.getElementById('dash').style.display  = 'block';
        updateMonthLabel();
        loadMonth();
      } else {
        toast((res && res.msg) || 'Nieprawidłowy PIN.', false);
        lPin = ''; setDots('');
      }
    });
  }
});

// ── Miesiąc ───────────────────────────────────────────────────

function updateMonthLabel() {
  document.getElementById('month-lbl').textContent = MONTHS[S.month - 1] + ' ' + S.year;
}

document.getElementById('btn-prev').addEventListener('click', function() {
  S.month--; if (S.month < 1) { S.month = 12; S.year--; }
  updateMonthLabel(); loadMonth();
});
document.getElementById('btn-next').addEventListener('click', function() {
  S.month++; if (S.month > 12) { S.month = 1; S.year++; }
  updateMonthLabel(); loadMonth();
});

// ── Norma (etat) ──────────────────────────────────────────────

function saveEtat() {
  var val = parseFloat(document.getElementById('etat-inp').value);
  if (isNaN(val) || val < 0) return;
  gas('setEtat', [S.token, S.year, S.month, val], function(res) {
    if (res && res.ok) {
      if (S.data) S.data.etat = val;
      toast('Norma zapisana.', true);
      refreshEmpDisplay();
    } else if (res && res.errorType === 'UNAUTHORIZED') {
      doLogout();
    }
  });
}

document.getElementById('etat-inp').addEventListener('blur', saveEtat);
document.getElementById('etat-inp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') this.blur();
});

// ── Selector pracownika ───────────────────────────────────────

var _emps = [];

function fillSelector(employees) {
  _emps = employees || [];
  renderOpts(_emps);
}

function renderOpts(list) {
  var dl = document.getElementById('emp-dropdown');
  if (list.length === 0) {
    dl.innerHTML = '<div class="emp-opt-none">Brak wyników</div>';
    return;
  }
  dl.innerHTML = '';
  list.forEach(function(emp) {
    var d = document.createElement('div');
    d.className = 'emp-opt';
    d.textContent = emp.imie + ' ' + emp.nazwisko;
    d.addEventListener('mousedown', function(e) {
      e.preventDefault();
      pickEmp(emp);
    });
    dl.appendChild(d);
  });
}

document.getElementById('emp-input').addEventListener('focus', function() {
  renderOpts(_emps);
  document.getElementById('emp-dropdown').style.display = 'block';
});

document.getElementById('emp-input').addEventListener('input', function() {
  var q = this.value.toLowerCase();
  renderOpts(_emps.filter(function(e) {
    return (e.imie + ' ' + e.nazwisko).toLowerCase().indexOf(q) !== -1;
  }));
  document.getElementById('emp-dropdown').style.display = 'block';
});

document.getElementById('emp-input').addEventListener('blur', function() {
  setTimeout(function() {
    document.getElementById('emp-dropdown').style.display = 'none';
  }, 160);
});

function pickEmp(emp) {
  S.selId = emp.id;
  document.getElementById('emp-input').value = emp.imie + ' ' + emp.nazwisko;
  document.getElementById('emp-dropdown').style.display = 'none';
  renderEmp(emp);
}

function getEmp(id) {
  if (!S.data || !S.data.employees) return null;
  return S.data.employees.filter(function(e) { return e.id === id; })[0] || null;
}

function refreshEmpDisplay() {
  if (!S.selId) return;
  var emp = getEmp(S.selId);
  if (emp) renderEmp(emp);
}

// ── Ładowanie danych ──────────────────────────────────────────

function loadMonth() {
  document.getElementById('emp-data').innerHTML = '<div class="hint">Ładowanie danych…</div>';
  gas('getDashboard', [S.token, S.year, S.month], function(res) {
    if (!res || !res.ok) {
      if (res && res.errorType === 'UNAUTHORIZED') { doLogout(); return; }
      showErr((res && res.msg) || 'Błąd ładowania danych.');
      return;
    }
    S.data = res;
    document.getElementById('etat-inp').value = res.etat > 0 ? res.etat : '';
    fillSelector(res.employees);
    if (S.selId) {
      var emp = getEmp(S.selId);
      if (emp) { renderEmp(emp); return; }
    }
    document.getElementById('emp-data').innerHTML =
      '<div class="hint">Wybierz pracownika z listy powyżej</div>';
  });
}

// ── Wyświetlanie pracownika ───────────────────────────────────

function renderEmp(emp) {
  var etat   = S.data && S.data.etat > 0 ? S.data.etat : 0;
  var totalH = parseFloat(emp.totalHours) || 0;
  var diff   = etat > 0 ? totalH - etat : null;
  var dCls   = diff === null ? '' : (diff >= -1 ? 'clr-ok' : (diff >= -10 ? 'clr-warn' : 'clr-bad'));
  var dTxt   = diff === null ? '—' : (diff >= 0 ? '+' : '') + nf(diff) + 'h';

  var html = '<div class="emp-card">';
  html += '<div class="emp-name">' + esc(emp.imie + ' ' + emp.nazwisko) + '</div>';
  html += '<div class="emp-role">' + esc(emp.rola || '') + '</div>';
  html += '<div class="stats-row">';
  html += '<div class="stat"><div class="stat-lbl">Przepracowane</div><div class="stat-val">' + nf(totalH) + 'h</div></div>';
  if (etat > 0) {
    html += '<div class="stat"><div class="stat-lbl">Norma</div><div class="stat-val">' + nf(etat) + 'h</div></div>';
    html += '<div class="stat"><div class="stat-lbl">Różnica</div><div class="stat-val ' + dCls + '">' + dTxt + '</div></div>';
  }
  html += '</div></div>';

  html += '<div class="table-wrap"><table>';
  html += '<thead><tr><th>Dzień</th><th>Data</th><th>Wejście</th><th>Wyjście</th><th>Godziny</th></tr></thead>';
  html += '<tbody>';

  var days = Array.isArray(emp.days) ? emp.days : [];
  days.forEach(function(d) {
    if (!d) return;
    var dn   = String(d.date || '').split('-')[2] || '';
    var mm   = String(S.month).padStart(2, '0');
    var wknd = d.dow === 'Sb' || d.dow === 'Nd';
    var hasH = d.hours !== null && d.hours !== undefined && !isNaN(parseFloat(d.hours));
    html += '<tr' + (wknd ? ' class="wknd"' : '') + '>';
    html += '<td><strong>' + esc(d.dow || '') + '</strong></td>';
    html += '<td>' + dn + '.' + mm + '</td>';
    html += '<td class="' + (d.wejscie ? 't-time' : 't-empty') + '">' + esc(d.wejscie || '—') + '</td>';
    html += '<td class="' + (d.wyjscie ? 't-time' : (d.wejscie ? 't-miss' : 't-empty')) + '">';
    html += d.wyjscie ? esc(d.wyjscie) : (d.wejscie ? 'brak !' : '—');
    html += '</td>';
    html += '<td class="' + (hasH ? 't-hours' : 't-empty') + '">' + (hasH ? nf(d.hours) + 'h' : '—') + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById('emp-data').innerHTML = html;
}

// ── CSV ───────────────────────────────────────────────────────

document.getElementById('btn-csv').addEventListener('click', function() {
  if (!S.token) return;
  toast('Generowanie CSV…', true);
  gas('dashExportCsv', [S.token, S.year, S.month], function(res) {
    if (!res || !res.ok) { toast('Błąd eksportu.', false); return; }
    var blob = new Blob([res.csv], { type: 'text/csv;charset=utf-8;' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = 'WeSMILE_' + MONTHS[S.month-1] + '_' + S.year + '.csv';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    toast('CSV pobrany!', true);
  });
});

// ── Wyloguj ───────────────────────────────────────────────────

function doLogout() {
  S.token = null; S.data = null; S.selId = null;
  lPin = ''; setDots('');
  document.getElementById('emp-input').value = '';
  document.getElementById('etat-inp').value = '';
  document.getElementById('emp-data').innerHTML =
    '<div class="hint">Wybierz pracownika z listy powyżej</div>';
  document.getElementById('dash').style.display  = 'none';
  document.getElementById('login').style.display = 'flex';
}

document.getElementById('btn-logout').addEventListener('click', doLogout);
</script>
</body>
</html>
