<script>
let currentModule = null;
const MODULES = {
  pulpit:     { title: 'Pulpit',      icon: 'layout-dashboard',   file: 'Pulpit' },
  zadania:    { title: 'Zadania',     icon: 'check-square',        file: 'Zadania' },
  wiedza:     { title: 'Baza Wiedzy', icon: 'book-open',           file: 'Wiedza' },
  chat:       { title: 'Chat Claude', icon: 'message-square-plus', file: 'Chat' },
  terminarz:  { title: 'Terminarz',   icon: 'calendar',            file: 'Terminarz' },
  personel:   { title: 'Personel',    icon: 'users',               file: 'Personel' },
  ustawienia: { title: 'Ustawienia',  icon: 'settings',            file: 'Ustawienia' }
};

function navigateTo(module) {
  currentModule = module;
  const config = MODULES[module];
  if (!config) return;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.remove('bg-[rgba(0,122,255,0.1)]', 'text-[#007aff]');
    el.classList.add('text-[#000]');
  });
  const activeNav = document.getElementById('nav-' + module);
  if (activeNav) {
    activeNav.classList.add('bg-[rgba(0,122,255,0.1)]', 'text-[#007aff]');
    activeNav.classList.remove('text-[#000]');
  }
  const mobileTitle = document.getElementById('mobile-title');
  if (mobileTitle) mobileTitle.textContent = config.title;
  document.getElementById('content').innerHTML =
    '<div class="flex items-center justify-center h-full"><div class="text-center">' +
    '<div class="animate-pulse text-5xl mb-4">🧠</div>' +
    '<div class="text-[15px] text-[#8e8e93]">Ładowanie ' + escapeHtml(config.title) + '...</div>' +
    '</div></div>';
  google.script.run
    .withSuccessHandler(function(html) {
      document.getElementById('content').innerHTML = html;
      lucide.createIcons();
      initTooltips();
      if (typeof initModule === 'function') initModule();
    })
    .withFailureHandler(function(err) {
      showError('Błąd ładowania modułu: ' + err.message);
    })
    .getModuleHtml(config.file);
  if (window.innerWidth < 768) toggleMobileSidebar();
}

const TRANSLATIONS = {
  'Pulpit': 'Dashboard', 'Zadania': 'Tasks', 'Baza Wiedzy': 'Knowledge Base',
  'Chat Claude': 'Claude Chat', 'Terminarz': 'Calendar', 'Personel': 'Staff View',
  'Ustawienia': 'Settings', 'Zapisz': 'Save', 'Anuluj': 'Cancel', 'Usuń': 'Delete',
  'Edytuj': 'Edit', 'Dodaj': 'Add', 'Szukaj': 'Search',
  'Importuj z Drive': 'Import from Drive', 'Eksportuj': 'Export'
};

let tooltipTimer = null;
const tooltip = document.getElementById ? document.getElementById('tooltip') : null;

function initTooltips() {
  document.querySelectorAll('[data-tooltip]').forEach(el => {
    const polish = el.getAttribute('data-tooltip');
    const english = TRANSLATIONS[polish] || polish;
    el.addEventListener('mouseenter', function(e) {
      if (window.innerWidth < 768) return;
      tooltipTimer = setTimeout(() => {
        if (!tooltip) return;
        tooltip.textContent = english;
        tooltip.style.left = (e.clientX + 12) + 'px';
        tooltip.style.top = (e.clientY + 20) + 'px';
        tooltip.classList.remove('hidden');
      }, 3000);
    });
    el.addEventListener('mousemove', function(e) {
      if (tooltip && !tooltip.classList.contains('hidden')) {
        tooltip.style.left = (e.clientX + 12) + 'px';
        tooltip.style.top = (e.clientY + 20) + 'px';
      }
    });
    el.addEventListener('mouseleave', function() {
      clearTimeout(tooltipTimer);
      if (tooltip) tooltip.classList.add('hidden');
    });
  });
}

function showModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
  lucide.createIcons();
  initTooltips();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

function showToast(message, type) {
  type = type || 'success';
  const colors = { success: 'bg-[#34c759]', error: 'bg-[#ff3b30]', info: 'bg-[#007aff]', warning: 'bg-[#ff9500]' };
  const toast = document.createElement('div');
  toast.className = (colors[type] || colors.info) +
    ' text-white px-4 py-3 rounded-[12px] text-[15px] font-medium shadow-lg max-w-sm text-center animate-fade-in';
  toast.textContent = message;
  document.getElementById('toast-container').appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);
}

function showError(message) { showToast(message, 'error'); }
function showSuccess(message) { showToast(message, 'success'); }
function showInfo(message) { showToast(message, 'info'); }

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return String(dateStr);
  return d.toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatDateLong(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return String(dateStr);
  return d.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function formatTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
}

function formatDateTime(dateStr) {
  if (!dateStr) return '';
  return formatDate(dateStr) + ' ' + formatTime(dateStr);
}

function skeleton(lines) {
  lines = lines || 3;
  return Array(lines).fill(0).map(function(_, i) {
    return '<div class="mb-3"><div class="skeleton-line" style="width: ' + (i % 2 === 0 ? '75%' : '50%') + '"></div></div>';
  }).join('');
}

// Sanityzacja Markdown przez DOMPurify — ochrona przed XSS
function renderMarkdown(content) {
  if (!content) return '<div class="empty-state-text">Brak treści</div>';
  const rawHtml = marked.parse(String(content));
  const safeHtml = (typeof DOMPurify !== 'undefined')
    ? DOMPurify.sanitize(rawHtml)
    : rawHtml;
  return '<div class="markdown-content">' + safeHtml + '</div>';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text == null ? '' : text);
  return div.innerHTML;
}

function getPriorityBadge(priority) {
  const labels = { niski: 'Niski', normalny: 'Normalny', wysoki: 'Wysoki', pilne: 'Pilne' };
  const p = priority || 'normalny';
  return '<span class="badge badge-' + p + '">' + (labels[p] || p) + '</span>';
}

function getStatusBadge(status) {
  const labels = { 'todo': 'Do wykonania', 'inprogress': 'W trakcie', 'done': 'Ukończone' };
  const s = status || 'todo';
  return '<span class="badge badge-' + s + '">' + (labels[s] || s) + '</span>';
}
</script>
