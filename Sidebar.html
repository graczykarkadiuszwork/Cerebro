<!-- Sidebar -->
<div class="flex flex-col h-full">
  <!-- Logo -->
  <div class="px-4 py-5 border-b border-[#c6c6c8]">
    <div class="flex items-center gap-3">
      <span class="text-3xl">🧠</span>
      <div>
        <div class="text-[20px] font-bold text-[#007aff]">Cerebro</div>
        <div id="sidebar-org" class="text-[12px] text-[#8e8e93]">Pip-Boy — wdrożenie samodzielne</div>
      </div>
    </div>
  </div>

  <!-- Nawigacja -->
  <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
    <div class="text-[11px] font-semibold text-[#8e8e93] uppercase tracking-wider px-3 mb-2">
      Moduły
    </div>

    <!--
      Pulpit/Zadania/Baza Wiedzy/Chat Saver/Terminarz/Personel — ukryte
      celowo. Arek: "wdrożyć niezależnie Pip-Boya, hub łączący wszystkie
      moduły stworzymy później". Kod tych modułów (guziki, pliki .html,
      funkcje backendowe) NIE jest usunięty — zostaje nietknięty w
      repozytorium do czasu budowy huba, tylko chwilowo niewidoczny w
      nawigacji. Odsłonić: usuń atrybuty `hidden` I `style="display:none;"`
      z poniższych 6 przycisków (oba naraz — sam atrybut `hidden` nie
      wystarczy, bo klasa Tailwind `flex` na tym samym przycisku ma taką
      samą specyficzność CSS i wygrywa z domyślną regułą przeglądarki
      `[hidden]{display:none}`; stąd inline `style` jako rozstrzygnięcie).
    -->
    <button id="nav-pulpit" onclick="navigateTo('pulpit')" hidden style="display:none;"
      class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-[10px]
      text-[15px] font-medium transition-colors text-[#000] hover:bg-[rgba(120,120,128,0.08)]"
      data-tooltip="Pulpit">
      <i data-lucide="layout-dashboard" class="w-5 h-5 flex-shrink-0"></i>
      <span>Pulpit</span>
    </button>

    <button id="nav-zadania" onclick="navigateTo('zadania')" hidden style="display:none;"
      class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-[10px]
      text-[15px] font-medium transition-colors text-[#000] hover:bg-[rgba(120,120,128,0.08)]"
      data-tooltip="Zadania">
      <i data-lucide="check-square" class="w-5 h-5 flex-shrink-0"></i>
      <span>Zadania</span>
    </button>

    <button id="nav-wiedza" onclick="navigateTo('wiedza')" hidden style="display:none;"
      class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-[10px]
      text-[15px] font-medium transition-colors text-[#000] hover:bg-[rgba(120,120,128,0.08)]"
      data-tooltip="Baza Wiedzy">
      <i data-lucide="book-open" class="w-5 h-5 flex-shrink-0"></i>
      <span>Baza Wiedzy</span>
    </button>

    <button id="nav-chat" onclick="navigateTo('chat')" hidden style="display:none;"
      class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-[10px]
      text-[15px] font-medium transition-colors text-[#000] hover:bg-[rgba(120,120,128,0.08)]"
      data-tooltip="Chat Saver">
      <i data-lucide="message-square-plus" class="w-5 h-5 flex-shrink-0"></i>
      <span>Chat Saver</span>
    </button>

    <button id="nav-terminarz" onclick="navigateTo('terminarz')" hidden style="display:none;"
      class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-[10px]
      text-[15px] font-medium transition-colors text-[#000] hover:bg-[rgba(120,120,128,0.08)]"
      data-tooltip="Terminarz">
      <i data-lucide="calendar" class="w-5 h-5 flex-shrink-0"></i>
      <span>Terminarz</span>
    </button>

    <button id="nav-personel" onclick="navigateTo('personel')" hidden style="display:none;"
      class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-[10px]
      text-[15px] font-medium transition-colors text-[#000] hover:bg-[rgba(120,120,128,0.08)]"
      data-tooltip="Personel">
      <i data-lucide="users" class="w-5 h-5 flex-shrink-0"></i>
      <span>Personel</span>
    </button>

    <button id="nav-pipboy" onclick="navigateTo('pipboy')"
      class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-[10px]
      text-[15px] font-medium transition-colors text-[#000] hover:bg-[rgba(120,120,128,0.08)]"
      data-tooltip="Pip-Boy">
      <i data-lucide="terminal" class="w-5 h-5 flex-shrink-0"></i>
      <span>Pip-Boy</span>
    </button>
  </nav>

  <!-- Dół sidebara -->
  <div class="px-3 py-4 border-t border-[#c6c6c8] space-y-1">
    <button id="nav-ustawienia" onclick="navigateTo('ustawienia')"
      class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-[10px]
      text-[15px] font-medium transition-colors text-[#000] hover:bg-[rgba(120,120,128,0.08)]"
      data-tooltip="Ustawienia">
      <i data-lucide="settings" class="w-5 h-5 flex-shrink-0"></i>
      <span>Ustawienia</span>
    </button>

    <!-- Status -->
    <div id="connection-status" class="flex items-center gap-2 px-3 py-2 text-[13px] text-[#8e8e93]">
      <div class="w-2 h-2 rounded-full bg-[#34c759]"></div>
      <span>Połączono</span>
    </div>
  </div>
</div>

<script>
  // Karta "Organizacja" w Ustawieniach jest teraz ukryta (samodzielne
  // wdrożenie Pip-Boya — patrz komentarz w nawigacji wyżej), więc etykieta
  // organizacji nie jest już pobierana ani nadpisywana tutaj; podpis
  // "Pip-Boy — wdrożenie samodzielne" (ustawiony w HTML wyżej) zostaje na stałe.
</script>
