<div class="max-w-6xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-[#000]">Baza Wiedzy</h1>
    <button onclick="showAddArticleModal()" class="btn-primary w-auto flex items-center gap-2" style="width: auto;">
      <i data-lucide="plus" class="w-5 h-5"></i>Dodaj
    </button>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 h-[70vh]">
    <div class="md:col-span-1 bg-white rounded-[12px] shadow-sm overflow-hidden flex flex-col">
      <div class="px-4 py-3 border-b border-[#e5e5ea]"><h3 class="text-[15px] font-semibold">Kategorie</h3></div>
      <div id="categories-list" class="flex-1 overflow-y-auto">${skeleton(5)}</div>
    </div>
    <div class="md:col-span-1 bg-white rounded-[12px] shadow-sm overflow-hidden flex flex-col">
      <div class="px-4 py-3 border-b border-[#e5e5ea]"><h3 class="text-[15px] font-semibold">Artykuły</h3></div>
      <div id="articles-list" class="flex-1 overflow-y-auto">${skeleton(5)}</div>
    </div>
    <div class="md:col-span-2 bg-white rounded-[12px] shadow-sm overflow-hidden flex flex-col">
      <div class="px-4 py-3 border-b border-[#e5e5ea] flex items-center justify-between">
        <h3 class="text-[15px] font-semibold">Podgląd</h3>
        <button id="edit-btn" onclick="showEditArticleModal()" class="btn-small btn-secondary hidden">Edytuj</button>
      </div>
      <div id="preview-content" class="flex-1 overflow-y-auto p-4">
        <div class="empty-state">
          <div class="empty-state-icon">📖</div>
          <div class="empty-state-title">Wybierz artykuł</div>
          <div class="empty-state-text">Kliknij na artykuł z listy, aby przeczytać treść</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script id="article-modal-template" type="text/template">
<div class="modal-sheet"><div class="modal-handle"></div><div class="px-6 py-4">
<h2 class="text-[20px] font-bold mb-4">{{ title }}</h2>
<div class="space-y-4 max-h-[70vh] overflow-y-auto">
  <div><label class="block text-[13px] font-semibold text-[#8e8e93] mb-2">Tytuł *</label>
  <input type="text" id="modal-art-title" class="ios-input" placeholder="Wpisz tytuł..."></div>
  <div><label class="block text-[13px] font-semibold text-[#8e8e93] mb-2">Kategoria</label>
  <select id="modal-art-category" class="ios-select">
    <option value="notatki">Notatki</option>
    <option value="procedury">Procedury</option>
    <option value="cenniki">Cenniki</option>
    <option value="szablony">Szablony</option>
    <option value="materialy">Materiały</option>
    <option value="inne">Inne</option>
  </select></div>
  <div><label class="block text-[13px] font-semibold text-[#8e8e93] mb-2">Treść (Markdown)</label>
  <textarea id="modal-art-content" class="ios-textarea" placeholder="Wpisz treść (obsługiwany Markdown)..." style="min-height: 200px;"></textarea></div>
  <div><label class="block text-[13px] font-semibold text-[#8e8e93] mb-2">Tagi</label>
  <input type="text" id="modal-art-tags" class="ios-input" placeholder="oddzielone przecinkami"></div>
  <div><label class="block text-[13px] font-semibold text-[#8e8e93] mb-2">Widoczność</label>
  <select id="modal-art-visibility" class="ios-select">
    <option value="prywatny">Prywatny</option>
    <option value="udostepniony">Udostępniony</option>
  </select></div>
  <div class="flex gap-3 pt-4">
    <button onclick="closeModal(); saveArticle();" class="btn-primary">Zapisz</button>
    <button onclick="confirmDeleteArticle()" id="delete-art-btn" class="btn-destructive hidden">Usuń</button>
    <button onclick="closeModal()" class="btn-secondary">Anuluj</button>
  </div>
</div></div></div>
</script>

<script>
let allArticles = [];
let selectedCategory = 'wszystkie';
let selectedArticleId = null;

function initModule() { loadArticles(); }

function loadArticles() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        allArticles = result.data;
        renderCategories();
        filterArticles();
      } else {
        showError('Błąd: ' + result.error);
      }
    })
    .withFailureHandler(function(err) { showError('Błąd połączenia: ' + err.message); })
    .getKnowledge();
}

function renderCategories() {
  const categories = [...new Set(allArticles.map(function(a) { return a.kategoria || 'notatki'; }))].sort();
  const html = '<div class="ios-row cursor-pointer ' + (selectedCategory === 'wszystkie' ? 'bg-[rgba(0,122,255,0.1)]' : '') +
    '" onclick="selectedCategory = \'wszystkie\'; renderCategories(); filterArticles();">' +
    '<div>Wszystkie</div><span class="text-[13px] text-[#8e8e93] ml-auto">' + allArticles.length + '</span></div>' +
    categories.map(function(cat) {
      const count = allArticles.filter(function(a) { return a.kategoria === cat; }).length;
      return '<div class="ios-row cursor-pointer ' + (selectedCategory === cat ? 'bg-[rgba(0,122,255,0.1)]' : '') +
        '" onclick="selectedCategory = \'' + escapeHtml(cat) + '\'; renderCategories(); filterArticles();">' +
        '<div>' + escapeHtml(cat) + '</div><span class="text-[13px] text-[#8e8e93] ml-auto">' + count + '</span></div>';
    }).join('');
  document.getElementById('categories-list').innerHTML = html;
}

function filterArticles() {
  const filtered = selectedCategory === 'wszystkie'
    ? allArticles
    : allArticles.filter(function(a) { return a.kategoria === selectedCategory; });
  renderArticlesList(filtered);
}

function renderArticlesList(articles) {
  if (articles.length === 0) {
    document.getElementById('articles-list').innerHTML =
      '<div class="empty-state py-4"><div class="empty-state-text">Brak artykułów</div></div>';
    return;
  }
  document.getElementById('articles-list').innerHTML = articles.map(function(a) {
    return '<div class="ios-row cursor-pointer ' + (selectedArticleId === a.id ? 'bg-[rgba(0,122,255,0.1)]' : '') +
      '" onclick="selectArticle(\'' + escapeHtml(a.id) + '\')">' +
      '<div class="flex-1 min-w-0">' +
      '<div class="text-[14px] font-medium text-[#000] truncate">' + escapeHtml(a.tytul) + '</div>' +
      '<div class="text-[12px] text-[#8e8e93]">' + escapeHtml(a.kategoria || 'brak') + '</div>' +
      '</div></div>';
  }).join('');
}

function selectArticle(articleId) {
  selectedArticleId = articleId;
  const article = allArticles.find(function(a) { return a.id === articleId; });
  if (!article) return;
  // Odświeżamy listę aby zaktualizować podświetlenie
  filterArticles();
  const html = '<div class="space-y-4">' +
    '<div><h2 class="text-[20px] font-bold">' + escapeHtml(article.tytul) + '</h2>' +
    '<div class="flex gap-2 mt-2">' +
    '<span class="text-[13px] text-[#8e8e93]">📁 ' + escapeHtml(article.kategoria || 'notatki') + '</span>' +
    (article.widocznosc === 'udostepniony'
      ? '<span class="text-[13px] text-[#34c759]">👁️ Udostępniony</span>'
      : '<span class="text-[13px] text-[#8e8e93]">🔒 Prywatny</span>') +
    '</div>' +
    (article.tagi ? '<div class="text-[13px] text-[#8e8e93] mt-2">Tagi: ' + escapeHtml(article.tagi) + '</div>' : '') +
    '</div><div class="divider"></div>' +
    renderMarkdown(article.tresc) +
    (article.zrodlo ? '<div class="text-[13px] text-[#8e8e93] mt-4 pt-4 border-t">Źródło: ' + escapeHtml(article.zrodlo) + '</div>' : '') +
    '</div>';
  document.getElementById('preview-content').innerHTML = html;
  document.getElementById('edit-btn').classList.remove('hidden');
}

function showAddArticleModal() {
  window.editingArticleId = null;
  const tpl = document.getElementById('article-modal-template').innerHTML.replace('{{ title }}', 'Dodaj artykuł');
  const div = document.createElement('div');
  div.innerHTML = tpl;
  showModal(div.innerHTML);
  document.getElementById('delete-art-btn').classList.add('hidden');
}

function showEditArticleModal() {
  if (!selectedArticleId) return;
  window.editingArticleId = selectedArticleId;
  const article = allArticles.find(function(a) { return a.id === selectedArticleId; });
  if (!article) return;
  const tpl = document.getElementById('article-modal-template').innerHTML.replace('{{ title }}', 'Edytuj artykuł');
  const div = document.createElement('div');
  div.innerHTML = tpl;
  showModal(div.innerHTML);
  document.getElementById('modal-art-title').value = article.tytul;
  document.getElementById('modal-art-category').value = article.kategoria || 'notatki';
  document.getElementById('modal-art-content').value = article.tresc || '';
  document.getElementById('modal-art-tags').value = article.tagi || '';
  document.getElementById('modal-art-visibility').value = article.widocznosc || 'prywatny';
  document.getElementById('delete-art-btn').classList.remove('hidden');
}

function confirmDeleteArticle() {
  if (!window.editingArticleId) return;
  if (!confirm('Czy na pewno chcesz usunąć ten artykuł?')) return;
  const id = window.editingArticleId;
  closeModal();
  deleteArticle(id);
}

function saveArticle() {
  const title = document.getElementById('modal-art-title').value.trim();
  if (!title) { showError('Tytuł jest wymagany'); return; }
  const articleData = {
    tytul: title,
    kategoria: document.getElementById('modal-art-category').value,
    tresc: document.getElementById('modal-art-content').value,
    tagi: document.getElementById('modal-art-tags').value,
    widocznosc: document.getElementById('modal-art-visibility').value
  };
  if (window.editingArticleId) {
    articleData.id = window.editingArticleId;
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) { showSuccess('Artykuł zaktualizowany'); loadArticles(); }
        else showError('Błąd: ' + result.error);
      })
      .withFailureHandler(function(err) { showError('Błąd połączenia: ' + err.message); })
      .updateKnowledge(articleData);
  } else {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) { showSuccess('Artykuł dodany'); loadArticles(); }
        else showError('Błąd: ' + result.error);
      })
      .withFailureHandler(function(err) { showError('Błąd połączenia: ' + err.message); })
      .createKnowledge(articleData);
  }
}

function deleteArticle(articleId) {
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        showSuccess('Artykuł usunięty');
        selectedArticleId = null;
        document.getElementById('preview-content').innerHTML =
          '<div class="empty-state"><div class="empty-state-icon">📖</div>' +
          '<div class="empty-state-title">Wybierz artykuł</div>' +
          '<div class="empty-state-text">Kliknij na artykuł z listy, aby przeczytać treść</div></div>';
        document.getElementById('edit-btn').classList.add('hidden');
        loadArticles();
      } else {
        showError('Błąd: ' + result.error);
      }
    })
    .withFailureHandler(function(err) { showError('Błąd połączenia: ' + err.message); })
    .deleteKnowledge(articleId);
}
</script>
